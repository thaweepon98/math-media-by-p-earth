            `<b>The original A</b>: to find the cofactors of row ${j} we crossed out row ${j} (faded) · the det A formula multiplies by row ${j}’s own numbers (${rowJ}), but this entry multiplies by row ${i} (blue) → <b>it is not det A</b><br>But if we <b>put the multipliers (${rowI}) where row ${j} was crossed out</b>, it becomes the det formula of a new matrix → press next`)
        : T(`<b>A เดิม</b>: ตอนหาโคแฟกเตอร์แถว ${j} เราตัดแถว ${j} ทิ้ง (จาง) · ตำแหน่งนี้คูณด้วยเลขแถว ${i} ซึ่งก็คือ<b>แถวที่ตัดทิ้งนั่นเอง</b> → นี่คือสูตรหา det A พอดี → กดถัดไป`,
            `<b>The original A</b>: to find the cofactors of row ${j} we crossed out row ${j} (faded) · this entry multiplies by row ${i}, which is <b>the very row we crossed out</b> → this is exactly the det A formula → press next`);
      return `<div class="mx-row"><span class="note">${tx(T('A เดิม', 'Original A'))}</span>${mA}</div><div class="mx-calc"><span>${tx(T(`ตำแหน่ง (${i}, ${j})`, `entry (${i}, ${j})`))} = ${sum}</span></div><div class="ar-note ap-t">${tx(note)}</div>`;
    }

    const NP = mMul(N, CF_ADJ);

    const nA = tx(T('A ใหม่', 'new A'));
    const link = twin
      ? T(`ตำแหน่ง (${j}, ${j}) = แถว ${j} ของ A ใหม่ (ฟ้า) × โคแฟกเตอร์แถว ${j} (ส้ม) = <b>det(A ใหม่)</b> · A ใหม่มี<b>แถว ${Math.min(i, j)} กับแถว ${Math.max(i, j)} ซ้ำกัน</b> → ลูกศรทับกัน รูปแบน → <b>det(A ใหม่) = 0</b> · ค่าที่คูณไม่ได้เปลี่ยน แค่มองเป็น det ของ A ใหม่`,
          `Entry (${j}, ${j}) = row ${j} of new A (blue) × the row-${j} cofactors (orange) = <b>det(new A)</b> · new A has <b>rows ${Math.min(i, j)} and ${Math.max(i, j)} the same</b> → the arrows lie on top of each other, the shape is flat → <b>det(new A) = 0</b> · the numbers being multiplied did not change; we only read them as the det of new A`)
      : T(`A ใหม่ = A เดิม → แถว ${j} คูณโคแฟกเตอร์แถว ${j} ของตัวเอง = <b>det A = ${qHtml(CF_DET)}</b>`, `new A = A → row ${j} times its own row-${j} cofactors = <b>det A = ${qHtml(CF_DET)}</b>`);
    const concl = twin ? `<div class="mx-chk ok ap-k">${tx(T('ทุกตำแหน่งรอบนอก (นอกทแยง) ของ A · adj A ก็มี A ใหม่ที่มีแถวซ้ำแบบนี้ → det(A ใหม่) = 0 → <b>รอบนอก = 0 หมด</b> → A · adj A = (det A) I', 'Every entry around the outside (off the diagonal) of A · adj A has a new A with a repeated row like this → det(new A) = 0 → <b>the outside is all 0</b> → A · adj A = (det A) I'))}</div>` : '';
    return `<div class="mx-row"><span class="note">${tx(T(`A ใหม่ (แถว ${j} ← แถว ${i})`, `New A (row ${j} ← row ${i})`))}</span>${mN}</div><div class="mx-calc"><span>${tx(T(`ตำแหน่ง (${i}, ${j})`, `entry (${i}, ${j})`))} = ${sum} = det(${nA}) = <b style="color:${col}">${qHtml(val)}</b></span></div>` +
      `<div class="mx-row ap-np"><span class="mx">${nA} · <i>C</i>${AT}</span>${xop('=')}${matHtml(N, { key: 'N1', cls: r => (r === J ? 'hb' : '') })}<span class="ap-ct">${matHtml(CF_C, { key: 'C2', cls: r => (r === J ? 'ho' : '') })}<sup class="tsup ap-sup">t</sup></span></div>` +
      `<div class="mx-row ap-np">${xop('=')}<span class="mx">${nA} · adj <i>A</i></span>${xop('=')}${matHtml(N, { key: 'N2', cls: r => (r === J ? 'hb' : '') })}${matHtml(CF_ADJ, { key: 'J2', cls: (r, c) => (c === J ? 'ho' : '') })}<span class="mx ap-res">→ ${tx(T(`ตำแหน่ง (${j}, ${j})`, `entry (${j}, ${j})`))} = det(${nA}) = <b style="color:${col}">${qHtml(val)}</b></span></div><div class="mx-calc"><span>${tx(link)}</span></div>${concl}`;
  };
  const paintScene = fade => {
    const st = q('.ap-stg'); st.innerHTML = scene();
    if (fade && !matchMedia('(prefers-reduced-motion: reduce)').matches) { st.style.opacity = 0; requestAnimationFrame(() => { st.style.transition = 'opacity .35s'; st.style.opacity = 1; setTimeout(() => { st.style.transition = ''; }, 400); }); }
    q('.ap-prev').disabled = K === 0; q('.ap-next').disabled = K === 1;
    q('.ap-cnt').textContent = tx(T(`ฉากที่ ${K + 1} / 2`, `Scene ${K + 1} / 2`));
  };
  const paint = () => {

    q('.ap-c').innerHTML = `<span class="mx"><i>A</i> · <i>C</i>${AT}</span>${xop('=')}${matHtml(CF_M, { key: 'A1', cls: r => (r === I ? 'hb' : '') })}<span class="ap-ct">${matHtml(CF_C, { key: 'C', cls: r => (r === J ? 'ho' : '') })}<sup class="tsup ap-sup">t</sup></span>`;

      matHtml(CF_ADJ, { key: 'J', cls: (r, c) => (c === J ? 'ho' : '') }) + xop('=') +
      `<span class="ap-pick">${matHtml(PD_P, { key: 'PP', cls: (r, c) => (r === I && c === J ? 'hg' : '') })}</span>`;

    q('.ap-s').innerHTML =

      `<span>② ${tx(T(`adj A = C<sup class="tsup">t</sup>: <b>แถว ${j} ของ C</b> (ส้ม) พลิกลงมาเป็น<b>หลัก ${j} ของ adj A</b> = โคแฟกเตอร์ของแถว ${j}`, `adj A = C<sup class="tsup">t</sup>: <b>row ${j} of C</b> (orange) is flipped down into <b>column ${j} of adj A</b> = the cofactors of row ${j}`))} = (${[0, 1, 2].map(k => cij(J, k)).join(', ')}) = (${CF_C[J].map(qHtml).join(', ')})</span><br>` +
      `<span>③ ${tx(T(`แถว ${i} × โคแฟกเตอร์แถว ${j} ได้อะไร — ดูทีละฉากด้านล่าง`, `what row ${i} × the cofactors of row ${j} gives — see the two scenes below`))}</span>`;

  };

  q('.ap-next').onclick = () => { if (K < 1) { K++; paintScene(true); } };
  const w = { refresh: paint }; LIVE.push(w); paint();
  return w;
