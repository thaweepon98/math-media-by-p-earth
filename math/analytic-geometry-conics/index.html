<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เรขาคณิตวิเคราะห์และภาคตัดกรวย — รวมสื่อการสอน by P'Earth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

:root {
  --primary: #1C3B22;
  --secondary: #FF8A3D;
  --accent: #68EF3F;
  --bg: #F3F7EC;
  --card: #FFFFFF;
  --text: #2D3748;
  --muted: #718096;
  --border: #E2E8F0;
  --shadow: 0 4px 24px rgba(28,59,34,0.10);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%);
  color: white;
  padding: 32px 24px 28px;
  text-align: center;
  position: relative;
}

header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
header p { font-size: 0.95rem; opacity: 0.9; }
.lang-toggle {
  position: absolute;
  top: 12px; right: 20px;
  background: rgba(255,255,255,.15);
  color: white;
  border: 1.5px solid rgba(255,255,255,.5);
  border-radius: 20px;
  padding: 5px 14px;
  font-family: 'Sarabun', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  cursor: pointer;
  z-index: 2;
}
.lang-toggle:hover { background: rgba(255,255,255,.28); }

.crumb {
  max-width: 1000px;
  margin: 20px auto 0;
  padding: 0 24px;
}
.crumb a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
}
.crumb a:hover { text-decoration: underline; }

main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 20px;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(28,59,34,0.18);
}

.card .icon { font-size: 2.2rem; }
.card .title { font-size: 1.1rem; font-weight: 700; }
.card .desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.card .tag {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--primary);
  background: #E3F3D8;
  border-radius: 999px;
  padding: 3px 10px;
}

.card-disabled { opacity: .55; cursor: default; position: relative; }
.card-disabled:hover { transform: none; box-shadow: var(--shadow); }
.badge-soon {
  align-self: flex-start;
  font-size: .7rem;
  font-weight: 700;
  color: var(--muted);
  background: var(--border);
  border-radius: 999px;
  padding: 2px 10px;
}

.empty-note {
  color: var(--muted);
  font-size: 0.9rem;
  margin-top: 16px;
}
</style>
</head>
<body>

<header>
  <button id="langToggle" class="lang-toggle" onclick="toggleLang()">EN</button>
  <h1 data-th="📐 เรขาคณิตวิเคราะห์และภาคตัดกรวย" data-en="📐 Analytic Geometry &amp; Conic Sections">📐 เรขาคณิตวิเคราะห์และภาคตัดกรวย</h1>
  <p data-th="ระยะทาง จุดกึ่งกลาง ความชัน ไปจนถึงวงกลม พาราโบลา วงรี และไฮเพอร์โบลา" data-en="From distance and slope to circles, parabolas, ellipses, and hyperbolas">ระยะทาง จุดกึ่งกลาง ความชัน ไปจนถึงวงกลม พาราโบลา วงรี และไฮเพอร์โบลา</p>
</header>

<div class="crumb"><a href="../index.html" data-th="← กลับหน้าคณิตศาสตร์" data-en="← Back to Mathematics">← กลับหน้าคณิตศาสตร์</a></div>

<main>
  <div id="topicGrid" class="grid"></div>
  <p id="emptyNote" class="empty-note" style="display:none;" data-th="ยังไม่มีสื่อ" data-en="No materials yet">ยังไม่มีสื่อ</p>
</main>

<script>
// ── ปุ่มสลับภาษาไทย/อังกฤษ (โค้ดชุดนี้ฝังซ้ำในทุกหน้าของเว็บ) ──
const PAGE_TITLE = { th: "เรขาคณิตวิเคราะห์และภาคตัดกรวย — รวมสื่อการสอน by P'Earth", en: "Analytic Geometry & Conic Sections — Teaching Materials by P'Earth" };

let langMemory = 'th';
function getLang() {
  try { return localStorage.getItem('siteLang') || 'th'; }
  catch (e) { return langMemory; }
}
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => {
    el.textContent = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th;
  });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
function onLangChange(lang) { renderTopics(); }

// เพิ่มสื่อใหม่ในหมวดนี้: copy ไฟล์ html เข้าโฟลเดอร์นี้ (math/analytic-geometry-conics/) แล้วเพิ่ม object ในนี้ (ใส่ทั้ง _th และ _en)
// comingSoon:true = การ์ดจางๆ คลิกไม่ได้ ไว้แสดงหัวข้อที่ยังไม่ได้ทำ — พอสร้างไฟล์จริงแล้วให้เปลี่ยนเป็น false และเติม desc
const TOPICS = [
  { file: "analytic-geometry.html", title_th: "เรขาคณิตวิเคราะห์", title_en: "Analytic Geometry",
    desc_th: "ระยะทาง จุดกึ่งกลาง ความชัน เส้นขนาน-ตั้งฉาก สมการเส้นตรง และระยะห่างระหว่างจุด/เส้นตรง — ลากจุดดูกราฟจริงได้ทั้ง 7 หัวข้อ",
    desc_en: "Distance, midpoint, slope, parallel/perpendicular lines, line equations, and point/line distances — all 7 topics with draggable live graphs",
    icon: "📐", tags_th: ["เรขาคณิตวิเคราะห์"], tags_en: ["Analytic Geometry"], comingSoon: false },
  { file: "circle.html", title_th: "วงกลม", title_en: "Circle",
    desc_th: "ความหมายของภาคตัดกรวย นิยามวงกลม สมการมาตรฐานและทั่วไป พร้อมภาพระนาบตัดกรวยแบบ 3 มิติที่ลากมุมเอียงและหมุนมุมมองได้",
    desc_en: "Meaning of conic sections, the definition of a circle, standard & general form equations, with a draggable, rotatable 3D cone-and-plane visual",
    icon: "⭕", tags_th: ["ภาคตัดกรวย"], tags_en: ["Conic Sections"], comingSoon: false },
  { file: "parabola.html", title_th: "พาราโบลา", title_en: "Parabola",
    desc_th: "นิยามโฟกัส-ไดเรกตริกซ์ จุดยอด แกนสมมาตร เลตัสเรกตัม พร้อมภาพระนาบตัดกรวยแบบ 3 มิติที่ลากมุมเอียงและหมุนมุมมองได้",
    desc_en: "Focus-directrix definition, vertex, axis of symmetry, latus rectum, with a draggable, rotatable 3D cone-and-plane visual",
    icon: "🌙", tags_th: ["ภาคตัดกรวย"], tags_en: ["Conic Sections"], comingSoon: false },
  { file: "ellipse.html", title_th: "วงรี", title_en: "Ellipse",
    desc_th: "แกนเอก แกนโท จุดศูนย์กลาง โฟกัส ความเยื้องศูนย์กลาง พร้อมภาพระนาบตัดกรวยแบบ 3 มิติที่ลากมุมเอียงและหมุนมุมมองได้",
    desc_en: "Major/minor axis, center, foci, eccentricity, with a draggable, rotatable 3D cone-and-plane visual",
    icon: "🥚", tags_th: ["ภาคตัดกรวย"], tags_en: ["Conic Sections"], comingSoon: false },
  { file: "hyperbola.html", title_th: "ไฮเพอร์โบลา", title_en: "Hyperbola",
    desc_th: "แกนตามขวาง แกนสังยุค เส้นกำกับ โฟกัส พร้อมภาพระนาบตัดกรวยแบบ 3 มิติที่ลากมุมเอียงและหมุนมุมมองได้",
    desc_en: "Transverse/conjugate axis, asymptotes, foci, with a draggable, rotatable 3D cone-and-plane visual",
    icon: "🦋", tags_th: ["ภาคตัดกรวย"], tags_en: ["Conic Sections"], comingSoon: false }
];

function renderTopics() {
  const lang = getLang();
  const grid = document.getElementById("topicGrid");
  if (TOPICS.length === 0) {
    document.getElementById("emptyNote").style.display = "block";
    return;
  }
  grid.innerHTML = TOPICS.map(t => {
    const title = lang === 'en' ? t.title_en : t.title_th;
    const desc = lang === 'en' ? t.desc_en : t.desc_th;
    const tags = (lang === 'en' ? t.tags_en : t.tags_th).map(tag => `<span class="tag">${tag}</span>`).join("");
    if (t.comingSoon) {
      return `
        <div class="card card-disabled">
          <div class="icon">${t.icon}</div>
          <div class="title">${title}</div>
          <div class="desc">${desc}</div>
          <div class="tags">${tags}</div>
          <span class="badge-soon">${lang === 'en' ? 'Coming soon' : 'เร็วๆ นี้'}</span>
        </div>`;
    }
    return `
      <a class="card" href="./${t.file}">
        <div class="icon">${t.icon}</div>
        <div class="title">${title}</div>
        <div class="desc">${desc}</div>
        <div class="tags">${tags}</div>
      </a>`;
  }).join("");
}

renderTopics();
applyLang(getLang());
</script>

</body>
</html>
