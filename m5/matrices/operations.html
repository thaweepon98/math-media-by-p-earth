  const outer = a2 > 0 ? `<g style="opacity:${a2}"><path d="M45 36 Q142 -6 239 36" fill="none" style="stroke:var(--g-purple);stroke-width:3;stroke-linecap:round"/><text x="142" y="12" text-anchor="middle" style="font-size:15px;fill:${pu}">${tx(T('ตัวนอก = มิติของผล 2 × 1', 'outer numbers = size of the product 2 × 1'))}</text></g>` : '';

// ข้อความคำนวณช่อง (i, j) ของ AB: (a)(b) + (a)(b) = p + p = ผล · parts = จำนวนส่วนที่เผยแล้ว (ไว้ให้ค่อยๆ โผล่ — คงพื้นที่ไว้)

}
// A · B = R  — st = { dims: null | [a1, a2] · r: [แถวที่เติมผลแล้ว] · tbl: null | { i, vis } }
// "โต๊ะคูณ" แยกใต้สมการ (ไม่ทับเมทริกซ์): เลขจากแถว i ของ A (น้ำเงิน) กับหลักของ B (ส้ม) วางเรียงให้คู่ที่ทาบกันอยู่บรรทัดเดียวกัน → a × b = ผล (เขียว) → บรรทัดสรุปผลรวม

// เล่นแถว i: แถวของ A (ชิปน้ำเงิน) บินลงมาโต๊ะแล้วหมุนตั้ง · หลักของ B (ชิปส้ม) บินลงมาวางข้างๆ → คูณทีละคู่ → 6 + 1 = 7 บินขึ้นไปลงช่องผล

      o: [M(r3), M([[4, -9], [-4, 12]]), M(mAdd(mScale(a3, 3), mScale(b3, 2))), M(mSub(mScale(a3, 3), b3))], a: 0,
      e: T(`3A = ${M(mScale(a3, 3))} · 2B = ${M(mScale(b3, 2))} → ลบกันตามตำแหน่ง ได้ ${M(r3)} · ตัวที่ช่องซ้ายล่างเป็น −4 ลืมว่า 0 − (−4) = 4 · ตัวที่เหลือ บวกแทนลบ หรือคูณ B ด้วย 1 แทน 2`, `3A = ${M(mScale(a3, 3))} · 2B = ${M(mScale(b3, 2))} → subtract position by position to get ${M(r3)} · the one with −4 in the lower left forgot that 0 − (−4) = 4 · the others add instead of subtract, or multiply B by 1 instead of 2`) },
    { q: T('A มิติ 3 × 2 และ B มิติ 2 × 5 ข้อใดถูกต้อง', 'A is 3 × 2 and B is 2 × 5 — which statement is correct'),
      o: [T('AB คูณได้ ผลมิติ 3 × 5', 'AB exists and is 3 × 5'), T('AB คูณได้ ผลมิติ 2 × 2', 'AB exists and is 2 × 2'), T('AB คูณไม่ได้ เพราะ 3 ≠ 5', 'AB does not exist because 3 ≠ 5'), T('BA คูณได้ ผลมิติ 5 × 3', 'BA exists and is 5 × 3')], a: 0,
      e: T('AB: ตัวใน 2 กับ 2 เท่ากัน → คูณได้ ตัวนอก 3 × 5 คือมิติผล · มิติผล 2 × 2 คือการเอาตัวในมาเป็นผล · BA: ตัวใน 5 กับ 3 ไม่เท่ากัน จึงคูณไม่ได้', 'AB: the inner numbers 2 and 2 match → it exists, and the outer numbers 3 × 5 are its size · 2 × 2 uses the inner numbers by mistake · BA: the inner numbers 5 and 3 differ, so BA does not exist') },
    { q: T(`${M(a5, { name: '<i>A</i>' })} ${M(b5, { name: '<i>B</i>' })}<br><i>AB</i> เท่ากับข้อใด`, `${M(a5, { name: '<i>A</i>' })} ${M(b5, { name: '<i>B</i>' })}<br>What is <i>AB</i>`),
      o: [M(r5), M(ba5), M(had5), M(mAdd(a5, b5))], a: 0,
      e: T(`นอนคูณตั้ง: ช่องแรก = (2)(1) + (−1)(5) = −3 · (2)(4) + (−1)(−2) = 10 · (3)(1) + (0)(5) = 3 · (3)(4) + (0)(−2) = 12 → ${M(r5)} · ${M(ba5)} คือ BA (สลับที่) · อีกสองตัวคือคูณทีละช่องตรงๆ และ A + B`, `Row times column: first entry = (2)(1) + (−1)(5) = −3 · (2)(4) + (−1)(−2) = 10 · (3)(1) + (0)(5) = 3 · (3)(4) + (0)(−2) = 12 → ${M(r5)} · ${M(ba5)} is BA (swapped order) · the other two multiply entry by entry, and A + B`) },
    { q: T(`${M(a6, { name: '<i>A</i>' })}<br>A<sup class="tsup">t</sup> เท่ากับข้อใด`, `${M(a6, { name: '<i>A</i>' })}<br>What is A<sup class="tsup">t</sup>`),
      o: [M(t6), M(a6), M([[3, 5, -1], [1, -2, 0]]), M([[1, -2], [0, 3], [5, -1]])], a: 0,
      e: T(`กลับแถวเป็นหลัก: แถว 1 (1, −2, 0) กลายเป็นหลัก 1 · แถว 2 (3, 5, −1) กลายเป็นหลัก 2 → 3 × 2 · ตัวที่ยังเป็น 2 × 3 ไม่ได้สลับมิติ · ตัวสุดท้ายแค่เรียงเลขเดิมใหม่ ไม่ได้กลับแถวเป็นหลัก`, `Turn rows into columns: row 1 (1, −2, 0) becomes column 1 · row 2 (3, 5, −1) becomes column 2 → 3 × 2 · the 2 × 3 ones did not swap the size · the last one just re-reads the numbers into a new shape instead of turning rows into columns`) },
    { q: T('ข้อใดเป็นเมทริกซ์สเกลาร์ที่ไม่ใช่เมทริกซ์เอกลักษณ์', 'Which is a scalar matrix that is not the identity matrix'),
      o: [M([[4, 0], [0, 4]]), M([[4, 0], [0, -4]]), M([[0, 4], [4, 0]]), M(mId(2))], a: 0,
      e: T('สเกลาร์ = ทแยงที่เลขเท่ากัน · [4 0; 0 4] เท่ากัน และไม่ใช่ 1 → ใช่ · [4 0; 0 −4] เป็นทแยงแต่เลขไม่เท่ากัน · [0 4; 4 0] สมมาตรแต่ไม่ใช่ทแยง · I เป็นสเกลาร์ที่เป็นเอกลักษณ์ ซึ่งโจทย์ตัดออก', 'Scalar = diagonal with equal numbers · [4 0; 0 4] has equal numbers and is not 1 → yes · [4 0; 0 −4] is diagonal but the numbers differ · [0 4; 4 0] is symmetric but not diagonal · I is a scalar matrix that is the identity, which the question rules out') },
    { q: T(`${M(a8, { name: '<i>A</i>' })} ${M(b8, { name: '<i>B</i>' })} ได้ ${M(ab8, { name: '<i>AB</i>' })}<br>(AB)<sup class="tsup">t</sup> เท่ากับข้อใด`, `${M(a8, { name: '<i>A</i>' })} ${M(b8, { name: '<i>B</i>' })} give ${M(ab8, { name: '<i>AB</i>' })}<br>What is (AB)<sup class="tsup">t</sup>`),
      o: [M(mT(ab8)), M(mMul(mT(a8), mT(b8))), M(ab8), M(ba8)], a: 0,
      e: T(`(AB)<sup class="tsup">t</sup> = B<sup class="tsup">t</sup>A<sup class="tsup">t</sup> (กระจายสลับที่) = ทรานสโพสของ AB = ${M(mT(ab8))} · ${M(mMul(mT(a8), mT(b8)))} คือ A<sup class="tsup">t</sup>B<sup class="tsup">t</sup> ซึ่งไม่เท่า · ${M(ab8)} ยังไม่ได้ทรานสโพส · ${M(ba8)} คือ BA และ AB ≠ BA`, `(AB)<sup class="tsup">t</sup> = B<sup class="tsup">t</sup>A<sup class="tsup">t</sup> (distribute and swap) = the transpose of AB = ${M(mT(ab8))} · ${M(mMul(mT(a8), mT(b8)))} is A<sup class="tsup">t</sup>B<sup class="tsup">t</sup>, which is different · ${M(ab8)} was not transposed · ${M(ba8)} is BA and AB ≠ BA`) }
  ];
}

// ═══════════════════════════════════════════════════════════════
//  ประกอบหน้า
// ═══════════════════════════════════════════════════════════════
function build() {
  opInjectCss(); xgroupWatch();
  const el = id => document.getElementById(id);
  const scenes = (id, sc, pr) => makeScenes(el(id), sc, { prompt: pr });
  // ── แท็บ 1: เมทริกซ์คืออะไร ──
  el('tab-what').innerHTML =
    card('🧮', d('จากตารางสู่เมทริกซ์: มิติและตำแหน่ง', 'From a table to a matrix: size and position'), '<div id="w-wh"></div>') +
    card('🖐️', d('ลองทำ: ปรับขนาด แล้วแตะดูตำแหน่ง', 'Try it: resize it, then tap to see positions'), '<div id="w-wt"></div>') +
    card('🎯', d('เกม: จิ้มให้ถูกช่อง', 'Game: tap the right entry'), '<div id="w-gm"></div>') +
    card('🟰', d('เมทริกซ์สองก้อนเท่ากันเมื่อไร', 'When are two matrices equal?'),
      `<div class="box-info">${d('A = B เมื่อ <b>มิติเท่ากัน</b> และ <b>ทุกช่องที่ตำแหน่งเดียวกันเท่ากัน</b>', 'A = B when they have <b>the same size</b> and <b>every pair of entries in the same position is equal</b>')}</div><div id="w-eq"></div>`);
  scenes('w-wh', WH_SC, T('กด ▶ ทีละฉาก — ดูตารางกลายเป็นเมทริกซ์', 'Press ▶ one scene at a time — watch the table turn into a matrix'));
  makeWhatTry(el('w-wt'));
  makeFindGame(el('w-gm'));
  makePredict(el('w-eq'), eqPredItems(), { label: T('โจทย์', 'Problem'), prompt: T('ดูเมทริกซ์สองก้อน แล้วทาย — เฉลยบนภาพหลังทาย', 'Look at the two matrices and guess — the answer shows on the picture afterwards') });

  // ── แท็บ 2: บวกลบ ──
  el('tab-add').innerHTML =
    card('➕', d('บวกกันตามตำแหน่ง', 'Add position by position'), '<div id="w-ad"></div>') +
    card('✖️', d('คูณสเกลาร์: เอาตัวเลขคูณทุกช่อง', 'Scalar multiple: multiply every entry'), '<div id="w-sc"></div>') +
    card('🪞', d('เมทริกซ์ศูนย์ และ −A', 'The zero matrix and −A'), '<div id="w-ng"></div>') +
    card('📐', d('ตัวอย่าง: 2A − B', 'Example: 2A − B'), `<div class="sc-prompt">${d('กำหนด A และ B ตามภาพ — กด “ถัดไป” ทีละขั้น', 'A and B are as shown — press “Next” one step at a time')}</div><div id="w-ex"></div>`) +
    card('🔮', d('ทายก่อน: ลบเมทริกซ์', 'Guess first: subtracting matrices'), '<div id="w-sp"></div>') +
    card('🖐️', d('ลองทำ: เปลี่ยนเลขแล้วดูผลสด', 'Try it: change the numbers and watch the result'), '<div id="w-at"></div>');
  scenes('w-ad', AD_SC, T('กด ▶ ทีละฉาก — ดูตัวเลขบินมารวมกัน', 'Press ▶ one scene at a time — watch the numbers fly together'));
  scenes('w-sc', SC_SC, T('กด ▶ ทีละฉาก — ดูเลข 3 บินเข้าไปคูณทีละช่อง', 'Press ▶ one scene at a time — watch the 3 fly in and multiply each entry'));
  scenes('w-ng', NG_SC, T('กด ▶ — ดูแต่ละคู่หักล้างกัน', 'Press ▶ — watch each pair cancel'));
  makeSteps(el('w-ex'), ex2ABrows);
  makePredict(el('w-sp'), [subPredItem()], { prompt: T('ดูเมทริกซ์สองก้อน แล้วทายผลของ A − B', 'Look at the two matrices and guess A − B') });
  makeAddTry(el('w-at'));

  // ── แท็บ 3: คูณ ──
  el('tab-mult').innerHTML =
    card('↔️', d('นอนคูณตั้ง', 'Row times column'), '<div id="w-mu"></div>') +
    card('📐', d('ตัวอย่างที่ 2: เผยทีละช่อง', 'Example 2: reveal one entry at a time'), `<div class="sc-prompt">${d('กด “ช่องถัดไป” — ดูว่าแต่ละช่องใช้แถวไหนคูณหลักไหน', 'Press “Next entry” — see which row times which column makes each entry')}</div><div id="w-mr"></div>`) +
    card('📐', d('ตัวอย่างที่ 3: 3 × 3 คูณ 3 × 3', 'Example 3: 3 × 3 times 3 × 3'), `<div class="sc-prompt">${d('กด “ช่องถัดไป” — 9 ช่อง ช่องละ 3 พจน์', 'Press “Next entry” — 9 entries, 3 terms each')}</div><div id="w-mr3"></div>`) +
    card('🔮', d('ทายก่อน: AB = BA ไหม', 'Guess first: is AB = BA?'), '<div id="w-cp"></div>') +
    card('🖐️', d('ลองทำ: แตะช่องของผลคูณ', 'Try it: tap an entry of the product'), '<div id="w-mt"></div>') +
    card('📏', d('เกมมิติ: คูณได้ไหม ผลมิติอะไร', 'Size game: does it exist, and what size is it?'),
      `<div class="box-info">${d('A เป็น <i>m</i> × <i>n</i> และ B เป็น <i>n</i> × <i>p</i> (ตัวในเท่ากัน) → AB เป็น <i>m</i> × <i>p</i> (ตัวนอก)', 'A is <i>m</i> × <i>n</i> and B is <i>n</i> × <i>p</i> (inner numbers equal) → AB is <i>m</i> × <i>p</i> (the outer numbers)')}</div><div id="w-dg"></div>`);
  scenes('w-mu', MU_SC, T('กด ▶ ทีละฉาก — ดูแถวบินลงโต๊ะคูณแล้วหมุนตั้ง', 'Press ▶ one scene at a time — watch the row fly down to the multiplication table and turn upright'));
  makeMulReveal(el('w-mr'), [[1, 2], [0, 3]], [[2, -1], [1, 4]]);
  makeMulReveal(el('w-mr3'), [[1, 2, 0], [-1, 3, 1], [2, 0, -2]], [[2, 1, -1], [0, 3, 1], [1, -2, 2]]);
  makePredict(el('w-cp'), [commPredItem()], { prompt: T('ดู A และ B แล้วทายว่า AB กับ BA เท่ากันไหม', 'Look at A and B and guess whether AB and BA are equal') });
  makeMulTry(el('w-mt'));
  makeDimGame(el('w-dg'));

  // ── แท็บ 4: ทรานสโพส ──
  el('tab-trans').innerHTML =
    card('🔄', d('ทรานสโพส: กลับแถวเป็นหลัก', 'Transpose: turn rows into columns'), '<div id="w-tr"></div>') +
    card('🔮', d('ทายก่อน: ทรานสโพส', 'Guess first: transposes'), '<div id="w-tp"></div>') +
    card('🖐️', d('ลองทำ: แตะแล้วพลิกข้ามทแยงหลัก', 'Try it: tap and flip across the main diagonal'), '<div id="w-tt"></div>');
  scenes('w-tr', TR_SC, T('กด ▶ ทีละฉาก — ดูแถวหมุนลงเป็นหลัก', 'Press ▶ one scene at a time — watch a row turn into a column'));
  makePredict(el('w-tp'), transPredItems(), { label: T('โจทย์', 'Problem'), prompt: T('เลือกโจทย์ แล้วทาย — เฉลยบนภาพ', 'Pick a problem and guess — the answer shows on the picture') });
  makeTransTry(el('w-tt'));

  // ── แท็บ 5: ชนิดพิเศษ ──
  el('tab-types').innerHTML =
    card('📦', d('กล่องซ้อนกัน: เอกลักษณ์ ⊂ สเกลาร์ ⊂ ทแยง ⊂ สมมาตร ⊂ จัตุรัส', 'Boxes inside boxes: identity ⊂ scalar ⊂ diagonal ⊂ symmetric ⊂ square'), '<div id="w-tn"></div>') +
    card('1️⃣', d('เมทริกซ์เอกลักษณ์: คูณแล้วได้ A เดิม', 'The identity matrix: multiplying gives A back'), '<div id="w-id"></div>') +
    card('📄', d('เมทริกซ์สมมาตร: พับตามทแยงหลัก', 'Symmetric matrices: fold along the main diagonal'), '<div id="w-sy"></div><div class="sc-prompt" style="margin-top:12px">' + d('ลองเอง', 'Try it yourself') + '</div><div id="w-sym"></div>') +
    card('🗂️', d('เกมคัดแยก: ใส่กล่องที่แคบที่สุด', 'Sorting game: the narrowest box'), '<div id="w-so"></div>');
  makeTypeNest(el('w-tn'));
  makeIdTry(el('w-id'));
  scenes('w-sy', SY_SC, T('กด ▶ ทีละฉาก — ดูช่องบินข้ามเส้นประไปทับกัน', 'Press ▶ one scene at a time — watch entries fly across the dashed line'));
  makeSymTry(el('w-sym'));
  makeSort(el('w-so'), TY_CARDS, [T('เอกลักษณ์', 'Identity'), T('สเกลาร์', 'Scalar'), T('ทแยง', 'Diagonal'), T('สมมาตร', 'Symmetric'), T('ไม่ใช่ทั้งหมด', 'None of these')], { colors: ['pink', 'green', 'orange', 'blue', 'red'], prompt: T('กดเมทริกซ์ แล้วกดกล่องที่แคบที่สุดที่ใส่ได้', 'Tap a matrix, then the narrowest box it fits in') });

  // ── แท็บ 6: สมบัติ ──
  const fm = (...p) => `<div class="formula">${p.map(x => `<span>${x}</span>`).join('')}</div>`;
  el('tab-props').innerHTML =
    card('🔀', d('สลับที่: บวกได้ คูณไม่ได้', 'Swapping order: addition yes, multiplication no'),
      fm('<i>A</i> + <i>B</i> = <i>B</i> + <i>A</i>', d('<i>AB</i> ไม่จำเป็นต้องเท่ากับ <i>BA</i>', '<i>AB</i> need not equal <i>BA</i>')) + '<div id="w-p1"></div>') +
    card('🧺', d('เปลี่ยนกลุ่ม', 'Regrouping'),
      fm('(<i>A</i> + <i>B</i>) + <i>C</i> = <i>A</i> + (<i>B</i> + <i>C</i>)', '(<i>AB</i>)<i>C</i> = <i>A</i>(<i>BC</i>)') + '<div id="w-p2"></div>') +
    card('🧮', d('แจกแจง', 'Distributing'),
      fm('<i>A</i>(<i>B</i> + <i>C</i>) = <i>AB</i> + <i>AC</i>', '(<i>A</i> + <i>B</i>)<i>C</i> = <i>AC</i> + <i>BC</i>') + '<div id="w-p3"></div>') +
    card('0️⃣', d('AB = O ไม่ได้แปลว่า A = O หรือ B = O', 'AB = O does not mean A = O or B = O'),
      fm(d('<i>AB</i> = <i>O</i> ไม่จำเป็นที่ <i>A</i> = <i>O</i> หรือ <i>B</i> = <i>O</i>', '<i>AB</i> = <i>O</i> does not force <i>A</i> = <i>O</i> or <i>B</i> = <i>O</i>')) + '<div id="w-p5"></div>') +
    card('🔁', d('ทรานสโพส: กระจายสลับที่', 'Transposes: distribute and swap'),
      '<div id="w-pt"></div>' + fm(`(<i>A</i> + <i>B</i>)${AT} = <i>A</i>${AT} + <i>B</i>${AT}`, `(<i>AB</i>)${AT} = <i>B</i>${AT}<i>A</i>${AT}`) + '<div id="w-p6"></div>') +
    card('🔮', d('ทายก่อน: ทรานสโพสสามตัว', 'Guess first: a transpose of three'), '<div id="w-pc"></div>');
  makePropCheck(el('w-p1'), PROP_SPECS.p1);
  makePropCheck(el('w-p2'), PROP_SPECS.p2);
  makePropCheck(el('w-p3'), PROP_SPECS.p3);
  makePropCheck(el('w-p5'), PROP_SPECS.p5);
  scenes('w-pt', PT_SC, T('กด ▶ ทีละฉาก — ดู A กับ B สลับที่กัน', 'Press ▶ one scene at a time — watch A and B swap places'));
  makePropCheck(el('w-p6'), PROP_SPECS.p6);
  makePredict(el('w-pc'), [transChainPredItem()], { prompt: T('ดูสามตัวคูณกัน แล้วทายผลของการทรานสโพส', 'Look at the product of three and guess its transpose') });

  // ── แท็บ 7: แบบฝึกหัด ──
  el('tab-quiz').innerHTML = card('🎯', d('แบบฝึกหัด — ทดสอบความเข้าใจ', 'Quiz — test your understanding'), '<div id="w-quiz"></div>');
  makeQuiz(el('w-quiz'), opQuiz());
  xgroup(document.body);
}


window.addEventListener('load', () => {
  build();
  applyLang(getLang());
});
</script>

      + `<button type="button" class="pen-btn" data-t="eraser" data-l="eraser">${ICON.eraser}</button>`
      + `<button type="button" class="pen-btn" data-a="undo" data-l="undo">${ICON.undo}</button>`
      + `<button type="button" class="pen-btn" data-a="clear" data-l="clear">${ICON.clear}</button>`
      + '</div>'

    });

      if (b.classList.contains('pen-main')) { setOn(!S.on); return; }
      if (b.dataset.c) { S.color = b.dataset.c; if (S.tool === 'eraser') S.tool = 'pen'; }
      else if (b.dataset.t) S.tool = S.tool === b.dataset.t ? 'pen' : b.dataset.t;

</script>
<script id="theme-js">
// ── ปุ่มสลับโหมดสว่าง/มืด (สร้างโดย tools/build_lessons.py) — จำค่าไว้ใน localStorage 'siteTheme' ──

  b.title = dark ? (en ? 'Switch to light mode' : 'เปลี่ยนเป็นโหมดสว่าง') : (en ? 'Switch to dark mode' : 'เปลี่ยนเป็นโหมดมืด');

}

  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);

}
// ── ตัวปรับสีโหมดมืดตอนรัน: สีที่ JS เขียนตรงๆ ลงกราฟ SVG (fill/stroke) หรือ style="" ──
