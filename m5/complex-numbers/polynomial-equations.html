    return grp[0] === j ? grp.map(i => xs(['₁', '₂', '₃'][i])).join(' = ') : '';
  };
  const place = () => { shown.forEach((r, j) => cp.set('r' + (j + 1), Z(r[0], r[1]), true)); cpHide(q('.pe-cp')); };
  const table = () => {
    const [a, b, c, d] = cur, sumS = Q(-b, a), prdS = Q(-d, a);
    const sm = roots.reduce((s, z) => [s[0] + z[0], s[1] + z[1]], [0, 0]), pr = roots.reduce((p, z) => cM(p, z), [1, 0]);
    chk(Math.abs(sm[0] - qNum(sumS)) < 1e-4 && Math.abs(sm[1]) < 1e-4 && Math.abs(pr[0] - qNum(prdS)) < 1e-4 && Math.abs(pr[1]) < 1e-4, `vieta ลองทำ ${cur.join(',')}`);
    const dec = v => `<span class="t-m">≈ ${f2(v)}</span>`;
    q('.vt-eq').innerHTML = `${polyH(cur)} = 0`;
    q('.pe-tbl').innerHTML = `<div class="hd"></div><div class="hd">${tx(T('จากสูตร', 'From the formula'))}</div><div class="hd">${tx(T('จากจุดบนระนาบ (บวก/คูณจริง)', 'From the points (added / multiplied)'))}</div>` +
      `<div class="lb t-g">${tx(T('ผลบวก', 'sum'))}</div><div class="sm"><span>−${frac(par(mn(b)), String(a))} = <b>${qHtml(sumS)}</b></span>${Number.isInteger(qNum(sumS)) ? '' : dec(qNum(sumS))}</div><div class="sm"><span>${xs('₁')} + ${xs('₂')} + ${xs('₃')}</span> ${dec(sm[0])}</div>` +
      `<div class="lb t-o">${tx(T('ผลคูณ', 'product'))}</div><div class="pr"><span>${frac(`(−1)<sup>3</sup> · ${par(mn(d))}`, String(a))} = <b>${qHtml(prdS)}</b></span>${Number.isInteger(qNum(prdS)) ? '' : dec(qNum(prdS))}</div><div class="pr"><span>${xs('₁')}${xs('₂')}${xs('₃')}</span> ${dec(pr[0])}</div>` +
      `<div class="hd"></div><div class="hd" style="grid-column:2/4"><span class="pe-ok">✓ ${tx(T('ค่าจากสูตรกับค่าจากจุดเท่ากันเสมอ', 'The formula value and the point value always agree'))}</span></div>` +
      `<div class="hd" style="grid-column:1/4;line-height:1.6"><span>${[0, 1, 2].map(j => `${xs('₁₂₃'[j])} ${exactR(roots[j]) ? '=' : '≈'} ${zr(roots[j])}`).join(' &nbsp;·&nbsp; ')}</span></div>`;
  };
  const exactR = r => Math.abs(r[0] - Math.round(r[0])) < 1e-9 && Math.abs(r[1] - Math.round(r[1])) < 1e-9;
  const zr = r => (exactR(r) ? (Math.round(r[1]) === 0 ? mn(Math.round(r[0]) || 0) : (Math.round(r[0]) === 0 ? '' : mn(Math.round(r[0]))) + (Math.round(r[1]) < 0 ? (Math.round(r[0]) === 0 ? '−' : ' − ') : (Math.round(r[0]) === 0 ? '' : ' + ')) + (Math.abs(Math.round(r[1])) === 1 ? '' : Math.abs(Math.round(r[1]))) + I) : Math.abs(r[1]) < 0.005 ? f2(r[0]) : zf2(r[0], r[1]));
  const chipsPaint = () => {
    q('.vt-c').innerHTML = `<span class="chips-label">${tx(T('ตัวอย่าง', 'Examples'))}</span>` + PRE.map((p, i) => `<button class="chip${p.join() === cur.join() ? ' active' : ''}" data-i="${i}">${polyH(p)}</button>`).join('');
    q('.vt-c').querySelectorAll('.chip').forEach(b => b.onclick = () => { PRE[+b.dataset.i].forEach((v, i) => { inp[i].value = v; }); change(); });
  };
  const match = (from, to) => {                                                      // จับคู่รากเก่า→ใหม่ที่ระยะรวมน้อยสุด (ไม่ให้จุดสลับกันตอนเคลื่อน)
    const P = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]]; let best = null, bd = 1e9;
    P.forEach(p => { const dd = p.reduce((s, j, i) => s + Math.hypot(from[i][0] - to[j][0], from[i][1] - to[j][1]), 0); if (dd < bd) { bd = dd; best = p; } });
    return best.map(j => to[j]);
  };
  const vals = () => { ['vt-av', 'vt-bv', 'vt-c2v', 'vt-dv'].forEach((id, i) => { document.getElementById(id).textContent = mn(cur[i]); }); };
  const change = () => {
    cur = inp.map(e => +e.value); roots = polyRoots(cur); vals(); table(); chipsPaint();
    const from = shown.map(r => r.slice()), to = match(from, roots);
    anim.kill(); anim = makeAnimator(); const an = anim;
    if (reducedMotion()) { shown = to.map(r => r.slice()); place(); return; }
    an.run(320, t => { shown = from.map((f, i) => [lerp(f[0], to[i][0], t), lerp(f[1], to[i][1], t)]); place(); }, EASE.inOut).then(() => { if (!an.dead) { shown = to.map(r => r.slice()); place(); } });
  };
  cp = makeCPlane(q('.pe-cp'), { range: 6, points: [0, 1, 2].map(j => ({ id: 'r' + (j + 1), z: Z(shown[j][0], shown[j][1]), cls: 'g', arrow: false, label: lbl(j) })) });
  inp.forEach(e => e.addEventListener('input', change));
  vals(); table(); chipsPaint(); place();
  const w = { refresh() { table(); chipsPaint(); } }; LIVE.push(w);
  return w;
}

// ═══════════════════════════════════════════════════════════════
//  ตรวจตัวเลขที่เพิ่มเอง (รันตอนสร้างหน้า — ผิดเมื่อไรหน้าไม่ขึ้น)
// ═══════════════════════════════════════════════════════════════
function peCheck() {
  // x² + x + 5 = 0 : (−1 ± √19 i)/2
  QD_ROOTS.forEach(r => chk(resid([1, 1, 5], [qNum(r.re), qNum(r.im)]) < 1e-5, 'quad x²+x+5 root'));
  // x² − 6x + 13 = 0 : 3 ± 2i
  chk(cxEq(pQuadRes(PZ), 0) && cxEq(pQuadRes(PZC), 0), 'x²−6x+13');
  // 3x⁵ − 4x⁴ + 2x³ − x² + x − 5 : ผลบวก 4/3 ผลคูณ 5/3
  const rr = polyRoots(VP), sm = rr.reduce((s, z) => [s[0] + z[0], s[1] + z[1]], [0, 0]), pr = rr.reduce((p, z) => cM(p, z), [1, 0]);
  chk(Math.abs(sm[0] - 4 / 3) < 1e-6 && Math.abs(sm[1]) < 1e-6 && Math.abs(pr[0] - 5 / 3) < 1e-6 && Math.abs(pr[1]) < 1e-6 && rr.length === 5, 'vieta 3x⁵');
  rr.forEach(z => chk(resid(VP, z) < 1e-6, 'vieta 3x⁵ root'));
  chk(qEq(VSUM, Q(-(-4), 3)) && qEq(VPRD, Q(-1 * -5, 3)) && (-1) ** 5 * -5 / 3 === 5 / 3, 'vieta สูตร');
  // ปรับ ลองทำสามตัวอย่าง
  [[1, -1, 4, -4], [1, 0, 0, -1], [1, -2, -1, 2]].forEach(cs => polyRoots(cs).forEach(z => chk(resid(cs, z) < 1e-8, 'cubic preset ' + cs.join())));
  // ตัวอย่างลองทำ x³ − x² + 4x − 4 : 1, ±2i
  const pcs = polyRoots([1, -1, 4, -4]); chk(pcs.length === 3 && pcs.some(z => Math.abs(z[0] - 1) < 1e-8 && z[1] === 0) && pcs.filter(z => Math.abs(z[0]) < 1e-8 && Math.abs(Math.abs(z[1]) - 2) < 1e-8).length === 2, 'cubic 1,±2i');
}

// ═══════════════════════════════════════════════════════════════
//  แบบฝึกหัด 8 ข้อ (แต่งใหม่ — ตัวเลขคำนวณด้วย cx* / ตัวแก้เชิงตัวเลข)
// ═══════════════════════════════════════════════════════════════
function peQuiz() {
  const W = h => mx(h), ct = cxText;
  // 1) x² − 6x + 25 = 0 → Δ = 36 − 100 = −64 → (6 ± 8i)/2 = 3 ± 4i
  const q1 = Z(3, 4), q1c = cxConj(q1);
  chk(36 - 100 === -64 && cxEq(cxAdd(cxAdd(cxMul(q1, q1), cxMul(-6, q1)), 25), 0) && cxEq(cxAdd(cxAdd(cxMul(q1c, q1c), cxMul(-6, q1c)), 25), 0), 'quiz1');
  // 2) Δ ของ 4 สมการ
  const dl = [[1, -4, 3], [1, -4, 4], [1, -2, 5], [1, 3, -1]].map(([a, b, c]) => b * b - 4 * a * c);
  chk(dl.join() === '4,0,-16,13', 'quiz2 Δ');
  // 3) 2x² − 4x + 3 = 0 → Δ = −8 → 1 ± (√2/2) i
  const rt2 = Math.sqrt(2), q3 = [1, rt2 / 2];
  chk(16 - 24 === -8 && resid([2, -4, 3], q3) < 1e-9 && resid([2, -4, 3], [1, -rt2 / 2]) < 1e-9 && resid([2, -4, 3], [2, rt2]) > 0.5 && resid([2, -4, 3], [1, 2 * rt2]) > 0.5 && resid([2, -4, 3], [-1, rt2 / 2]) > 0.5, 'quiz3');
  // 4) สัมประสิทธิ์จริง รากมี 2 กับ 1 − 3i → รากที่สามคือ 1 + 3i (สร้างสมการ (x−2)(x²−2x+10) แล้วตรวจ)
  const c4 = pMul([-2, 1], [10, -2, 1]).reverse();                                  // x³ − 4x² + 14x − 20
  chk(c4.join() === '1,-4,14,-20' && resid(c4, [2, 0]) < 1e-9 && resid(c4, [1, 3]) < 1e-9 && resid(c4, [1, -3]) < 1e-9 && resid(c4, [-1, 3]) > 1, 'quiz4');
  // 5) x² − 2ix − 1 = 0 : i เป็นคำตอบ (ซ้ำ) แต่ −i ไม่ใช่
  const f5 = z => cxSub(cxSub(cxMul(z, z), cxMul(Z(0, 2), z)), 1);
  chk(cxEq(f5(Z(0, 1)), 0) && cxEq(f5(Z(0, -1)), Z(-4, 0)), 'quiz5');
  // 6) คำตอบ −2 + i (สัมประสิทธิ์จริง) → x² + 4x + 5
  const q6 = Z(-2, 1), q6c = cxConj(q6);
  chk(cxEq(cxAdd(q6, q6c), -4) && cxEq(cxMul(q6, q6c), 5) && cxEq(cxAdd(cxAdd(cxMul(q6, q6), cxMul(4, q6)), 5), 0) && !cxEq(cxAdd(cxAdd(cxMul(q6, q6), cxMul(-4, q6)), 5), 0), 'quiz6');
  // 7) 4x³ − 8x² + x + 6 = 0 : ผลบวก 2 · ผลคูณ −3/2 (ตรวจกับรากเชิงตัวเลข)
  const c7 = [4, -8, 1, 6], r7 = polyRoots(c7), s7 = r7.reduce((s, z) => s + z[0], 0), p7 = r7.reduce((p, z) => cM(p, z), [1, 0]);
  chk(Math.abs(s7 - 2) < 1e-6 && Math.abs(p7[0] + 1.5) < 1e-6 && Math.abs(p7[1]) < 1e-6, 'quiz7');
  // 8) 2x⁵ + x³ − 4x + 6 = 0 : ผลคูณ −3 · ผลบวก 0
  const c8 = [2, 0, 1, 0, -4, 6], r8 = polyRoots(c8), s8 = r8.reduce((s, z) => s + z[0], 0), p8 = r8.reduce((p, z) => cM(p, z), [1, 0]);
  chk(r8.length === 5 && Math.abs(s8) < 1e-6 && Math.abs(p8[0] + 3) < 1e-6 && Math.abs(p8[1]) < 1e-6, 'quiz8');
  const pmI = (re, im) => W(`${re} ± ${im}${I}`);
  return [
    { q: T(`คำตอบของ ${mx(polyH([1, -6, 25]) + ' = 0')} คือข้อใด`, `The solutions of ${mx(polyH([1, -6, 25]) + ' = 0')} are which one`), o: [pmI('3', '4'), pmI('−3', '4'), pmI('6', '8'), W('3 ± 4')], a: 0,
      e: T('Δ = (−6)² − 4 × 1 × 25 = 36 − 100 = −64 → √(−64) = 8i → x = (6 ± 8i)/2 = <b>3 ± 4i</b> · −3 ± 4i ใช้ b = −6 แทน −b = 6 · 6 ± 8i ลืมหารด้วย 2a · 3 ± 4 ลืมใส่ i', 'Δ = (−6)² − 4 × 1 × 25 = 36 − 100 = −64 → √(−64) = 8i → x = (6 ± 8i)/2 = <b>3 ± 4i</b> · −3 ± 4i uses b = −6 instead of −b = 6 · 6 ± 8i forgot to divide by 2a · 3 ± 4 forgot the i') },
    { q: T('สมการใดมีคำตอบเป็นคู่สังยุค (ไม่ใช่จำนวนจริง)', 'Which equation has a pair of conjugate complex solutions (not real ones)'), o: [W(polyH([1, -4, 3]) + ' = 0'), W(polyH([1, -4, 4]) + ' = 0'), W(polyH([1, -2, 5]) + ' = 0'), W(polyH([1, 3, -1]) + ' = 0')], a: 2,
      e: T('ต้องมี Δ = b² − 4ac &lt; 0: x² − 2x + 5 มี Δ = 4 − 20 = −16 ✓ · x² − 4x + 3 มี Δ = 16 − 12 = 4 &gt; 0 สองคำตอบจริง · x² − 4x + 4 มี Δ = 0 คำตอบจริงซ้ำ · x² + 3x − 1 มี Δ = 9 + 4 = 13 &gt; 0 (c ติดลบทำให้ −4ac เป็นบวก)', 'We need Δ = b² − 4ac &lt; 0: x² − 2x + 5 has Δ = 4 − 20 = −16 ✓ · x² − 4x + 3 has Δ = 16 − 12 = 4 &gt; 0, two real solutions · x² − 4x + 4 has Δ = 0, one repeated real solution · x² + 3x − 1 has Δ = 9 + 4 = 13 &gt; 0 (a negative c makes −4ac positive)') },
    { q: T(`คำตอบของ ${mx(polyH([2, -4, 3]) + ' = 0')} คือข้อใด`, `The solutions of ${mx(polyH([2, -4, 3]) + ' = 0')} are which one`), o: [W(`2 ± √2 ${I}`), W(`1 ± ${frac('√2', '2')} ${I}`), W(`−1 ± ${frac('√2', '2')} ${I}`), W(`1 ± 2√2 ${I}`)], a: 1,
      e: T('Δ = (−4)² − 4 × 2 × 3 = 16 − 24 = −8 → √(−8) = 2√2 i → x = (4 ± 2√2 i)/4 = <b>1 ± (√2/2) i</b> · 2 ± √2 i หารด้วย 2 แทน 2a = 4 · −1 ± (√2/2) i ใช้ b = −4 แทน −b = 4 · 1 ± 2√2 i หารเฉพาะส่วนจริง ลืมหารส่วนจินตภาพ', 'Δ = (−4)² − 4 × 2 × 3 = 16 − 24 = −8 → √(−8) = 2√2 i → x = (4 ± 2√2 i)/4 = <b>1 ± (√2/2) i</b> · 2 ± √2 i divides by 2 instead of 2a = 4 · −1 ± (√2/2) i uses b = −4 instead of −b = 4 · 1 ± 2√2 i divides only the real part and leaves the imaginary part') },
    { q: T('สมการกำลังสามที่สัมประสิทธิ์เป็นจำนวนจริงมีคำตอบ 2 และ 1 − 3i คำตอบที่สามคือข้อใด', 'A cubic equation with real coefficients has the solutions 2 and 1 − 3i. What is the third solution'), o: [W('−1 + 3' + I), W('1 + 3' + I), W('−1 − 3' + I), W('2')], a: 1,
      e: T('สัมประสิทธิ์เป็นจำนวนจริง คำตอบเชิงซ้อนต้องมีสังยุคมาด้วย → สังยุคของ 1 − 3i คือ <b>1 + 3i</b> · −1 + 3i เปลี่ยนเครื่องหมายส่วนจริงแทนส่วนจินตภาพ · −1 − 3i คือ −z (ตัวผกผันการบวก) ไม่ใช่สังยุค · 2 ซ้ำเป็นไปได้แต่ไม่ได้ทำให้ 1 − 3i มีคู่', 'The coefficients are real, so a complex solution comes with its conjugate → the conjugate of 1 − 3i is <b>1 + 3i</b> · −1 + 3i flips the real part instead of the imaginary part · −1 − 3i is −z (the additive inverse), not the conjugate · a repeated 2 is possible but then 1 − 3i would have no partner') },
    { q: T('สมการ x² − 2ix − 1 = 0 มี i เป็นคำตอบ ข้อใดถูกเกี่ยวกับ −i', 'The equation x² − 2ix − 1 = 0 has the solution i. Which statement about −i is correct'), o: [T('−i ไม่ใช่คำตอบ เพราะสัมประสิทธิ์ −2i ไม่ใช่จำนวนจริง', '−i is not a solution, because the coefficient −2i is not real'), T('−i เป็นคำตอบ เพราะคำตอบเชิงซ้อนมาเป็นคู่สังยุคเสมอ', '−i is a solution, because complex solutions always come in conjugate pairs'), T('−i เป็นคำตอบ เพราะแทน x = −i แล้วได้ 0', '−i is a solution, because x = −i gives 0'), T('−i ไม่ใช่คำตอบ เพราะ i ก็ไม่ใช่คำตอบของสมการนี้', '−i is not a solution, because i is not a solution of this equation either')], a: 0,
      e: T('แทน x = −i: (−i)² − 2i(−i) − 1 = −1 − 2 − 1 = −4 ≠ 0 จึงไม่ใช่คำตอบ · กฎคู่สังยุคใช้ได้เฉพาะเมื่อสัมประสิทธิ์ทุกตัวเป็นจำนวนจริง แต่สมการนี้มี −2i · ส่วน i เป็นคำตอบจริง (−1 + 2 − 1 = 0)', 'Put in x = −i: (−i)² − 2i(−i) − 1 = −1 − 2 − 1 = −4 ≠ 0, so it is not a solution · the conjugate rule only works when every coefficient is real, and this equation has −2i · as for i, it is a solution (−1 + 2 − 1 = 0)') },
    { q: T('สมการกำลังสองที่สัมประสิทธิ์เป็นจำนวนจริงและมี −2 + i เป็นคำตอบ คือข้อใด', 'Which quadratic with real coefficients has −2 + i as a solution'), o: [W(polyH([1, 4, 5]) + ' = 0'), W(polyH([1, -4, 5]) + ' = 0'), W(polyH([1, 4, 3]) + ' = 0'), W(polyH([1, 2, 5]) + ' = 0')], a: 0,
      e: T('คำตอบอีกตัวคือ −2 − i → (x − (−2 + i))(x − (−2 − i)) = (x + 2)² − i² = x² + 4x + 4 + 1 = <b>x² + 4x + 5</b> · x² − 4x + 5 ใส่เครื่องหมายที่ x ผิด · x² + 4x + 3 คิด 4 − 1 โดยลืมว่า i² = −1 · x² + 2x + 5 ลืมว่าส่วนจริงของสองคำตอบบวกกันเป็น −4', 'The other solution is −2 − i → (x − (−2 + i))(x − (−2 − i)) = (x + 2)² − i² = x² + 4x + 4 + 1 = <b>x² + 4x + 5</b> · x² − 4x + 5 has the wrong sign on x · x² + 4x + 3 uses 4 − 1 and forgets i² = −1 · x² + 2x + 5 forgets that the real parts of the two solutions add to −4') },
    { q: T(`ผลบวกของคำตอบทั้งหมดของ ${mx(polyH([4, -8, 1, 6]) + ' = 0')} คือข้อใด`, `The sum of all the solutions of ${mx(polyH([4, -8, 1, 6]) + ' = 0')} is which one`), o: [W('2'), W('−2'), W('8'), W(`−${frac('3', '2')}`)], a: 0,
      e: T('ผลบวก = −aₙ₋₁/aₙ = −(−8)/4 = <b>2</b> · −2 ลืมว่ามีเครื่องหมายลบนำหน้าสูตร · 8 ลืมหารด้วย aₙ = 4 · −3/2 คือผลคูณ ((−1)³ · 6 / 4) ไม่ใช่ผลบวก', 'Sum = −aₙ₋₁/aₙ = −(−8)/4 = <b>2</b> · −2 forgot the minus in front of the formula · 8 forgot to divide by aₙ = 4 · −3/2 is the product ((−1)³ · 6 / 4), not the sum') },
    { q: T(`ผลคูณของคำตอบทั้งหมดของ ${mx(polyH([2, 0, 1, 0, -4, 6]) + ' = 0')} คือข้อใด`, `The product of all the solutions of ${mx(polyH([2, 0, 1, 0, -4, 6]) + ' = 0')} is which one`), o: [W('−3'), W('3'), W('6'), W('0')], a: 0,
      e: T('ดีกรี n = 5, c = 6, aₙ = 2 → ผลคูณ = (−1)⁵ · 6 / 2 = <b>−3</b> · 3 ลืม (−1)ⁿ ซึ่งเป็นลบเมื่อ n เป็นเลขคี่ · 6 ลืมหารด้วย aₙ = 2 · 0 คือผลบวก (ไม่มีพจน์ x⁴) ไม่ใช่ผลคูณ', 'Degree n = 5, c = 6, aₙ = 2 → product = (−1)⁵ · 6 / 2 = <b>−3</b> · 3 forgot (−1)ⁿ, which is negative when n is odd · 6 forgot to divide by aₙ = 2 · 0 is the sum (there is no x⁴ term), not the product') }
  ];
}

// ═══════════════════════════════════════════════════════════════
//  ประกอบหน้า
// ═══════════════════════════════════════════════════════════════
function build() {
  peCss(); peCheck();
  const el = id => document.getElementById(id);
  const scenes = (id, sc, pr) => makeScenes(el(id), sc, { prompt: pr });

  const stepHint = `<div class="sc-prompt">${d('กด “ถัดไป” ทีละขั้น', 'Press “Next” one step at a time')}</div>`;

<script id="pen-js">

    pen: '<svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8 4 20z"/><path d="M14.5 6.1l3.4 3.4"/></svg>',
    hl: '<svg viewBox="0 0 24 24"><path d="M9 14l-3 3v3h6l1-1"/><path d="M9 14l7.5-9.5a2 2 0 0 1 2.9-.3l.4.4a2 2 0 0 1-.3 2.9L10 15z"/><path d="M14 20h6"/></svg>',
    eraser: '<svg viewBox="0 0 24 24"><path d="M8.5 20H20"/><path d="M4.6 15.4l9.9-9.9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18H7.2z"/><path d="M9 11l5 5"/></svg>',
    undo: '<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
    clear: '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M5.5 7l1 13h11l1-13"/><path d="M9 7V4h6v3"/></svg>',

      + `<button type="button" class="pen-btn" data-t="hl" data-l="hl">${ICON.hl}</button>`
      + `<button type="button" class="pen-btn" data-t="eraser" data-l="eraser">${ICON.eraser}</button>`
      + `<button type="button" class="pen-btn" data-a="undo" data-l="undo">${ICON.undo}</button>`
      + `<button type="button" class="pen-btn" data-a="clear" data-l="clear">${ICON.clear}</button>`

      + `<button type="button" class="pen-main" data-l="main" aria-pressed="false">${ICON.pen}</button>`;
