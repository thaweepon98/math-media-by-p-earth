(function () {
  var orig = window.addEventListener, pending = [], fired = false;
  window.addEventListener = function (type, fn, opts) {
    if (type !== 'load') return orig.call(this, type, fn, opts);
    if (fired) setTimeout(fn, 0); else pending.push(fn);
  };
  function fire() {
    if (fired) return;
    fired = true;
    pending.forEach(function (fn) { try { fn.call(window, new Event('load')); } catch (e) { console.error(e); } });
    pending = [];
  }
  orig.call(window, 'load', fire);
  (function poll() { if (document.readyState === 'complete') setTimeout(fire, 0); else setTimeout(poll, 30); })();
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สื่อการสอน : ดีเทอร์มิแนนต์ ม.5</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #1C3B22; --secondary: #FF8A3D; --accent: #68EF3F; --accent-2: #3FA82E; --warning: #FFB347;
    --bg: #F3F7EC; --card: #FFFFFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(28,59,34,0.10); --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Anuphan', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  sup { font-size: .68em; line-height: 0; vertical-align: super; font-weight: 800; }
  sub { font-size: .68em; line-height: 0; vertical-align: sub; font-weight: 800; }
  sup sup { font-size: .8em; }

  header { background: var(--panel, #f1f4f7); color: var(--text); padding: 28px 40px 20px; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: .5px; }
  header p { font-size: 1rem; opacity: .85; margin-top: 4px; }
  .back-link { position: absolute; top: 14px; left: 20px; color: white; text-decoration: none; font-size: .85rem; font-weight: 600; opacity: .9; z-index: 2; }
  .back-link:hover { opacity: 1; text-decoration: underline; }
  .lang-toggle { position: absolute; top: 14px; right: 20px; background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.5); border-radius: 20px; padding: 5px 14px; font-family: 'Anuphan', sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 20px 24px 0; background: white; border-bottom: 3px solid var(--border); }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 10px 10px 0 0; font-family: 'Anuphan', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .25s; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab-btn:hover { color: var(--text); background: var(--raise, #e4e9ee); }
  .tab-btn.active { color: var(--on-ink, #fff); border-bottom-color: transparent; background: var(--ink, #000); }

  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  .tab-panel { display: none; animation: fadeIn .35s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-title .icon { font-size: 1.5rem; }
  .intro { font-size: 1.02rem; line-height: 1.8; margin-bottom: 14px; }
  .box-info { background: var(--panel, #f1f4f7); border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-warn { background: #FFF7ED; border-left: 4px solid var(--warning); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-ok   { background: #ECFDF5; border-left: 4px solid var(--accent);  border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .formula { background: var(--strong, #1c1e21); color: white; border-radius: 16px; padding: 14px 24px; text-align: center; font-size: 1.3rem; font-weight: 700; margin: 14px 0; letter-spacing: .5px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 18px; }

  .btn { padding: 10px 24px; background: var(--ink, #000); color: var(--on-ink, #fff); border: 1px solid var(--ink, #000); border-radius: 100px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s; }
  .btn:hover:not(:disabled) { background: var(--ink-hover, #2b3138); border-color: var(--ink-hover, #2b3138); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line, #ced0d4); }
  .btn.ghost:hover:not(:disabled) { background: var(--raise, #e4e9ee); border-color: var(--line, #ced0d4); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; align-items: center; }
  .chips .chips-label { font-weight: 700; color: var(--muted); font-size: .95rem; margin-right: 2px; }
  .chip { padding: 7px 16px; border: 2px solid var(--border); border-radius: 30px; background: var(--card); font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--text); display: inline-block; text-align: center; vertical-align: middle; line-height: 1.5; max-width: 100%; }  /* ไม่ใช้ flex: ตัวยกในชิปจะได้ไม่แยกเป็นก้อน */
  .chip:hover { border-color: var(--text); }
  .chip.active { background: var(--ink, #000); color: var(--on-ink, #fff); border-color: var(--ink, #000); }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; line-height: 1.15; vertical-align: middle; margin: 0 4px; }
  .frac .num { font-size: 1em; border-bottom: 2.5px solid currentColor; padding: 0 3px 2px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .den { font-size: 1em; padding: 3px 3px 0; min-width: 18px; text-align: center; white-space: nowrap; }
  .rt { display: inline-flex; align-items: stretch; vertical-align: middle; font-weight: 700; }
  .rt .rt-s { font-size: 1.15em; line-height: 1; padding-right: 1px; align-self: flex-end; }
  .rt .rt-in { border-top: 2px solid currentColor; padding: 0 2px 0 3px; margin-top: 2px; }

  .slider-row { display: flex; align-items: center; gap: 12px; margin: 6px 0; flex-wrap: wrap; }
  .slider-row b { min-width: 30px; font-size: 1.05rem; }
  input[type=range] { accent-color: var(--primary); flex: 1; max-width: 300px; min-width: 120px; }
  .slider-val { font-weight: 800; color: var(--primary); font-size: 1.1rem; min-width: 46px; }

  /* กล่องสมการ: เนื้อหาไหลเป็นข้อความบรรทัดปกติ (ตัวยก/ตัวเอียงต้องติดกับตัวหน้า — ห้ามใช้ flex+gap ที่นี่ จะแยกเป็นก้อน)
     .col = หลายบรรทัดซ้อนกัน ห่อแต่ละบรรทัดด้วย <div> · .row = เรียงเป็นก้อนๆ ห่างเท่ากัน (เช่น สายพานกล่อง → กล่อง) */
  .wg-eq { text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-top: 8px; line-height: 1.9; }
  .wg-eq.col { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
  .wg-eq.row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 14px; }
  .wg-cap { background: var(--panel, #f1f4f7); border-left: 4px solid var(--primary); border-radius: 10px; padding: 12px 16px; line-height: 1.75; margin-top: 8px; }
  .wg-nav { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .wg-nav .btn { padding: 9px 22px; }
  .wg-cnt { font-weight: 700; color: var(--muted); min-width: 92px; text-align: center; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .tile { border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px; background: var(--card); }
  .tile h4 { font-size: .95rem; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  .ans { background: #ECFDF5; border: 2px solid var(--accent-2); border-radius: 8px; padding: 2px 10px; color: #047857; font-weight: 800; white-space: nowrap; }
  .bad { background: #FFF1F2; border: 2px solid #E11D48; border-radius: 8px; padding: 2px 10px; color: #9F1239; font-weight: 800; white-space: nowrap; }
  .hl { border-radius: 5px; padding: 0 3px; background: #FEF3C7; border-bottom: 2px solid #D97706; }
  .hlb { border-radius: 5px; padding: 0 3px; background: #DBEAFE; border-bottom: 2px solid #2563EB; }
  .hlg { border-radius: 5px; padding: 0 3px; background: #DCFCE7; border-bottom: 2px solid #16A34A; }
  .hlp { border-radius: 5px; padding: 0 3px; background: #FCE7F3; border-bottom: 2px solid #DB2777; }
  .ptag { display: inline-block; background: #F1F5F9; border-radius: 20px; padding: 2px 12px; font-size: .88rem; font-weight: 700; color: #475569; }
  .verdict { border-radius: 12px; padding: 12px 16px; line-height: 1.75; border: 2px solid; font-weight: 600; margin-top: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .verdict.ok { background: #ECFDF5; border-color: #16A34A; }
  .verdict.no { background: #FFF1F2; border-color: #E11D48; }
  .verdict .mk { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
  .verdict.ok .mk { color: #16A34A; }
  .verdict.no .mk { color: #E11D48; }
  .mono { font-weight: 700; font-size: 1.1rem; }
  .setrow { font-size: 1.15rem; font-weight: 700; line-height: 2; }
  .tbl { border-collapse: collapse; margin: 8px auto; font-weight: 700; }
  .tbl th, .tbl td { border: 2px solid var(--border); padding: 6px 14px; text-align: center; }
  .tbl th { background: var(--panel, #f1f4f7); color: var(--text); }
  .tbl td.cur { background: #FEF3C7; }
  .tbl-scroll { overflow-x: auto; }

  .wk-cell { position: relative; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px 12px 56px; margin-bottom: 12px; line-height: 1.9; }
  .wk-cell.fresh { animation: rowIn .5s ease; }
  .wk-cell.final { border-color: var(--accent-2); }
  .wk-cell .stepno { position: absolute; left: 14px; top: 14px; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .wk-eq { font-size: 1.15rem; font-weight: 700; overflow-x: auto; padding: 2px 0; }
  .wk-note { font-size: .95rem; font-weight: 600; color: #475569; margin-top: 2px; }

  .quiz-q { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; line-height: 1.8; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .quiz-opt { padding: 10px 20px; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 600; transition: all .2s; background: var(--card); display: inline-flex; align-items: center; min-height: 48px; color: var(--text); }
  .quiz-opt:hover { border-color: var(--text); color: var(--text); }
  .quiz-opt.correct { border-color: var(--accent); background: #ECFDF5; color: #047857; }
  .quiz-opt.wrong { border-color: var(--secondary); background: #FFF4EC; color: #BE185D; }
  .quiz-feedback { font-weight: 600; font-size: 1rem; min-height: 24px; line-height: 1.75; }
  .quiz-feedback.ok { color: #047857; }
  .quiz-feedback.err { color: #BE185D; }
  .btn-next { margin-top: 10px; padding: 10px 28px; background: var(--ink, #000); color: var(--on-ink, #fff); border: none; border-radius: 100px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn-next:hover { background: var(--ink-hover, #2b3138); }
  .score-badge { display: inline-block; background: var(--ink, #000); color: var(--on-ink, #fff); border-radius: 30px; padding: 6px 20px; font-weight: 700; font-size: 1rem; }
  .score-card { margin-top: 20px; background: var(--strong, #1c1e21); color: white; border-radius: 24px; padding: 24px; text-align: center; }

  /* ─── กราฟ SVG (สีใช้ชุด --g-* ของธีม จึงเปลี่ยนตามโหมดสว่าง/มืด) ─── */
  .plot { width: 100%; max-width: 560px; height: auto; display: block; margin: 8px auto; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; }
  .plot text { fill: var(--text); font-family: 'Anuphan', sans-serif; font-weight: 700; }
  .pl-grid { stroke: var(--border); stroke-width: 1; }
  .pl-axis { stroke: var(--muted); stroke-width: 1.8; }
  .pl-tick { fill: var(--muted) !important; font-size: 11px; font-weight: 600; }
  .pl-c { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .s-blue { stroke: var(--g-blue); } .s-orange { stroke: var(--g-curve); } .s-green { stroke: var(--g-green); }
  .s-pink { stroke: var(--g-pink); } .s-purple { stroke: var(--g-purple); } .s-red { stroke: var(--g-red); } .s-teal { stroke: var(--g-teal); }
  .s-muted { stroke: var(--muted); }
  .f-blue { fill: var(--g-blue); } .f-orange { fill: var(--g-curve); } .f-green { fill: var(--g-green); }
  .f-pink { fill: var(--g-pink); } .f-purple { fill: var(--g-purple); } .f-red { fill: var(--g-red); } .f-teal { fill: var(--g-teal); }
  .fa-blue { fill: var(--g-blue); fill-opacity: .16; stroke: none; } .fa-orange { fill: var(--g-curve); fill-opacity: .18; stroke: none; }
  .fa-red { fill: var(--g-red); fill-opacity: .16; stroke: none; } .fa-green { fill: var(--g-green); fill-opacity: .16; stroke: none; } .fa-pink { fill: var(--g-pink); fill-opacity: .16; stroke: none; }
  .pl-dash { stroke-dasharray: 6 5; stroke-width: 2; fill: none; }
  .pl-thick { stroke-width: 7; stroke-linecap: butt; fill: none; }
  .pl-dot { stroke: var(--g-ring); stroke-width: 2; }
  .pl-open { fill: var(--card); stroke-width: 2.6; }
  .pl-lbl { font-size: 13px; }
  .pl-lbl.b { fill: color-mix(in srgb, var(--g-blue) 75%, var(--text)) !important; } .pl-lbl.o { fill: color-mix(in srgb, var(--g-curve) 68%, var(--text)) !important; } .pl-lbl.g { fill: color-mix(in srgb, var(--g-green) 72%, var(--text)) !important; }
  .pl-lbl.p { fill: color-mix(in srgb, var(--g-pink) 75%, var(--text)) !important; } .pl-lbl.r { fill: color-mix(in srgb, var(--g-red) 75%, var(--text)) !important; }

  /* ─── แผนภาพลูกศร (mapping diagram) ─── */
  .md { width: 100%; max-width: 440px; height: auto; display: block; margin: 6px auto; }

  .pg button { font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 1rem; padding: 7px 10px; min-width: 72px; border: 2px solid var(--border); border-radius: 30px; background: var(--card); color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
  .pg button:hover { border-color: var(--g-blue); }
  .pg button.on { background: color-mix(in srgb, var(--g-blue) 18%, var(--card)); border-color: var(--g-blue); border-width: 2.6px; }

  .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0; }
  .tool-inp { font-family: 'Anuphan', sans-serif; font-size: 1.15rem; font-weight: 700; padding: 6px 12px; border: 2px solid var(--border); border-radius: 12px; width: 120px; max-width: 100%; color: var(--text); background: #fff; }

  .sc-svg .sc-node.bad circle { stroke: var(--g-red); fill: color-mix(in srgb, var(--g-red) 16%, var(--card)); }
  .sc-svg .sc-node.good circle { stroke: var(--g-green); fill: color-mix(in srgb, var(--g-green) 16%, var(--card)); }

  .sc-svg .sc-arr polygon { fill: var(--g-blue); }

  /* ─── ของกลางกลุ่มเอกซ์โพเนนเชียล–ลอการิทึม (mx, nrt, makeBaseSlider, makeMatch, makeSort, tileRow ใน base.js) — เพิ่มท้ายไฟล์เท่านั้น ─── */
  .mx { display: inline-block; white-space: nowrap; }
  sup.fx { display: inline-block; height: 0; font-size: .68em; vertical-align: baseline; position: relative; top: -1.45em; line-height: 1; margin-left: 1px; }
  sup.fx .frac { margin: 0; vertical-align: baseline; line-height: 1.05; }

  sup.fx .frac .den { padding: 1px 1px 0; min-width: 0; }

  .bs-row .slider-val { min-width: 60px; }

  .cl-blue { --cc: var(--g-blue); } .cl-orange { --cc: var(--g-curve); } .cl-green { --cc: var(--g-green); } .cl-purple { --cc: var(--g-purple); }
  .cl-pink { --cc: var(--g-pink); } .cl-teal { --cc: var(--g-teal); } .cl-red { --cc: var(--g-red); }

  .mt-item:hover:not(.done) { border-color: var(--cc, var(--primary)); }
  .mt-item.sel { border-color: var(--cc, var(--primary)); background: color-mix(in srgb, var(--cc, var(--primary)) 16%, var(--card)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc, var(--primary)) 30%, transparent); }
  .mt-item.done { cursor: default; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, var(--card)); }
  .mt-badge { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 1.15rem; font-weight: 800; color: var(--cc); }

  @keyframes mtShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

  .so-why { display: block; font-size: .88rem; font-weight: 600; color: var(--muted); margin-top: 2px; }

  .tl-row { --tl: 38px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0; }
  .tl-tile { display: inline-flex; align-items: center; justify-content: center; min-width: var(--tl); height: calc(var(--tl) * .82); padding: 0 6px; border: 2px solid var(--cc); border-radius: 8px; background: color-mix(in srgb, var(--cc) 20%, var(--card)); font-weight: 800; font-size: calc(var(--tl) * .5); color: var(--text); }
  .tl-gap { width: calc(var(--tl) * .5); }

  @media (max-width: 700px) {

  }

  /* ─── ของกลางกลุ่มตรีโกณมิติ (makeUnitCircle, makeTriangle, piTicks ใน base.js) — เพิ่มท้ายไฟล์เท่านั้น · สีใช้ตัวแปร --g-* / var(--card) ทั้งหมด ─── */
  .uc-wrap, .tri-wrap { margin: 4px 0; }

  .uc-svg .uc-tk { fill: var(--muted); stroke: none; }

  .uc-svg .uc-rad { stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
  .uc-svg .uc-p { fill: var(--g-red); stroke: var(--g-ring); stroke-width: 2.4; }
  .uc-svg .uc-halo { fill: var(--g-red); fill-opacity: .2; stroke: none; }
  .uc-svg .uc-plab { font-size: 17px; font-style: italic; }
  .uc-svg .uc-dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
  .uc-svg .uc-dash.s-purple { stroke: var(--g-purple); stroke-width: 2.4; }
  .uc-svg .uc-thick { stroke-width: 7; stroke-linecap: butt; fill: none; }
  .uc-svg .uc-arc { fill: none; stroke: var(--g-curve); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .uc-svg .uc-arrow { fill: var(--g-curve); stroke: none; }
  .uc-read { display: flex; flex-wrap: wrap; gap: 8px 10px; justify-content: center; margin: 8px 0 2px; min-height: 8px; }
  .uc-read .ptag { font-size: 1rem; padding: 4px 14px; background: var(--card); border: 2px solid var(--border); color: var(--text); }
  .uc-sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
  .uc-sw.b { background: var(--g-blue); } .uc-sw.r { background: var(--g-red); }

  .tri-svg .tr-fill { fill: color-mix(in srgb, var(--g-blue) 9%, var(--card)); stroke: none; }
  .tri-svg .tr-side { stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
  .tri-svg .tr-side.hl { stroke-width: 4.6; }
  .tri-svg .tr-side.hl.blue { stroke: var(--g-blue); } .tri-svg .tr-side.hl.orange { stroke: var(--g-curve); } .tri-svg .tr-side.hl.green { stroke: var(--g-green); }
  .tri-svg .tr-side.hl.purple { stroke: var(--g-purple); } .tri-svg .tr-side.hl.pink { stroke: var(--g-pink); } .tri-svg .tr-side.hl.red { stroke: var(--g-red); } .tri-svg .tr-side.hl.teal { stroke: var(--g-teal); }
  .tri-svg .tr-glow { stroke: transparent; stroke-width: 15; stroke-linecap: round; opacity: 0; }

  .tri-svg .tr-glow.blue { stroke: var(--g-blue); } .tri-svg .tr-glow.orange { stroke: var(--g-curve); } .tri-svg .tr-glow.green { stroke: var(--g-green); }
  .tri-svg .tr-glow.purple { stroke: var(--g-purple); } .tri-svg .tr-glow.pink { stroke: var(--g-pink); } .tri-svg .tr-glow.red { stroke: var(--g-red); } .tri-svg .tr-glow.teal { stroke: var(--g-teal); }
  .tri-svg .tr-arc { fill: color-mix(in srgb, var(--muted) 22%, transparent); stroke: var(--muted); stroke-width: 2; }
  .tri-svg .tr-arc.hl.blue { fill: color-mix(in srgb, var(--g-blue) 28%, transparent); stroke: var(--g-blue); } .tri-svg .tr-arc.hl.orange { fill: color-mix(in srgb, var(--g-curve) 28%, transparent); stroke: var(--g-curve); }
  .tri-svg .tr-arc.hl.green { fill: color-mix(in srgb, var(--g-green) 28%, transparent); stroke: var(--g-green); } .tri-svg .tr-arc.hl.purple { fill: color-mix(in srgb, var(--g-purple) 28%, transparent); stroke: var(--g-purple); }
  .tri-svg .tr-arc.hl.pink { fill: color-mix(in srgb, var(--g-pink) 28%, transparent); stroke: var(--g-pink); } .tri-svg .tr-arc.hl.red { fill: color-mix(in srgb, var(--g-red) 28%, transparent); stroke: var(--g-red); }
  .tri-svg .tr-arc.hl.teal { fill: color-mix(in srgb, var(--g-teal) 28%, transparent); stroke: var(--g-teal); }
  .tri-svg .tr-right { fill: none; stroke: var(--muted); stroke-width: 2; }
  .tri-svg .tr-lab { font-size: 17px; }
  .tri-svg .tr-alab { font-style: italic; }
  .tri-svg .tr-name { font-size: 17px; font-style: italic; fill: var(--muted); }

  /* เลย์เอ็ตกลุ่มตรีโกณ: ซ้าย = ภาพ (สามเหลี่ยม/วงกลม) · ขวา = บรรทัดสมการที่โผล่ทีละบรรทัด (.tg-lines > .tg-line) — จอแคบเรียงบนล่าง */
  .tg-split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 10px 18px; align-items: center; }
  .tg-split > div { min-width: 0; }

  .tg-line.fresh { animation: rowIn .45s ease; }
  .tg-line .ans { font-size: 1.05em; }
  /* ตัวหนังสือสีใน .formula (พื้นเขียวเข้ม): ข้าม = ฟ้า · ชิด = ส้ม · ฉาก = เขียว — ผสมขาวให้อ่านออกทั้ง 2 โหมด */
  .formula .fm-b { color: color-mix(in srgb, var(--g-blue) 40%, #fff); } .formula .fm-o { color: color-mix(in srgb, var(--g-curve) 45%, #fff); } .formula .fm-g { color: color-mix(in srgb, var(--g-green) 40%, #fff); }
  .formula .fm-p { color: color-mix(in srgb, var(--g-pink) 45%, #fff); } .formula .fm-r { color: color-mix(in srgb, var(--g-red) 45%, #fff); }
  @media (max-width: 700px) { .tg-split { grid-template-columns: 1fr; } .tg-line { font-size: 1.08rem; } }
  .formula .tg-line { color: inherit; }
  .tg-split .wk-eq { overflow-y: hidden; padding: 4px 0; }

  /* ═══ BEGIN ของกลางกลุ่มเมทริกซ์ ม.5 (matHtml, makeMatrix, flyTo, makeDetArea ใน base.js) — เพิ่มท้ายไฟล์เท่านั้น · สีใช้ --g-* / color-mix กับ --text/--card ═══ */
  .mat-wrap { position: relative; display: inline-block; vertical-align: middle; white-space: nowrap; margin: 2px 3px; max-width: 100%; }
  .mat-wrap.has-dim { margin-bottom: 1.35em; }
  .mat-main { display: inline-flex; align-items: center; gap: .35em; }
  .mat-name { font-weight: 800; font-style: italic; }
  .mat-dim { position: absolute; left: 0; right: 0; top: 100%; text-align: center; font-size: .72em; font-weight: 700; color: var(--muted); line-height: 1.3; }
  .mat { position: relative; display: inline-block; padding: .2em .66em; color: var(--text); }
  .mat.sq::before, .mat.sq::after { content: ''; position: absolute; top: 0; bottom: 0; width: .36em; border: 2.4px solid currentColor; pointer-events: none; }
  .mat.sq::before { left: 0; border-right: none; }
  .mat.sq::after { right: 0; border-left: none; }
  .mat.bar::before, .mat.bar::after { content: ''; position: absolute; top: 0; bottom: 0; border-left: 2.4px solid currentColor; pointer-events: none; }

  .mat-grid { display: inline-grid; gap: .12em .5em; align-items: center; justify-items: center; }
  .mc { display: flex; align-items: center; justify-content: center; min-width: 1.75em; min-height: 1.95em; padding: 0 .3em; border-radius: 7px; font-weight: 800; line-height: 1.2; transition: background .2s, box-shadow .2s, opacity .25s; }
  .mc .frac { margin: 0 1px; }
  .mc.empty { color: var(--muted); opacity: .6; font-weight: 700; }
  .mc.aug { border-left: 2.4px dashed var(--muted); border-radius: 0 7px 7px 0; margin-left: .35em; padding-left: .5em; }
  .mc.tap { cursor: pointer; }
  .mc.tap:hover { box-shadow: inset 0 0 0 2px var(--muted); }
  .mc.hb { background: color-mix(in srgb, var(--g-blue) 26%, transparent); box-shadow: inset 0 0 0 2px var(--g-blue); }

  .cp-tr-e.hb { stroke: var(--g-blue); stroke-width: 3.6; } .cp-tr-e.ho { stroke: var(--g-curve); stroke-width: 3.6; } .cp-tr-e.hg { stroke: var(--g-green); stroke-width: 3.6; }
  .cp-tr-e.hp { stroke: var(--g-purple); stroke-width: 3.6; } .cp-tr-e.hr { stroke: var(--g-red); stroke-width: 3.6; }

  .cp-tn.hb, .cp-te.hb, .cp-tf.hb { border-color: var(--g-blue); background: color-mix(in srgb, var(--g-blue) 24%, var(--card)); }

  /* แถวของ/คน */

  @media (max-width: 700px) {

  /* ═══ END ของกลางกลุ่มหลักการนับและความน่าจะเป็น ม.5 ═══ */

  /* ═══ BEGIN ของกลางกลุ่มสถิติ ม.6 (stMean… makeDotPlot makeFreqTable makeHistogram makeBoxPlot ใน base.js) — เพิ่มท้ายไฟล์เท่านั้น · สีใช้ --g-* / color-mix กับ --card จึงเปลี่ยนตามโหมดสว่าง/มืด ═══ */
  /* กรอบค่าที่แทนลงสูตร */
  .st-nb { display: inline-block; border: 2.5px solid color-mix(in srgb, var(--muted) 70%, var(--card)); background: color-mix(in srgb, var(--muted) 14%, var(--card)); border-radius: 10px; padding: 0 .35em; margin: 0 .1em; line-height: 1.25; }
  .mx sub .st-nb { border-width: 2px; border-radius: 7px; padding: 0 .22em; line-height: 1.1; }
  /* กราฟ SVG */
  .st-wrap { width: 100%; max-width: 600px; margin: 8px auto; }
  .st-svg { width: 100%; height: auto; display: block; background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; }
  .st-svg text { fill: var(--text); font-family: 'Anuphan', sans-serif; font-weight: 700; }
  .st-svg .st-tick { fill: var(--muted); font-weight: 600; }
  .st-svg .st-ytl { fill: var(--muted); }
  .st-axis { stroke: var(--muted); stroke-width: 1.8; }
  .st-grid { stroke: var(--border); stroke-width: 1; }
  .st-dot { fill: var(--g-blue); stroke: var(--g-ring); stroke-width: 1.6; transition: fill .2s; }
  .st-dot.hb { fill: var(--g-blue); stroke: var(--text); stroke-width: 2.4; }
  .st-dot.ho { fill: var(--g-curve); } .st-dot.hg { fill: var(--g-green); } .st-dot.hp { fill: var(--g-pink); }
  .st-hit { cursor: default; } .st-hit.drag { cursor: grab; touch-action: none; } .st-hit.drag:active { cursor: grabbing; }
  .st-bar { fill: color-mix(in srgb, var(--g-blue) 55%, var(--card)); stroke: var(--g-blue); stroke-width: 2; }
  .st-bars.faded .st-bar { fill-opacity: .35; }
  .st-bar.hb { fill: color-mix(in srgb, var(--g-blue) 85%, var(--card)); } .st-bar.ho { fill: color-mix(in srgb, var(--g-curve) 70%, var(--card)); stroke: var(--g-curve); }
  .st-bar.hg { fill: color-mix(in srgb, var(--g-green) 70%, var(--card)); stroke: var(--g-green); } .st-bar.hp { fill: color-mix(in srgb, var(--g-pink) 70%, var(--card)); stroke: var(--g-pink); }
  .st-line { fill: none; stroke: var(--g-curve); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; } .st-line.og { stroke: var(--g-blue); }
  .st-pt { fill: var(--g-curve); stroke: var(--g-ring); stroke-width: 1.6; }
  .st-line.og ~ .st-pt { fill: var(--g-blue); }
  /* ป้ายบนพื้นทึบ + หมุด */
  .st-lb rect { fill: var(--card); stroke: var(--border); stroke-width: 1.6; }
  .st-lb.st-fl rect { stroke: none; fill-opacity: 1; }
  .st-rd { stroke: var(--g-green); stroke-width: 2.6; stroke-dasharray: 7 5; stroke-linecap: round; }
  .st-rdl rect { stroke: var(--g-green); stroke-width: 2.2; } .st-rdl text { fill: color-mix(in srgb, var(--g-green) 72%, var(--text)); }
  .st-mk.green rect { stroke: var(--g-green); stroke-width: 2.2; } .st-mk.green text { fill: color-mix(in srgb, var(--g-green) 72%, var(--text)); }
  .st-mk.purple rect { stroke: var(--g-purple); stroke-width: 2.2; } .st-mk.purple text { fill: color-mix(in srgb, var(--g-purple) 72%, var(--text)); }
  .st-mk.pink rect { stroke: var(--g-pink); stroke-width: 2.2; } .st-mk.pink text { fill: color-mix(in srgb, var(--g-pink) 75%, var(--text)); }
  .st-mk.orange rect { stroke: var(--g-curve); stroke-width: 2.2; } .st-mk.orange text { fill: color-mix(in srgb, var(--g-curve) 68%, var(--text)); }
  .st-mk.blue rect { stroke: var(--g-blue); stroke-width: 2.2; } .st-mk.blue text { fill: color-mix(in srgb, var(--g-blue) 75%, var(--text)); }
  .st-mkl { stroke-width: 2.6; stroke-linecap: round; }
  .st-mkl.green { stroke: var(--g-green); } .st-mkl.purple { stroke: var(--g-purple); } .st-mkl.pink { stroke: var(--g-pink); } .st-mkl.orange { stroke: var(--g-curve); } .st-mkl.blue { stroke: var(--g-blue); }
  /* แผนภาพกล่อง */
  .st-bw { stroke: var(--g-blue); stroke-width: 3; stroke-linecap: round; }
  .st-bbox { fill: color-mix(in srgb, var(--g-blue) 14%, var(--card)); stroke: var(--g-blue); stroke-width: 3; } .st-bbox.hl { fill: color-mix(in srgb, var(--g-curve) 30%, var(--card)); stroke: var(--g-curve); }
  .st-bmed { stroke: var(--g-purple); stroke-width: 4.5; stroke-linecap: round; } .st-bmed.hl { stroke-width: 7; }
  .st-hlb.o { fill: var(--g-curve); fill-opacity: .55; } .st-hlb.b { fill: var(--g-blue); fill-opacity: .4; }
  /* ตารางแจกแจงความถี่ */
  .st-ftw { width: 100%; overflow-x: auto; margin: 8px 0; -webkit-overflow-scrolling: touch; }
  .st-ft { border-collapse: collapse; margin: 0 auto; font-size: 1.15rem; font-weight: 700; background: var(--card); }
  .st-ft th, .st-ft td { border: 1.5px solid var(--border); padding: 5px 12px; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .st-ft th { background: color-mix(in srgb, var(--g-blue) 12%, var(--card)); font-size: 1rem; line-height: 1.3; }
  .st-ft td.hb, .st-ft tr.hb td { background: color-mix(in srgb, var(--g-blue) 22%, var(--card)); }
  .st-ft td.ho, .st-ft tr.ho td { background: color-mix(in srgb, var(--g-curve) 26%, var(--card)); }
  .st-ft td.hg, .st-ft tr.hg td { background: color-mix(in srgb, var(--g-green) 24%, var(--card)); }
  .st-ft td.hp, .st-ft tr.hp td { background: color-mix(in srgb, var(--g-pink) 22%, var(--card)); }
  .st-ft tr.st-sum td { border-top: 3px double var(--muted); background: color-mix(in srgb, var(--g-green) 10%, var(--card)); }
  .st-tl5 { text-decoration: line-through; text-decoration-thickness: 2.5px; margin-right: .45em; }
  .st-ft td[data-k="tally"] { text-align: left; min-width: 4.6em; letter-spacing: .12em; }
  @media (max-width: 700px) {

  }

/* ── theme:start — สร้างโดย tools/build_lessons.py ห้ามแก้มือ (แก้ที่สคริปต์แล้วรันใหม่) ── */
/* ธีมชุดเดียวกับหน้าสารบัญ (tools/build_index.py · DESIGN.md หมวด Meta-inspired) — สีของเรื่องอยู่ที่ปกและในตัวบทเรียน กรอบหน้าเป็นสีกลาง */
:root{ --page:#9F1239; }
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#ffffff; --card:#ffffff; --panel:#f1f4f7; --raise:#e4e9ee;
  --text:#1c1e21; --muted:#5d6c7b; --dim:#8595a4; --line:#ced0d4; --line-soft:#dee3e9; --border:#ced0d4;
  --ink:#000000; --on-ink:#ffffff; --ink-hover:#2b3138; --link:#0064e0; --strong:#1c1e21; --shadow:none;
  --primary:color-mix(in srgb, var(--page) 86%, #000); --primary-2:color-mix(in srgb, var(--page) 62%, #000);
  --secondary:#C2540A; --secondary-light:#F2A15F; --accent:#68EF3F; --accent-2:#2E9E3F;
  --g-x:#E53935; --g-y:#2E9E4F; --g-z:#3949AB; --g-curve:#F07400; --g-curve-fill:rgba(240,116,0,.12);
  --g-pink:#D81B60; --g-plane:rgba(60,190,200,.28); --g-cone:rgba(153,51,0,.20); --g-cone-line:rgba(153,51,0,.35);
  --g-blue:#1E66D0; --g-red:#D32F2F; --g-green:#2E9E4F; --g-purple:#7B3FC4; --g-orange:#E8710A; --g-teal:#0F8A80;
  --g-ring:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#0a1317; --surface:#0a1317; --card:#0a1317; --panel:#1c1e21; --raise:#2b3138;
  --text:#ffffff; --muted:#9aa8b5; --dim:#6b7884; --line:#444950; --line-soft:#32383e; --border:#444950;
  --ink:#ffffff; --on-ink:#000000; --ink-hover:#d5dbe1; --link:#4da3ff; --strong:#2b3138; --shadow:none;
  --primary:#ec7999; --primary-2:#f19db4;
  --secondary:#FFB37A; --secondary-light:#FFD0A8; --accent:#8AF25E; --accent-2:#5BD27E;
  --g-x:#FF6B6B; --g-y:#5BD27E; --g-z:#8C9BFF; --g-curve:#FFA040; --g-curve-fill:rgba(255,160,64,.16);
  --g-pink:#FF5C9A; --g-plane:rgba(90,220,230,.26); --g-cone:rgba(255,170,110,.18); --g-cone-line:rgba(255,170,110,.45);
  --g-blue:#6AA8FF; --g-red:#FF6B6B; --g-green:#5BD27E; --g-purple:#B48CFF; --g-orange:#FFA040; --g-teal:#4FD1C5;
  --g-ring:#0a1317;
}
html{ background:var(--bg); color-scheme:light; }
html[data-theme="dark"]{ color-scheme:dark; }
body{ font-family:'Anuphan',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; }
:focus-visible{ outline:2px solid var(--link); outline-offset:2px; }

/* หัวหน้า: แผ่นสีอ่อนมุมโค้ง ตัวหนังสือเข้ม + ปกข้างชื่อ (สีของเรื่องอยู่ที่ปก) */
header{
  background:var(--panel); color:var(--text); text-align:left; overflow:hidden;
  display:grid; grid-template-columns:auto 1fr; column-gap:24px; align-items:end;
  margin:8px 8px 0; padding:74px 32px 28px; border-radius:32px; box-shadow:none;
}
header::before, header::after{ display:none !important; }
header > *:not(.lesson-cover):not(.back-link):not(.lang-toggle):not(.theme-toggle){ grid-column:2; }
.lesson-cover{ grid-column:1; grid-row:1 / span 6; align-self:end; width:clamp(96px, 11vw, 136px); aspect-ratio:1; border-radius:16px; overflow:hidden; box-shadow:none; }
.lesson-cover svg{ display:block; width:100%; height:100%; }
header h1{ font-size:clamp(1.9rem, 4.4vw, 3.2rem); font-weight:500; letter-spacing:0; line-height:1.25; margin:0; color:var(--text); }
header p{ font-size:1.02rem; opacity:1; margin:8px 0 0; color:var(--muted); line-height:1.55; }
.back-link{
  position:absolute; top:16px; left:16px; z-index:2; display:inline-flex; align-items:center; gap:6px;
  height:38px; padding:0 16px; border-radius:100px; background:var(--surface); color:var(--text);
  box-shadow:inset 0 0 0 1px var(--line); font-size:.92rem; font-weight:700; opacity:1; text-decoration:none;
}
.back-link:hover{ background:var(--raise); opacity:1; text-decoration:none; }
.lang-toggle, .theme-toggle{
  position:absolute; top:16px; height:38px; border-radius:100px; font-family:inherit; font-weight:700; font-size:.88rem;
  cursor:pointer; z-index:2; transition:transform .12s, background .12s;
}
.lang-toggle{ right:16px; min-width:64px; padding:0 16px; background:var(--ink); color:var(--on-ink); border:1px solid var(--ink); }
.lang-toggle:hover{ background:var(--ink); border-color:var(--ink); transform:scale(1.04); }
.theme-toggle{ right:88px; width:38px; padding:0; display:grid; place-items:center; background:var(--surface); color:var(--text); border:1px solid var(--line); }
.theme-toggle svg{ width:18px; height:18px; }
.theme-toggle:hover{ background:var(--raise); border-color:var(--line); }
body > .lang-toggle, body > .theme-toggle{ position:fixed; top:14px; z-index:50; }
body > .lang-toggle{ right:14px; } body > .theme-toggle{ right:86px; }
header:not(:has(.back-link)):not(:has(.lang-toggle)){ padding-top:28px; }

/* แถบแท็บ: ชิปขอบบาง ตัวที่เลือก = สีหมึก (ดำ / โหมดมืดขาว) */
nav{ background:var(--bg); border-bottom:0; padding:16px 16px 8px; gap:8px; box-shadow:none; }
.tab-btn{
  font-family:inherit; border:0; margin:0; border-radius:100px; padding:8px 18px;
  background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 1px var(--line); font-weight:600; font-size:.95rem;
}
.tab-btn:hover{ background:var(--raise); color:var(--text); }
.tab-btn.active{ background:var(--ink); color:var(--on-ink); box-shadow:none; border-bottom-color:transparent; }

/* การ์ดและกล่อง: พื้นเรียบ ขอบ 1px ไม่มีเงา */
.card{ background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:none; }
.card-title{ color:var(--text); font-size:1.2rem; }
.card-title .icon{ display:none; }
.desc-text{ color:var(--text); font-size:1rem; }
.formula, .step.result, .stats{ background:var(--strong) !important; color:#fff; border-radius:16px; letter-spacing:0; }
.stat .k, .step-tag{ text-transform:none; letter-spacing:0; }

/* ปุ่ม: หลัก = แคปซูลหมึก, รอง = แคปซูลขอบบาง */
.btn-action{ font-family:inherit; background:var(--ink); color:var(--on-ink); border:1px solid var(--ink); border-radius:100px; }
.btn-action:hover:not(:disabled){ background:var(--ink-hover); border-color:var(--ink-hover); }
.btn-action.secondary{ background:transparent; color:var(--text); border:1px solid var(--line); }
.btn-action.secondary:hover:not(:disabled){ background:var(--raise); }
.mode-btn{ font-family:inherit; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:100px; }
.mode-btn:hover{ border-color:var(--text); color:var(--text); }
.mode-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
input[type=range]{ accent-color:var(--primary); }

@media (max-width:600px){
  header{ margin:0; border-radius:0 0 24px 24px; padding:64px 16px 20px; column-gap:14px; }
  .lesson-cover{ width:72px; border-radius:12px; }
  header h1{ font-size:clamp(1.5rem, 7vw, 2rem); }
  header p{ font-size:.95rem; }
  .back-link{ top:14px; left:12px; height:36px; padding:0 14px; max-width:calc(100% - 150px); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; display:block; line-height:36px; }
  .lang-toggle, .theme-toggle{ top:14px; height:36px; }
  .lang-toggle{ right:12px; min-width:58px; padding:0 12px; }
  .theme-toggle{ right:78px; width:36px; }
  nav{ flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; scrollbar-width:none; padding:12px 12px 6px; }
  nav .tab-btn{ flex:0 0 auto; white-space:nowrap; }   /* ชื่อแท็บบรรทัดเดียว ปัดแถบซ้าย-ขวาแทน (ไม่บีบจนตัดคำ) */
  nav::-webkit-scrollbar{ display:none; }
}
/* โหมดมืด: สีที่หน้านี้ฝังไว้เอง (สร้างอัตโนมัติ) */
:root[data-theme="dark"] .box-warn{background:#281d0f}
:root[data-theme="dark"] .box-ok{background:#102a1d}
:root[data-theme="dark"] .ans{background:#102a1d;color:#a8f8e1}
:root[data-theme="dark"] .bad{background:#270f10;color:#f49ab2}
:root[data-theme="dark"] .hl{background:#383115}

<script>
const PAGE_TITLE = { th: "สื่อการสอน : ดีเทอร์มิแนนต์ ม.5", en: "Teaching Aid: Determinants" };
// ══════════════ ภาษาไทย/อังกฤษ (ค่าใน data-th/data-en ถือเป็น HTML — ดู docs/adr/0002) ══════════════
let langMemory = 'th';
function getLang() { try { return localStorage.getItem('siteLang') || 'th'; } catch (e) { return langMemory; } }
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th; });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  LIVE.forEach(w => w.refresh && w.refresh());
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
const LIVE = [];

// ══════════════ ตัวช่วย ══════════════
const EN = () => getLang() === 'en';
const T = (th, en) => ({ th, en });
const tx = v => (v == null ? '' : typeof v === 'string' ? v : v[getLang()]);
const esc = s => s.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
const d = (th, en) => `<span data-th="${esc(th)}" data-en="${esc(en)}">${th}</span>`;
const frac = (n, dd) => `<span class="frac"><span class="num">${n}</span><span class="den">${dd}</span></span>`;
const rt = s => `<span class="rt"><span class="rt-s">√</span><span class="rt-in">${s}</span></span>`;
const P = (b, e) => `${b}<sup>${e}</sup>`;
const mn = v => String(v).replace(/-/g, '−');
const num = x => { if (!isFinite(x)) return x > 0 ? '∞' : '−∞'; let s = (Math.round(x * 100) / 100).toString(); return mn(s === '-0' ? '0' : s); };
const ans = h => `<span class="ans">${h}</span>`;
const bad = h => `<span class="bad">${h}</span>`;
const card = (icon, title, inner) => `<div class="card"><div class="card-title"><span class="icon">${icon}</span><span>${title}</span></div>${inner}</div>`;
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const fn = h => `<i>f</i>(<i>x</i>)`;
// สัมประสิทธิ์พหุนามเป็น HTML เช่น poly([2,-3,1]) = 2x² − 3x + 1 (ดีกรีสูง→ต่ำ ระบุเป็น [c0,c1,c2,...] จากต่ำไปสูง)
function polyHtml(c, v) {
  v = v || '<i>x</i>';
  let s = '';
  for (let k = c.length - 1; k >= 0; k--) {
    const a = c[k]; if (a === 0) continue;
    const abs = Math.abs(a), sign = a < 0 ? '−' : '+';
    let body = k === 0 ? String(abs) : (abs === 1 ? '' : String(abs)) + v + (k > 1 ? `<sup>${k}</sup>` : '');
    if (!s) s = (a < 0 ? '−' : '') + body; else s += ` ${sign} ${body}`;
  }
  return s || '0';
}
const pAdd = (a, b) => { const n = Math.max(a.length, b.length), r = []; for (let i = 0; i < n; i++) r.push((a[i] || 0) + (b[i] || 0)); return r; };
const pMul = (a, b) => { const r = Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => { r[i + j] += x * y; })); return r; };
const pComp = (f, g) => { let r = [0], pw = [1]; f.forEach(c => { r = pAdd(r, pMul([c], pw)); pw = pMul(pw, g); }); return r; };
const pEval = (c, x) => c.reduceRight((s, a) => s * x + a, 0);
const pTrim = c => { c = c.slice(); while (c.length > 1 && c[c.length - 1] === 0) c.pop(); return c; };

// ══════════════ แท็บ ══════════════
function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  if (!btn) btn = [...document.querySelectorAll('.tab-btn')].find(b => b.getAttribute('onclick').includes("'" + id + "'"));
  if (btn) btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
const goTab = (id, label) => `<button class="btn ghost" onclick="showTab('${id}')">${label}</button>`;

// ══════════════ ขั้นตอนทีละแถว (ตัวอย่างการคำนวณ: โจทย์คงที่ เผยทีละขั้น) ══════════════
// rows: () => [{ h: 'html สมการ', n: 'หมายเหตุ' }]  — สมการเขียนเต็มฝั่งซ้ายทุกขั้น
function makeSteps(host, rows) {
  const w = { k: 0 };
  host.innerHTML = '<div class="wk-list"></div><div class="wg-nav"><button class="btn ghost prev"></button><span class="wg-cnt"></span><button class="btn next"></button></div>';
  const list = host.querySelector('.wk-list'), prev = host.querySelector('.prev'), next = host.querySelector('.next'), cnt = host.querySelector('.wg-cnt');
  w.render = fresh => {
    const rs = rows(); if (w.k >= rs.length) w.k = rs.length - 1;
    list.innerHTML = rs.slice(0, w.k + 1).map((r, i) => `<div class="wk-cell${i === rs.length - 1 ? ' final' : ''}${i === w.k && fresh ? ' fresh' : ''}"><span class="stepno">${i + 1}</span><div class="wk-eq">${tx(r.h)}</div>${r.n ? `<div class="wk-note">${tx(r.n)}</div>` : ''}</div>`).join('');
    cnt.textContent = (EN() ? 'Step ' : 'ขั้นที่ ') + (w.k + 1) + ' / ' + rs.length;
    prev.disabled = w.k === 0; next.disabled = w.k >= rs.length - 1;
    prev.textContent = EN() ? '◀ Back' : '◀ ย้อน'; next.textContent = EN() ? 'Next ▶' : 'ถัดไป ▶';
  };
  w.reset = () => { w.k = 0; w.render(false); };
  w.refresh = () => w.render(false);
  prev.onclick = () => { if (w.k > 0) { w.k--; w.render(false); } };
  next.onclick = () => { w.k++; w.render(true); };
  LIVE.push(w); w.render(false);
  return w;
}
// ตัวเลือกโจทย์ (ชิป) + stepper: items = [{ id, label, rows }]
function makeProblemSteps(host, label, items) {
  host.innerHTML = '<div class="chips"></div><div class="ps-body"></div>';
  const chips = host.querySelector('.chips'), body = host.querySelector('.ps-body');
  let cur = 0, st = null;
  const paint = () => {
    chips.innerHTML = `<span class="chips-label">${tx(label)}</span>` + items.map((it, i) => `<button class="chip${i === cur ? ' active' : ''}" data-i="${i}">${tx(it.label)}</button>`).join('');
    chips.querySelectorAll('.chip').forEach(c => c.onclick = () => { cur = +c.dataset.i; st = null; start(); paint(); });
  };
  const start = () => { body.innerHTML = ''; const h = document.createElement('div'); body.appendChild(h); st = makeSteps(h, () => items[cur].rows()); LIVE.splice(LIVE.indexOf(st), 1); };
  start(); paint();
  const w = { refresh() { paint(); st.render(false); } };
  LIVE.push(w);
  return w;
}

// ══════════════ แบบฝึกหัดปรนัย ══════════════
// items: [{ q: T|html, o: [html...], a: index, e: T|html }]
function makeQuiz(host, items) {
  // สลับลำดับตัวเลือกแบบคงที่ (seed ตามข้อ) ไม่ให้คำตอบถูกกองอยู่ตำแหน่งเดิม — คำอธิบายห้ามอ้าง "ข้อ 1/2/3/4" ของตัวเลือก
  items = items.map((it, n) => {
    // ตำแหน่งที่คำตอบถูกจะไปอยู่: วนตามลำดับคงที่ให้กระจายทุกตำแหน่ง ส่วนตัวหลอกสลับด้วย seed ตามข้อ
    const target = [2, 0, 3, 1, 3, 2, 0, 1, 2, 3, 1, 0][n % 12] % it.o.length;
    let seed = (n + 1) * 0x9E3779B1 >>> 0;
    const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const others = it.o.map((_, k) => k).filter(k => k !== it.a);
    for (let k = others.length - 1; k > 0; k--) { const m = Math.floor(rnd() * (k + 1)); [others[k], others[m]] = [others[m], others[k]]; }
    const order = others.slice(); order.splice(target, 0, it.a);
    return Object.assign({}, it, { o: order.map(k => it.o[k]), a: target });
  });
  const w = { i: 0, score: 0, done: false, picked: null };
  host.innerHTML = '<div class="quiz-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px"><span class="qprog" style="color:var(--muted)"></span><span class="score-badge"></span></div><div class="qbox"></div><div class="qctl"></div>';
  const prog = host.querySelector('.qprog'), badge = host.querySelector('.score-badge'), box = host.querySelector('.qbox'), ctl = host.querySelector('.qctl');
  const bt = (th, en) => EN() ? en : th;
  w.render = () => {
    badge.innerHTML = `${bt('คะแนน', 'Score')} ${w.score} / ${items.length}`;
    if (w.i >= items.length) {
      prog.textContent = '';
      const r = w.score / items.length;
      const msg = r === 1 ? bt('ยอดเยี่ยม! ครบทุกข้อ', 'Perfect!') : r >= .7 ? bt('เก่งมาก ไปต่อได้เลย', 'Great — keep going') : bt('ลองทบทวนแท็บด้านบนแล้วเล่นใหม่อีกรอบ', 'Review the tabs above and try again');
      box.innerHTML = `<div class="score-card"><div style="font-size:2.4rem">🎉</div><div style="font-size:1.4rem;font-weight:800;margin:6px 0">${bt('จบแบบฝึกหัด', 'Quiz finished')}</div><div style="font-size:2.6rem;font-weight:800">${w.score} / ${items.length}</div><div style="margin-top:6px">${msg}</div></div>`;
      ctl.innerHTML = `<button class="btn-next retry">${bt('เล่นใหม่ 🔄', 'Play again 🔄')}</button>`;
      ctl.querySelector('.retry').onclick = () => { w.i = 0; w.score = 0; w.picked = null; w.render(); };
      return;
    }
    const it = items[w.i];
    prog.textContent = bt(`ข้อที่ ${w.i + 1} / ${items.length}`, `Question ${w.i + 1} / ${items.length}`);
    box.innerHTML = `<div class="quiz-q">${w.i + 1}. ${tx(it.q)}</div><div class="quiz-opts">${it.o.map((o, k) => `<button class="quiz-opt" data-k="${k}">${tx(o)}</button>`).join('')}</div><div class="quiz-feedback"></div>`;
    ctl.innerHTML = '';
    box.querySelectorAll('.quiz-opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
    if (w.picked !== null) mark(w.picked);
  };
  function mark(k) {
    const it = items[w.i], fb = box.querySelector('.quiz-feedback');
    box.querySelectorAll('.quiz-opt').forEach((b, idx) => { if (idx === it.a) b.classList.add('correct'); else if (idx === k) b.classList.add('wrong'); b.style.pointerEvents = 'none'; });
    const ok = k === it.a;
    fb.className = 'quiz-feedback ' + (ok ? 'ok' : 'err');
    fb.innerHTML = (ok ? '✅ ' + bt('ถูกต้อง! ', 'Correct! ') : '❌ ' + bt('ยังไม่ใช่ — ', 'Not quite — ')) + tx(it.e);
    ctl.innerHTML = `<button class="btn-next nx">${w.i < items.length - 1 ? bt('ข้อถัดไป ▶', 'Next ▶') : bt('ดูคะแนน 🏁', 'See score 🏁')}</button>`;
    ctl.querySelector('.nx').onclick = () => { w.i++; w.picked = null; w.render(); };
  }
  function pick(k) { if (w.picked !== null) return; w.picked = k; if (k === items[w.i].a) w.score++; badge.innerHTML = `${bt('คะแนน', 'Score')} ${w.score} / ${items.length}`; mark(k); }
  w.refresh = () => w.render();
  LIVE.push(w); w.render();
  return w;
}

// ══════════════ ตัวเลื่อน ══════════════
function sliderRow(label, id, min, max, step, val) {
  return `<div class="slider-row"><b>${label}</b><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span class="slider-val" id="${id}v"></span></div>`;
}

// ══════════════ กราฟ SVG ══════════════
let PLOT_N = 0;
class Plot {
  constructor(o) {
    Object.assign(this, { w: 520, h: 400, xmin: -5, xmax: 5, ymin: -5, ymax: 5, pad: 30, gx: 1, gy: 1, lx: 1, ly: 1, grid: true }, o);
    this.id = 'pc' + (++PLOT_N); this.back = []; this.front = [];
    this.sx = (this.w - 2 * this.pad) / (this.xmax - this.xmin);
    this.sy = (this.h - 2 * this.pad) / (this.ymax - this.ymin);
  }
  X(x) { return +(this.pad + (x - this.xmin) * this.sx).toFixed(2); }
  Y(y) { return +(this.h - this.pad - (y - this.ymin) * this.sy).toFixed(2); }

// ══════════════ แผนภาพลูกศร (mapping diagram) ══════════════
// A, B = ป้ายสมาชิก; pairs = [[i, j]]; o.flag = ระบายสีสมาชิก A ที่ผิดปกติ (ลูกศรออกหลายเส้น = แดง); o.capA/capB = หัวเซต

// ══════════════ ช่วงจำนวนจริง ══════════════

//  ชุดของกลางสำหรับสื่อ "เห็นภาพ + ได้ลองทำ" (docs/media-design-guide.md) — ใช้ร่วมทั้ง 5 ชิ้น
//  ไม่มีไลบรารีภายนอก: SVG + requestAnimationFrame + Promise (เปิดจาก file:// ได้)
//
//  1) makeAnimator()        ตัวคุมแอนิเมชัน: await A.run(ms, t => …) · await A.wait(ms) · A.kill()
//  2) sv / svArrow / svChip ตัวช่วยสร้างองค์ประกอบ SVG (ลูกศรที่ยืด/เลื่อนปลายได้, "ชิปคู่อันดับ")
//  3) makeScenes()          ตัวเล่นฉาก  ◀ ↻ ▶ + "ฉากที่ k / n"
//  4) makePredict()         ทายก่อนเฉลย (เลือกข้อ → ภาพ → ทาย → ผล + เฉลยบนภาพ)

// ───────── 1) แอนิเมชัน ─────────
const EASE = {
