<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รวมสื่อการสอน by P'Earth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

:root {
  --primary: #1C3B22;
  --secondary: #FF8A3D;
  --accent: #68EF3F;
  --bg: #F3F7EC;
  --card: #FFFFFF;
  --text: #2D3748;
  --muted: #718096;
  --border: #E2E8F0;
  --shadow: 0 4px 24px rgba(28,59,34,0.10);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%);
  color: white;
  padding: 32px 24px 28px;
  text-align: center;
  position: relative;
}

header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
header p { font-size: 0.95rem; opacity: 0.9; }
.lang-toggle {
  position: absolute;
  top: 12px; right: 20px;
  background: rgba(255,255,255,.15);
  color: white;
  border: 1.5px solid rgba(255,255,255,.5);
  border-radius: 20px;
  padding: 5px 14px;
  font-family: 'Sarabun', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  cursor: pointer;
  z-index: 2;
}
.lang-toggle:hover { background: rgba(255,255,255,.28); }

.crumb {
  max-width: 1000px;
  margin: 20px auto 0;
  padding: 0 24px;
}
.crumb a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
}
.crumb a:hover { text-decoration: underline; }

main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 20px;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(28,59,34,0.18);
}

.card .icon { font-size: 2.2rem; }
.card .title { font-size: 1.1rem; font-weight: 700; }
.card .desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.card .tag {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--primary);
  background: #E3F3D8;
  border-radius: 999px;
  padding: 3px 10px;
}

.empty-note {
  color: var(--muted);
  font-size: 0.9rem;
  margin-top: 16px;
}
</style>
</head>
<body>

<header>
  <button id="langToggle" class="lang-toggle" onclick="toggleLang()">EN</button>
  <h1 data-th="📚 รวมสื่อการสอน by P'Earth" data-en="📚 Teaching Materials by P'Earth">📚 รวมสื่อการสอน by P'Earth</h1>
  <p data-th="เลือกรายวิชาเพื่อดูสื่อการสอนทั้งหมด" data-en="Choose a subject to see all its teaching materials">เลือกรายวิชาเพื่อดูสื่อการสอนทั้งหมด</p>
</header>

<main>
  <div id="subjectGrid" class="grid"></div>
  <p id="emptyNote" class="empty-note" style="display:none;" data-th="ยังไม่มีรายวิชา" data-en="No subjects yet">ยังไม่มีรายวิชา</p>
</main>

<script>
// ── ปุ่มสลับภาษาไทย/อังกฤษ (โค้ดชุดนี้ฝังซ้ำในทุกหน้าของเว็บ) ──
const PAGE_TITLE = { th: "รวมสื่อการสอน by P'Earth", en: "Teaching Materials by P'Earth" };

let langMemory = 'th';
function getLang() {
  try { return localStorage.getItem('siteLang') || 'th'; }
  catch (e) { return langMemory; }
}
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => {
    el.textContent = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th;
  });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
function onLangChange(lang) { renderSubjects(); }

// เพิ่มวิชาใหม่: เพิ่ม object ในนี้ (slug ต้องตรงกับชื่อโฟลเดอร์ ใส่ทั้ง _th และ _en)
const SUBJECTS = [
  { slug: "math", title_th: "คณิตศาสตร์", title_en: "Mathematics", desc_th: "สื่อการสอนวิชาคณิตศาสตร์", desc_en: "Mathematics teaching materials", icon: "📐" }
];

function renderSubjects() {
  const lang = getLang();
  const grid = document.getElementById("subjectGrid");
  if (SUBJECTS.length === 0) {
    document.getElementById("emptyNote").style.display = "block";
  } else {
    grid.innerHTML = SUBJECTS.map(s => `
      <a class="card" href="./${s.slug}/index.html">
        <div class="icon">${s.icon}</div>
        <div class="title">${lang === 'en' ? s.title_en : s.title_th}</div>
        <div class="desc">${lang === 'en' ? s.desc_en : s.desc_th}</div>
      </a>
    `).join("");
  }
}

renderSubjects();
applyLang(getLang());
</script>

</body>
</html>
