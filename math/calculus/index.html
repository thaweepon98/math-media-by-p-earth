<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แคลคูลัส — รวมสื่อการสอน by P'Earth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

:root {
  --primary: #1B3B6F;
  --secondary: #FF6584;
  --accent: #43D9AD;
  --bg: #F0F4FF;
  --card: #FFFFFF;
  --text: #2D3748;
  --muted: #718096;
  --border: #E2E8F0;
  --shadow: 0 4px 24px rgba(108,99,255,0.10);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #1B3B6F 0%, #2C5F8A 100%);
  color: white;
  padding: 32px 24px 28px;
  text-align: center;
  position: relative;
}

header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
header p { font-size: 0.95rem; opacity: 0.9; }
.lang-toggle {
  position: absolute;
  top: 12px; right: 20px;
  background: rgba(255,255,255,.15);
  color: white;
  border: 1.5px solid rgba(255,255,255,.5);
  border-radius: 20px;
  padding: 5px 14px;
  font-family: 'Sarabun', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  cursor: pointer;
  z-index: 2;
}
.lang-toggle:hover { background: rgba(255,255,255,.28); }

.crumb {
  max-width: 1000px;
  margin: 20px auto 0;
  padding: 0 24px;
}
.crumb a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
}
.crumb a:hover { text-decoration: underline; }

main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 20px;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(108,99,255,0.18);
}

.card .icon { font-size: 2.2rem; }
.card .title { font-size: 1.1rem; font-weight: 700; }
.card .desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.card .tag {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--primary);
  background: #E7ECF5;
  border-radius: 999px;
  padding: 3px 10px;
}

.empty-note {
  color: var(--muted);
  font-size: 0.9rem;
  margin-top: 16px;
}
</style>
</head>
<body>

<header>
  <button id="langToggle" class="lang-toggle" onclick="toggleLang()">EN</button>
  <h1 data-th="🔬 แคลคูลัส" data-en="🔬 Calculus">🔬 แคลคูลัส</h1>
  <p data-th="ลิมิต อนุพันธ์ และปริพันธ์" data-en="Limits, Derivatives, and Integrals">ลิมิต อนุพันธ์ และปริพันธ์</p>
</header>

<div class="crumb"><a href="../index.html" data-th="← กลับหน้าคณิตศาสตร์" data-en="← Back to Mathematics">← กลับหน้าคณิตศาสตร์</a></div>

<main>
  <div id="topicGrid" class="grid"></div>
  <p id="emptyNote" class="empty-note" style="display:none;" data-th="ยังไม่มีสื่อ" data-en="No materials yet">ยังไม่มีสื่อ</p>
</main>

<script>
// ── ปุ่มสลับภาษาไทย/อังกฤษ (โค้ดชุดนี้ฝังซ้ำในทุกหน้าของเว็บ) ──
const PAGE_TITLE = { th: "แคลคูลัส — รวมสื่อการสอน by P'Earth", en: "Calculus — Teaching Materials by P'Earth" };

let langMemory = 'th';
function getLang() {
  try { return localStorage.getItem('siteLang') || 'th'; }
  catch (e) { return langMemory; }
}
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => {
    el.textContent = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th;
  });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
function onLangChange(lang) { renderTopics(); }

// เพิ่มสื่อใหม่ในหมวดแคลคูลัส (อนุพันธ์/ปริพันธ์): copy ไฟล์ html เข้าโฟลเดอร์นี้ (math/calculus/) แล้วเพิ่ม object ในนี้ (ใส่ทั้ง _th และ _en)
const TOPICS = [
  { file: "limits.html", title_th: "ลิมิต", title_en: "Limits", desc_th: "ที่มา ความหมาย ลิมิตทางเดียว และความต่อเนื่อง", desc_en: "Origins, meaning, one-sided limits, and continuity", icon: "🔍", tags_th: ["ลิมิต"], tags_en: ["Limits"] },
  { file: "derivatives/index.html", title_th: "อนุพันธ์", title_en: "Derivatives", desc_th: "นิยาม กฎการหาอนุพันธ์ ค่าสุดขีด การร่างกราฟ และการประยุกต์", desc_en: "Definition, differentiation rules, extrema, curve sketching, and applications", icon: "📐", tags_th: ["อนุพันธ์", "5 หัวข้อย่อย"], tags_en: ["Derivatives", "5 sub-topics"] },
  { file: "integrals/index.html", title_th: "ปริพันธ์", title_en: "Integrals", desc_th: "ปฏิยานุพันธ์ เทคนิคการหาปริพันธ์ ปริพันธ์จำกัดเขต และการประยุกต์", desc_en: "Antiderivatives, integration techniques, definite integrals, and applications", icon: "∫", tags_th: ["ปริพันธ์", "7 หัวข้อย่อย"], tags_en: ["Integrals", "7 sub-topics"] }
];

function renderTopics() {
  const lang = getLang();
  const grid = document.getElementById("topicGrid");
  if (TOPICS.length === 0) {
    document.getElementById("emptyNote").style.display = "block";
  } else {
    grid.innerHTML = TOPICS.map(t => `
      <a class="card" href="./${t.file}">
        <div class="icon">${t.icon}</div>
        <div class="title">${lang === 'en' ? t.title_en : t.title_th}</div>
        <div class="desc">${lang === 'en' ? t.desc_en : t.desc_th}</div>
        <div class="tags">${(lang === 'en' ? t.tags_en : t.tags_th).map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
      </a>
    `).join("");
  }
}

renderTopics();
applyLang(getLang());
</script>

</body>
</html>
