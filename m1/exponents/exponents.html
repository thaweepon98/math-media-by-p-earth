(function () {
  var orig = window.addEventListener, pending = [], fired = false;
  window.addEventListener = function (type, fn, opts) {
    if (type !== 'load') return orig.call(this, type, fn, opts);
    if (fired) setTimeout(fn, 0); else pending.push(fn);
  };
  function fire() {
    if (fired) return;
    fired = true;
    pending.forEach(function (fn) { try { fn.call(window, new Event('load')); } catch (e) { console.error(e); } });
    pending = [];
  }
  orig.call(window, 'load', fire);
  (function poll() { if (document.readyState === 'complete') setTimeout(fire, 0); else setTimeout(poll, 30); })();
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สื่อการสอน : เลขยกกำลัง ม.1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #1C3B22; --secondary: #FF8A3D; --accent: #68EF3F; --accent-2: #3FA82E; --warning: #FFB347;
    --bg: #F3F7EC; --card: #FFFFFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(28,59,34,0.10); --radius: 16px;
    --pos: #047857; --pos-bg: #ECFDF5; --neg: #BE185D; --neg-bg: #FFF4EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Anuphan', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  sup { font-size: .68em; line-height: 0; vertical-align: super; font-weight: 800; }
  sup sup { font-size: .8em; }

  header { background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%); color: white; padding: 28px 40px 20px; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: .5px; }
  header p { font-size: 1rem; opacity: .85; margin-top: 4px; }
  .back-link { position: absolute; top: 14px; left: 20px; color: white; text-decoration: none; font-size: .85rem; font-weight: 600; opacity: .9; z-index: 2; }
  .back-link:hover { opacity: 1; text-decoration: underline; }
  .lang-toggle { position: absolute; top: 14px; right: 20px; background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.5); border-radius: 20px; padding: 5px 14px; font-family: 'Anuphan', sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 20px 24px 0; background: white; border-bottom: 3px solid var(--border); }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 10px 10px 0 0; font-family: 'Anuphan', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .25s; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab-btn:hover { color: var(--primary); background: #E3F3D8; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #E3F3D8; }

  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  .tab-panel { display: none; animation: fadeIn .35s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-title .icon { font-size: 1.5rem; }
  .intro { font-size: 1.02rem; line-height: 1.8; margin-bottom: 14px; }
  .box-info { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-warn { background: #FFF7ED; border-left: 4px solid var(--warning); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-ok   { background: #ECFDF5; border-left: 4px solid var(--accent);  border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .formula { background: linear-gradient(135deg,#1C3B22,#2E5936); color: white; border-radius: 12px; padding: 14px 24px; text-align: center; font-size: 1.3rem; font-weight: 700; margin: 14px 0; letter-spacing: .5px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 18px; }

  .btn { padding: 10px 24px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s; }
  .btn:hover:not(:disabled) { background: #2E5936; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost:hover:not(:disabled) { background: #E3F3D8; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; align-items: center; }
  .chips .chips-label { font-weight: 700; color: var(--muted); font-size: .95rem; margin-right: 2px; }
  .chip { padding: 7px 16px; border: 2px solid var(--border); border-radius: 30px; background: #fff; font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--text); display: inline-flex; align-items: center; gap: 4px; }
  .chip:hover { border-color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; line-height: 1.15; vertical-align: middle; margin: 0 4px; }
  .frac .num { font-size: 1em; border-bottom: 2.5px solid currentColor; padding: 0 3px 2px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .den { font-size: 1em; padding: 3px 3px 0; min-width: 18px; text-align: center; white-space: nowrap; }

  .slider-row { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
  .slider-row b { min-width: 30px; font-size: 1.05rem; }
  input[type=range] { accent-color: var(--primary); flex: 1; max-width: 260px; min-width: 100px; }
  .slider-val { font-weight: 800; color: var(--primary); font-size: 1.1rem; min-width: 26px; }

  /* ─── ตัวแสดงแผ่นฐาน (stage): แผ่นจัดตำแหน่งแบบ absolute แล้วให้ CSS transition เลื่อนเอง ─── */
  .stage-outer { position: relative; width: 100%; max-width: 680px; margin: 10px auto 6px; overflow: hidden; background: #FBFDF8; border: 1.5px dashed var(--border); border-radius: 14px; transition: height .45s ease; }
  .stage-inner { position: absolute; left: 0; top: 0; width: 680px; transform-origin: 0 0; }
  .st { position: absolute; transition: left .85s ease, top .85s ease, width .85s ease, height .85s ease, opacity .6s ease, background .5s, border-color .5s, color .5s, box-shadow .5s; }
  .st-t { width: 38px; height: 38px; border-radius: 9px; border: 2.5px solid; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
  .st-t[data-n]::after { content: attr(data-n); position: absolute; bottom: -17px; left: 0; right: 0; text-align: center; font-size: .74rem; font-weight: 700; color: var(--muted); }
  .t-a { background: #DBEAFE; border-color: #2563EB; color: #1E40AF; }
  .t-b { background: #FEF3C7; border-color: #D97706; color: #92400E; }
  .t-neg { background: #FFE4E6; border-color: #E11D48; color: #9F1239; }
  .t-pos { background: #DCFCE7; border-color: #16A34A; color: #166534; }
  .t-c { background: #FFEDD5; border-color: #F97316; color: #9A3412; }
  .t-ghost { background: #F1F5F9; border-color: #94A3B8; color: #64748B; border-style: dashed; }
  .t-pair { box-shadow: 0 0 0 4px rgba(249,115,22,.6); }
  .t-big { width: 78px; font-size: 1.15rem; }
  .st-x { border: 2.5px solid; border-radius: 10px; background: transparent; }
  .x-g { border-color: #94A3B8; }
  .x-p1 { border-color: #2563EB; background: rgba(37,99,235,.06); }
  .x-line { height: 3px !important; border: none; background: var(--text); border-radius: 2px; }
  .st-s { font-weight: 800; color: var(--text); text-align: center; white-space: nowrap; font-size: 1.1rem; line-height: 1.2; }
  .l-red { color: #DC2626; }
  .l-mut { color: var(--muted); font-size: .95rem; font-weight: 700; }
  .l-big { font-size: 3rem; color: var(--primary); }
  .l-paren { font-size: 2.2rem; font-weight: 400; color: var(--muted); line-height: 1; }
  .l-neg { color: #E11D48; font-size: 1.7rem; }

  .wg-params { margin-bottom: 4px; }
  .wg-eq { text-align: center; font-size: 1.35rem; font-weight: 800; color: var(--primary); min-height: 3.1em; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .wg-cap { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 12px 16px; line-height: 1.75; min-height: 3.7em; margin-top: 6px; }
  .wg-res:not(:empty) { margin-top: 10px; background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 12px 16px; line-height: 1.9; font-weight: 700; animation: rowIn .5s ease; }
  .wg-nav { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .wg-nav .btn { padding: 9px 22px; }
  .wg-cnt { font-weight: 700; color: var(--muted); min-width: 92px; text-align: center; }

  /* ป้ายสมบัติ ①–⑨ (สีประจำแต่ละข้อ) */
  .pbadge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--pc); color: #fff; font-weight: 800; font-size: .85rem; vertical-align: middle; flex: none; }
  .hl { border-radius: 5px; padding: 0 3px; }
  .ans { background: #ECFDF5; border: 2px solid var(--accent-2); border-radius: 8px; padding: 2px 10px; color: #047857; font-weight: 800; }
  .ptag { display: inline-block; background: #F1F5F9; border-radius: 20px; padding: 2px 12px; font-size: .88rem; font-weight: 700; color: #475569; }

  .wk-cell { position: relative; background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px 12px 56px; margin-bottom: 12px; line-height: 1.8; }
  .wk-cell.fresh { animation: rowIn .5s ease; }
  .wk-cell.q { background: #F8FAFC; }
  .wk-cell.plain { padding-left: 16px; }
  .wk-cell.final { border-color: var(--accent-2); }
  .wk-cell .stepno { position: absolute; left: 14px; top: 14px; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .wk-cell.q .stepno { background: var(--muted); }
  .wk-eq { font-size: 1.2rem; font-weight: 700; overflow-x: auto; padding: 2px 0; }
  .wk-tags { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 4px; font-size: .92rem; font-weight: 600; color: #475569; }
  .wk-tags span.tg { display: inline-flex; align-items: center; gap: 6px; }

  .lad { max-width: 460px; margin: 10px auto; }
  .lad-op { text-align: center; color: var(--muted); font-weight: 700; font-size: .95rem; margin: 2px 0; animation: rowIn .4s ease; }
  .plegend { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 8px 16px; margin: 10px 0 6px; }
  .plegend > div { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .98rem; }

  .rv { border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rv .rv-q { font-size: 1.2rem; font-weight: 800; min-width: 130px; }
  .rv .rv-steps { font-size: 1.2rem; font-weight: 800; color: var(--primary); display: flex; gap: 12px; flex-wrap: wrap; flex: 1; }
  .rv .rv-steps span { animation: rowIn .4s ease; }
  .rv .rv-steps span.last { color: #047857; }
  .rv button { padding: 5px 14px; font-size: .88rem; }

  @media (max-width: 700px) {
    header h1 { font-size: 1.4rem; }
    header { padding: 34px 16px 16px; }
    .card { padding: 20px 14px; }
    .tab-btn { font-size: .85rem; padding: 8px 10px; }
    .wk-cell { padding-left: 48px; }
    .wg-eq { font-size: 1.15rem; }
  }
/* ── theme:start — สร้างโดย tools/build_lessons.py ห้ามแก้มือ (แก้ที่สคริปต์แล้วรันใหม่) ── */
/* ธีมชุดเดียวกับหน้าสารบัญ (tools/build_index.py · DESIGN.md หมวด Meta-inspired) — สีของเรื่องอยู่ที่ปกและในตัวบทเรียน กรอบหน้าเป็นสีกลาง */
:root{ --page:#C8167A; }
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#ffffff; --card:#ffffff; --panel:#f1f4f7; --raise:#e4e9ee;
  --text:#1c1e21; --muted:#5d6c7b; --dim:#8595a4; --line:#ced0d4; --line-soft:#dee3e9; --border:#ced0d4;
  --ink:#000000; --on-ink:#ffffff; --ink-hover:#2b3138; --link:#0064e0; --strong:#1c1e21; --shadow:none;
  --primary:color-mix(in srgb, var(--page) 86%, #000); --primary-2:color-mix(in srgb, var(--page) 62%, #000);
  --secondary:#C2540A; --secondary-light:#F2A15F; --accent:#68EF3F; --accent-2:#2E9E3F;
  --g-x:#E53935; --g-y:#2E9E4F; --g-z:#3949AB; --g-curve:#F07400; --g-curve-fill:rgba(240,116,0,.12);
  --g-pink:#D81B60; --g-plane:rgba(60,190,200,.28); --g-cone:rgba(153,51,0,.20); --g-cone-line:rgba(153,51,0,.35);
  --g-blue:#1E66D0; --g-red:#D32F2F; --g-green:#2E9E4F; --g-purple:#7B3FC4; --g-orange:#E8710A; --g-teal:#0F8A80;
  --g-ring:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#0a1317; --surface:#0a1317; --card:#0a1317; --panel:#1c1e21; --raise:#2b3138;
  --text:#ffffff; --muted:#9aa8b5; --dim:#6b7884; --line:#444950; --line-soft:#32383e; --border:#444950;

  --primary:#ec79ba; --primary-2:#f19dcc;

  --g-x:#FF6B6B; --g-y:#5BD27E; --g-z:#8C9BFF; --g-curve:#FFA040; --g-curve-fill:rgba(255,160,64,.16);
  --g-pink:#FF5C9A; --g-plane:rgba(90,220,230,.26); --g-cone:rgba(255,170,110,.18); --g-cone-line:rgba(255,170,110,.45);

  --g-ring:#0a1317;
}
html{ background:var(--bg); color-scheme:light; }
html[data-theme="dark"]{ color-scheme:dark; }
body{ font-family:'Anuphan',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; }
:focus-visible{ outline:2px solid var(--link); outline-offset:2px; }

/* หัวหน้า: แผ่นสีอ่อนมุมโค้ง ตัวหนังสือเข้ม + ปกข้างชื่อ (สีของเรื่องอยู่ที่ปก) */
header{
  background:var(--panel); color:var(--text); text-align:left; overflow:hidden;
  display:grid; grid-template-columns:auto 1fr; column-gap:24px; align-items:end;
  margin:8px 8px 0; padding:74px 32px 28px; border-radius:32px; box-shadow:none;
}
header::before, header::after{ display:none !important; }
header > *:not(.lesson-cover):not(.back-link):not(.lang-toggle):not(.theme-toggle){ grid-column:2; }
.lesson-cover{ grid-column:1; grid-row:1 / span 6; align-self:end; width:clamp(96px, 11vw, 136px); aspect-ratio:1; border-radius:16px; overflow:hidden; box-shadow:none; }
.lesson-cover svg{ display:block; width:100%; height:100%; }
header h1{ font-size:clamp(1.9rem, 4.4vw, 3.2rem); font-weight:500; letter-spacing:0; line-height:1.25; margin:0; color:var(--text); }
header p{ font-size:1.02rem; opacity:1; margin:8px 0 0; color:var(--muted); line-height:1.55; }
.back-link{
  position:absolute; top:16px; left:16px; z-index:2; display:inline-flex; align-items:center; gap:6px;
  height:38px; padding:0 16px; border-radius:100px; background:var(--surface); color:var(--text);
  box-shadow:inset 0 0 0 1px var(--line); font-size:.92rem; font-weight:700; opacity:1; text-decoration:none;
}
.back-link:hover{ background:var(--raise); opacity:1; text-decoration:none; }
.lang-toggle, .theme-toggle{
  position:absolute; top:16px; height:38px; border-radius:100px; font-family:inherit; font-weight:700; font-size:.88rem;
  cursor:pointer; z-index:2; transition:transform .12s, background .12s;
}
.lang-toggle{ right:16px; min-width:64px; padding:0 16px; background:var(--ink); color:var(--on-ink); border:1px solid var(--ink); }
.lang-toggle:hover{ background:var(--ink); border-color:var(--ink); transform:scale(1.04); }
.theme-toggle{ right:88px; width:38px; padding:0; display:grid; place-items:center; background:var(--surface); color:var(--text); border:1px solid var(--line); }
.theme-toggle svg{ width:18px; height:18px; }
.theme-toggle:hover{ background:var(--raise); border-color:var(--line); }
body > .lang-toggle, body > .theme-toggle{ position:fixed; top:14px; z-index:50; }
body > .lang-toggle{ right:14px; } body > .theme-toggle{ right:86px; }
header:not(:has(.back-link)):not(:has(.lang-toggle)){ padding-top:28px; }

/* แถบแท็บ: ชิปขอบบาง ตัวที่เลือก = สีหมึก (ดำ / โหมดมืดขาว) */
nav{ background:var(--bg); border-bottom:0; padding:16px 16px 8px; gap:8px; box-shadow:none; }
.tab-btn{
  font-family:inherit; border:0; margin:0; border-radius:100px; padding:8px 18px;
  background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 1px var(--line); font-weight:600; font-size:.95rem;
}
.tab-btn:hover{ background:var(--raise); color:var(--text); }
.tab-btn.active{ background:var(--ink); color:var(--on-ink); box-shadow:none; border-bottom-color:transparent; }

/* การ์ดและกล่อง: พื้นเรียบ ขอบ 1px ไม่มีเงา */
.card{ background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:none; }
.card-title{ color:var(--text); font-size:1.2rem; }
.card-title .icon{ display:none; }
.desc-text{ color:var(--text); font-size:1rem; }
.formula, .step.result, .stats{ background:var(--strong) !important; color:#fff; border-radius:16px; letter-spacing:0; }
.stat .k, .step-tag{ text-transform:none; letter-spacing:0; }

/* ปุ่ม: หลัก = แคปซูลหมึก, รอง = แคปซูลขอบบาง */
.btn-action{ font-family:inherit; background:var(--ink); color:var(--on-ink); border:1px solid var(--ink); border-radius:100px; }
.btn-action:hover:not(:disabled){ background:var(--ink-hover); border-color:var(--ink-hover); }
.btn-action.secondary{ background:transparent; color:var(--text); border:1px solid var(--line); }
.btn-action.secondary:hover:not(:disabled){ background:var(--raise); }
.mode-btn{ font-family:inherit; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:100px; }
.mode-btn:hover{ border-color:var(--text); color:var(--text); }
.mode-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
input[type=range]{ accent-color:var(--primary); }

@media (max-width:600px){
  header{ margin:0; border-radius:0 0 24px 24px; padding:64px 16px 20px; column-gap:14px; }

  header p{ font-size:.95rem; }
  .back-link{ top:14px; left:12px; height:36px; padding:0 14px; max-width:calc(100% - 150px); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; display:block; line-height:36px; }
  .lang-toggle, .theme-toggle{ top:14px; height:36px; }
  .lang-toggle{ right:12px; min-width:58px; padding:0 12px; }

  nav .tab-btn{ flex:0 0 auto; white-space:nowrap; }   /* ชื่อแท็บบรรทัดเดียว ปัดแถบซ้าย-ขวาแทน (ไม่บีบจนตัดคำ) */
  nav::-webkit-scrollbar{ display:none; }
}

<script>
// ══════════════ ภาษาไทย/อังกฤษ (ค่าใน data-th/data-en ถือเป็น HTML — ดู docs/adr/0002) ══════════════
const PAGE_TITLE = { th: "สื่อการสอน : เลขยกกำลัง ม.1", en: "Teaching Aid: Exponents" };
let langMemory = 'th';
function getLang() { try { return localStorage.getItem('siteLang') || 'th'; } catch (e) { return langMemory; } }
function applyLang(lang) {
  document.documentElement.lang = lang;
  document.title = PAGE_TITLE[lang];
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = (lang === 'en' && el.dataset.en) ? el.dataset.en : el.dataset.th; });
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = lang === 'en' ? 'ไทย' : 'EN';
  if (typeof onLangChange === 'function') onLangChange(lang);
}
function toggleLang() {
  const next = getLang() === 'en' ? 'th' : 'en';
  langMemory = next;
  try { localStorage.setItem('siteLang', next); } catch (e) {}
  applyLang(next);
}
function onLangChange() { ALL.forEach(w => w.langRefresh()); }

// ══════════════ ตัวช่วย ══════════════
const EN = () => getLang() === 'en';
const T = (th, en) => ({ th, en });
const tx = v => (v == null ? '' : typeof v === 'string' ? v : v[getLang()]);
const esc = s => s.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
const d = (th, en) => `<span data-th="${esc(th)}" data-en="${esc(en)}">${th}</span>`;
const frac = (n, dd) => `<span class="frac"><span class="num">${n}</span><span class="den">${dd}</span></span>`;
const P = (b, e) => `${b}<sup>${e}</sup>`;
const mn = v => String(v).replace('-', '−');
const rep = (b, c, sep) => Array(c).fill(b).join(sep === undefined ? '×' : sep);
const isNum = b => /^\d+$/.test(String(b));
const gcd = (a, b) => b ? gcd(b, a % b) : a;

// สีประจำสมบัติ ①–⑨ (ใช้ทั้งในแท็บของมันและป้ายในโจทย์ยาก)
const PC = { 1: '#2563EB', 2: '#EA580C', 3: '#9333EA', 4: '#0D9488', 5: '#4D7C0F', 6: '#DB2777', 7: '#64748B', 8: '#A16207', 9: '#0E7490' };
const PN = {
  1: T('คูณฐานเดียวกัน → บวกเลขชี้กำลัง', 'Multiply same base → add exponents'),
  2: T('หารฐานเดียวกัน → ลบเลขชี้กำลัง', 'Divide same base → subtract exponents'),
  3: T('ยกกำลังซ้อน → คูณเลขชี้กำลัง', 'Power of a power → multiply exponents'),
  4: T('a⁰ = 1', 'a⁰ = 1'),
  5: T('a¹ = a', 'a¹ = a'),
  6: T('เลขชี้กำลังลบ → กลับบน–ล่าง', 'Negative exponent → flip top/bottom'),
  7: T('กับดัก: + ไม่รวมเลขชี้กำลัง', 'Trap: + never adds exponents'),
  8: T('กระจายเลขชี้กำลังเข้าวงเล็บ (× ÷ เท่านั้น)', 'Distribute into brackets (× ÷ only)'),
  9: T('ฐานติดลบ: คู่ = +  คี่ = −', 'Negative base: even = +, odd = −')
};
const pb = n => `<span class="pbadge" style="--pc:${PC[n]}">${n}</span>`;
const hl = (n, html) => `<span class="hl" style="background:${PC[n]}26;border-bottom:2px solid ${PC[n]}">${html}</span>`;
const ans = html => `<span class="ans">${html}</span>`;
const card = (icon, title, inner) => `<div class="card"><div class="card-title"><span class="icon">${icon}</span><span>${title}</span></div>${inner}</div>`;

// ══════════════ ตัวแสดงแผ่นฐาน (Stage) ══════════════
// แผ่นทุกชิ้นมี id คงที่ ทุกครั้งที่ set() ถ้า id เดิมตำแหน่งใหม่ CSS จะเลื่อนให้เอง
const W = 680, PITCH = 44;
const tl = (id, x, y, txt, cls, o) => Object.assign({ k: 't', id, x, y, txt, cls }, o || {});
const lb = (id, x, y, html, cls, w, o) => Object.assign({ k: 's', id, x, y, html, cls: cls || '', w: w || 80 }, o || {});
const bx = (id, x, y, w, h, cls, o) => Object.assign({ k: 'x', id, x, y, w, h, cls: cls || 'x-g' }, o || {});
// label กึ่งกลางที่ cx
const lbc = (id, cx, y, html, cls, w, o) => lb(id, cx - (w || 80) / 2, y, html, cls, w, o);

class Stage {
  constructor(host) {
    this.outer = host; host.classList.add('stage-outer');
    this.inner = document.createElement('div'); this.inner.className = 'stage-inner';
    host.appendChild(this.inner);
    this.els = new Map(); this.h = 160;
  }
  fit() {
    const w = this.outer.clientWidth; if (!w) return;
    const s = Math.min(1, w / W);
    this.inner.style.transform = 'scale(' + s + ')';
    this.inner.style.height = this.h + 'px';
    this.outer.style.height = (this.h * s) + 'px';
  }
  place(el, it) {
    const kind = { t: 'st-t', x: 'st-x', s: 'st-s' }[it.k];
    el.className = 'st ' + kind + ' ' + (it.cls || '');
    el.style.left = it.x + 'px'; el.style.top = it.y + 'px';
    if (it.k === 'x') { el.style.width = it.w + 'px'; el.style.height = it.h + 'px'; }
    if (it.k === 's') el.style.width = (it.w || 80) + 'px';
    el.style.opacity = it.op === undefined ? 1 : it.op;
    const html = it.k === 't' ? it.txt : (it.html || '');
    if (el._h !== html) { el.innerHTML = html; el._h = html; }
    if (it.n != null) el.setAttribute('data-n', it.n); else el.removeAttribute('data-n');
  }
  set(items, h) {
    this.h = h; const seen = new Set();
    items.forEach(it => {
      seen.add(it.id);
      let el = this.els.get(it.id);
      if (!el) {
        el = document.createElement('div'); this.inner.appendChild(el); this.els.set(it.id, el);
        const from = it.from || it;
        el.style.transition = 'none';
        this.place(el, Object.assign({}, it, { x: from.x, y: from.y, op: 0 }));
        void el.offsetWidth; el.style.transition = '';
      }
      this.place(el, it);
    });
    [...this.els].forEach(([id, el]) => {
      if (!seen.has(id)) { this.els.delete(id); el.style.opacity = 0; setTimeout(() => el.remove(), 700); }
    });
    this.fit();
  }
}

const ALL = [];
// ══════════════ Widget: พารามิเตอร์ (สไลเดอร์/ชิป) + Stage + ปุ่ม ◀ ▶ ══════════════
function makeWidget(host, cfg) {
  const w = { cfg, p: {}, k: 0 };
  cfg.params.forEach(q => { w.p[q.key] = q.val; });
  host.classList.add('wg');
  host.innerHTML = '<div class="wg-params"></div><div class="wg-stage"></div><div class="wg-eq"></div><div class="wg-cap"></div><div class="wg-res"></div><div class="wg-nav"><button class="btn ghost prev"></button><span class="wg-cnt"></span><button class="btn next"></button></div>';
  const q = s => host.querySelector(s);
  const stage = new Stage(q('.wg-stage'));
  const prev = q('.prev'), next = q('.next'), cnt = q('.wg-cnt');
  const nSteps = () => cfg.nSteps(w.p);

  w.buildParams = () => {
    const box = q('.wg-params'); box.innerHTML = '';
    cfg.params.forEach(pr => {
      if (pr.kind === 'range') {
        const row = document.createElement('label'); row.className = 'slider-row';
        row.innerHTML = `<b>${tx(pr.label)}</b><input type="range" min="${pr.min}" max="${pr.max}" value="${w.p[pr.key]}"><span class="slider-val">${w.p[pr.key]}</span>`;
        const inp = row.querySelector('input'), val = row.querySelector('.slider-val');
        inp.addEventListener('input', () => { w.p[pr.key] = +inp.value; val.textContent = inp.value; w.k = 0; w.render(); });
        box.appendChild(row);
      } else {
        const row = document.createElement('div'); row.className = 'chips';
        row.innerHTML = `<span class="chips-label">${tx(pr.label)}</span>` + pr.opts.map(o => `<button class="chip${String(o[0]) === String(w.p[pr.key]) ? ' active' : ''}" data-v="${o[0]}">${tx(o[1])}</button>`).join('');
        row.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
          const v = pr.opts.find(o => String(o[0]) === c.dataset.v)[0];
          w.p[pr.key] = v; w.k = 0;
          row.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === c));
          w.render();
        }));
        box.appendChild(row);
      }
    });
    prev.textContent = EN() ? '◀ Back' : '◀ ย้อน';
    next.textContent = EN() ? 'Next ▶' : 'ถัดไป ▶';
  };
  w.render = () => {
    const N = nSteps(); if (w.k >= N) w.k = N - 1;
    const r = cfg.build(w.p, w.k);
    stage.set(r.items, r.h);
    q('.wg-eq').innerHTML = r.eq ? '<span>' + r.eq + '</span>' : '';
    q('.wg-cap').innerHTML = tx(r.cap);
    q('.wg-res').innerHTML = r.res || '';
    cnt.textContent = (EN() ? 'Step ' : 'ขั้นที่ ') + (w.k + 1) + ' / ' + N;
    prev.disabled = w.k === 0; next.disabled = w.k >= N - 1;
    if (N <= 1) q('.wg-nav').style.display = 'none';
  };
  w.langRefresh = () => { w.buildParams(); w.render(); };
  w.fit = () => stage.fit();
  prev.addEventListener('click', () => { if (w.k > 0) { w.k--; w.render(); } });
  next.addEventListener('click', () => { if (w.k < nSteps() - 1) { w.k++; w.render(); } });
  w.buildParams(); w.render();
  ALL.push(w);
  return w;
}

// ══════════════ Stepper ข้อความ (บันได / กับดัก / ตัวอย่างการคำนวณ): เผยทีละแถว สะสมเรื่อยๆ ══════════════
function makeSteps(host, getRows) {
  const w = { k: 0, rows: getRows };
  host.classList.add('wg');
  host.innerHTML = '<div class="wk-list"></div><div class="wg-nav"><button class="btn ghost prev"></button><span class="wg-cnt"></span><button class="btn next"></button></div>';
  const list = host.querySelector('.wk-list');
  const prev = host.querySelector('.prev'), next = host.querySelector('.next'), cnt = host.querySelector('.wg-cnt');
  w.render = (fresh) => {
    const rows = w.rows(); if (w.k >= rows.length) w.k = rows.length - 1;
    list.innerHTML = rows.slice(0, w.k + 1).map((r, i) => {
      const isLast = i === rows.length - 1;
      const tags = (r.props || []).map(n => `<span class="tg">${pb(n)} ${tx(PN[n])}</span>`).concat((r.tags || []).map(t => `<span class="ptag">${tx(t)}</span>`)).join('');
      const no = r.q ? '?' : i;
      const plain = !!r.plain;
      return `<div class="wk-cell${r.q ? ' q' : ''}${plain ? ' plain' : ''}${isLast && !r.q && !plain ? ' final' : ''}${i === w.k && fresh ? ' fresh' : ''}">${plain ? '' : `<span class="stepno">${no}</span>`}<div class="wk-eq">${r.html}</div>${tags ? `<div class="wk-tags">${tags}</div>` : ''}${r.note ? `<div class="wk-tags">${tx(r.note)}</div>` : ''}</div>`;
    }).join('');
    cnt.textContent = (EN() ? 'Step ' : 'ขั้นที่ ') + (w.k + 1) + ' / ' + rows.length;
    prev.disabled = w.k === 0; next.disabled = w.k >= rows.length - 1;
    prev.textContent = EN() ? '◀ Back' : '◀ ย้อน';
    next.textContent = EN() ? 'Next ▶' : 'ถัดไป ▶';
  };
  w.reset = () => { w.k = 0; w.render(false); };
  w.langRefresh = () => w.render(false);
  w.fit = () => {};
  prev.addEventListener('click', () => { if (w.k > 0) { w.k--; w.render(false); } });
  next.addEventListener('click', () => { if (w.k < w.rows().length - 1) { w.k++; w.render(true); } });
  w.render(false);
  ALL.push(w);
  return w;
}

function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
  requestAnimationFrame(() => ALL.forEach(w => w.fit()));
}

window.addEventListener('resize', () => { clearTimeout(_rsT); _rsT = setTimeout(() => ALL.forEach(w => w.fit()), 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ALL.forEach(w => w.fit()));

// เลขฐานตัวเลข → ค่าจริง + เศษส่วนย่อ
const nf = (a, b) => { const g = gcd(a, b); return [a / g, b / g]; };
const BASES = [['a', 'a'], ['2', '2'], ['3', '3']];
const BASE_LABEL = T('ฐาน', 'Base');

// ═══════════════════════ แท็บ 1 · ที่มา ═══════════════════════
// (ก) ฮุก: 2 คูณกัน 20 ตัวยาวเกินไป → ต้องมีตัวย่อ
const HOOK = {
  params: [],
  nSteps: () => 2,
  build(p, k) {
    const S = 60, ox = (W - (10 * S - 22)) / 2, it = [];
    for (let i = 0; i < 20; i++) {
      const row = Math.floor(i / 10), col = i % 10;
      it.push(tl('h' + i, k ? (W - 38) / 2 : ox + col * S, k ? 60 : 16 + row * 60, '2', 't-a', { op: k ? 0 : 1 }));
      if (col < 9) it.push(lb('hx' + i, ox + col * S + 38, (k ? 60 : 16 + row * 60) + 8, '×', 'l-mut', 22, { op: k ? 0 : 1 }));
    }
    it.push(lbc('big', W / 2, 24, P('2', 20), 'l-big', 260, { op: k ? 1 : 0 }));
    it.push(lbc('t1', W / 2 - 22, 104, tx(T('↑ ฐาน<br>(ตัวที่ถูกคูณซ้ำ)', '↑ Base<br>(the repeated factor)')), 'l-mut', 150, { op: k ? 1 : 0 }));
    it.push(lbc('t2', W / 2 + 96, 6, tx(T('เลขชี้กำลัง = 20 ↙<br>(คูณกันกี่ตัว)', 'Exponent = 20 ↙<br>(how many factors)')), 'l-mut', 170, { op: k ? 1 : 0 }));
    return {
      items: it, h: 150,
      eq: `2 × 2 × 2 × … × 2 <span class="l-mut" style="font-size:1rem">${EN() ? '(20 twos)' : '(2 จำนวน 20 ตัว)'}</span>${k ? ` = ${P(2, 20)}` : ''}`,
      cap: k ? T('ตัวย่อ: เขียน 2 ครั้งเดียว แล้วเขียนเลขเล็กๆ ข้างบนบอกว่าคูณกันกี่ตัว', 'Shorthand: write 2 once, with a small number on top for how many are multiplied.')
             : T('อยากเขียน 2 คูณกัน 20 ตัว ยาวเกินจอ และนับพลาดง่ายมาก… ต้องมีตัวย่อ', 'Writing 2 multiplied 20 times is too long and easy to miscount… we need a shorthand.')
    };
  }
};

// (ข) แผ่นฐาน: aⁿ = แผ่น n แผ่นเรียงแถว
const TILES = {
  params: [
    { key: 'base', kind: 'chips', val: 'a', opts: BASES, label: BASE_LABEL },
    { key: 'n', kind: 'range', min: 1, max: 8, val: 5, label: 'n' }
  ],
  nSteps: () => 1,
  build(p) {
    const { base, n } = p, S = 60, ox = (W - (n * S - 22)) / 2, y = 30, it = [];
    for (let i = 0; i < n; i++) it.push(tl('t' + i, ox + i * S, y, base, 't-a'));
    for (let i = 0; i < n - 1; i++) it.push(lb('x' + i, ox + i * S + 38, y + 8, '×', 'l-mut', 22));
    it.push(bx('br', ox, y + 52, n * S - 22, 3, 'x-line'));
    it.push(lbc('bl', W / 2, y + 62, `${n} ${EN() ? 'tiles' : 'แผ่น'}`, 'l-mut', 260));
    const v = isNum(base) ? Math.pow(+base, n) : null;
    return {
      items: it, h: 130,
      eq: `${P(base, n)} = ${n === 1 ? base : rep(base, n)}${v ? ` = ${v}` : ''}`,
      cap: T('เลขชี้กำลัง n = จำนวนแผ่นฐาน (จำนวนตัวที่คูณกัน) — เลื่อน n ดูว่าแผ่นเพิ่มขึ้นทีละแผ่น', 'The exponent n = the number of base tiles (how many factors). Slide n and watch tiles appear one by one.')
    };
  }
};

// ═══════════════════════ แท็บ 2 · คูณ / หาร ═══════════════════════
// ① aᵐ · aⁿ = aᵐ⁺ⁿ
const MUL = {
  params: [
    { key: 'base', kind: 'chips', val: 'a', opts: BASES, label: BASE_LABEL },
    { key: 'm', kind: 'range', min: 1, max: 6, val: 3, label: 'm' },
    { key: 'n', kind: 'range', min: 1, max: 6, val: 2, label: 'n' }
  ],
  nSteps: () => 3,
  build(p, k) {
    const { base, m, n } = p, gap = k === 0 ? 60 : 0, y = 34;
    const ox = (W - ((m + n) * PITCH - 6 + gap)) / 2, g1w = m * PITCH - 6, g2x = ox + m * PITCH + gap, g2w = n * PITCH - 6;
    const it = [];
    for (let i = 0; i < m; i++) it.push(tl('a' + i, ox + i * PITCH, y, base, 't-a', { n: k === 2 ? i + 1 : null }));
    for (let j = 0; j < n; j++) it.push(tl('b' + j, g2x + j * PITCH, y, base, 't-b', { n: k === 2 ? m + j + 1 : null }));
    it.push(lb('op', ox + g1w + gap / 2 - 15, y + 6, '×', '', 30, { op: k === 0 ? 1 : 0 }));
    it.push(bx('bx1', ox - 6, y - 6, g1w + 12, 50, 'x-g', { op: k === 0 ? 1 : 0 }));
    it.push(bx('bx2', g2x - 6, y - 6, g2w + 12, 50, 'x-g', { op: k === 0 ? 1 : 0 }));
    it.push(bx('bxa', ox - 8, y - 8, (m + n) * PITCH - 6 + 16, k === 2 ? 76 : 54, 'x-p1', { op: k >= 1 ? 1 : 0 }));
    it.push(lbc('l1', k === 0 ? ox + g1w / 2 : W / 2, k === 2 ? 116 : 102, k === 0 ? P(base, m) : k === 1 ? P(base, `${m}+${n}`) : `${m} + ${n} = ${m + n} ${EN() ? 'tiles' : 'แผ่น'}`, 'l-mut', 260));
    it.push(lbc('l2', g2x + g2w / 2, 102, P(base, n), 'l-mut', 120, { op: k === 0 ? 1 : 0 }));
    const eqs = [
      `${P(base, m)} × ${P(base, n)}`,
      `${P(base, m)} × ${P(base, n)} = (${rep(base, m)}) × (${rep(base, n)})`,
      `${P(base, m)} × ${P(base, n)} = ${P(base, `${m}+${n}`)} = ${P(base, m + n)}`
    ];
    let res = '';
    if (k === 2 && isNum(base)) res = `${pb(1)} ${P(base, m)} × ${P(base, n)} = ${Math.pow(+base, m)} × ${Math.pow(+base, n)} = ${Math.pow(+base, m + n)} = ${P(base, m + n)} ✓`;
    else if (k === 2) res = `${pb(1)} ${tx(PN[1])}`;
    return {
      items: it, h: 150, eq: eqs[k], res,
      cap: [
        T('สองก้อน: แผ่น m แผ่น กับแผ่น n แผ่น คั่นด้วย × — ฐานเหมือนกัน แผ่นจึงหน้าตาเหมือนกัน', 'Two blocks: m tiles and n tiles joined by × — same base, so the tiles look alike.'),
        T('× แปลว่าแค่ต่อแถวกัน — ดันสองก้อนชนกันเป็นแถวเดียว (สีฟ้า/ส้มยังบอกว่าแผ่นมาจากก้อนไหน)', '× just means “put them in one line” — push both blocks together into one row (blue/orange still show where each tile came from).'),
        T('นับแผ่นทั้งแถว ได้ m + n แผ่น — เลขชี้กำลังมาบวกกันเพราะเรานับแผ่นสองก้อนรวมกัน', 'Count the whole row: m + n tiles — exponents add because we are counting the tiles of both blocks together.')
      ][k]
    };
  }
};

// ② ④ ⑥ หารฐานเดียวกัน: จับคู่บน-ล่างตัดกัน
const DIV = {
  params: [
    { key: 'base', kind: 'chips', val: 'a', opts: BASES, label: BASE_LABEL },
    { key: 'm', kind: 'range', min: 1, max: 6, val: 5, label: T('m (บน)', 'm (top)') },
    { key: 'n', kind: 'range', min: 1, max: 6, val: 2, label: T('n (ล่าง)', 'n (bottom)') }
  ],
  nSteps: () => 3,
  build(p, k) {
    const { base, m, n } = p, c = Math.min(m, n), remT = m - c, remB = n - c, mx = Math.max(m, n);
    const ox = (W - mx * PITCH) / 2, ox2 = (W - Math.max(remT, remB, 1) * PITCH) / 2;
    const yT = 14, yL = 62, yB = 74, it = [];
    for (let i = 0; i < m; i++) {
      const paired = i < c;
      it.push(tl('T' + i, k === 2 ? (paired ? ox + i * PITCH : ox2 + (i - c) * PITCH) : ox + i * PITCH, yT, base, 't-a' + (k === 1 && paired ? ' t-pair' : ''), { op: k === 2 && paired ? 0 : 1 }));
    }
    for (let i = 0; i < n; i++) {
      const paired = i < c;
      it.push(tl('B' + i, k === 2 ? (paired ? ox + i * PITCH : ox2 + (i - c) * PITCH) : ox + i * PITCH, yB, base, 't-b' + (k === 1 && paired ? ' t-pair' : ''), { op: k === 2 && paired ? 0 : 1 }));
    }
    const lw = (k === 2 ? Math.max(remT, remB, 1) : mx) * PITCH - 6 + 16, lx = (k === 2 ? ox2 : ox) - 8;
    it.push(bx('line', lx, yL, lw, 3, 'x-line'));
    it.push(lbc('oneT', ox2 + Math.max(remT, remB, 1) * PITCH / 2 - 3, yT + 6, '1', '', 38, { op: k === 2 && remT === 0 ? 1 : 0 }));
    it.push(lbc('oneB', ox2 + Math.max(remT, remB, 1) * PITCH / 2 - 3, yB + 6, '1', '', 38, { op: k === 2 && remB === 0 ? 1 : 0 }));
    const fr0 = frac(P(base, m), P(base, n));
    let eq, cap, res = '', prop = m > n ? 2 : m === n ? 4 : 6;
    if (k === 0) {
      eq = fr0;
      cap = T('การหารคือเศษส่วน: แผ่นก้อนแรกอยู่บน ก้อนที่สองอยู่ล่าง — ลองเลื่อน m, n ให้ m > n, m = n และ m < n', 'Division is a fraction: first block on top, second below. Try m > n, m = n and m < n.');
    } else if (k === 1) {
      eq = fr0;
      cap = T(`จับคู่แผ่นบน–ล่างที่อยู่คอลัมน์เดียวกัน ได้ ${c} คู่ (= ตัวที่น้อยกว่าระหว่าง m กับ n) — คู่หนึ่ง = ตัวเองหารตัวเอง = 1`, `Pair up the top and bottom tiles in the same column: ${c} pair(s) (the smaller of m and n). Each pair is a number divided by itself = 1.`);
    } else {
      const same = P(base, `${m}−${n}`);
      if (prop === 2) {
        eq = `${fr0} = ${same} = ${P(base, m - n)}`;
        cap = T(`ตัดคู่ออกหมด เหลือแผ่นบน ${m - n} แผ่น ล่างว่าง (= 1) จึงได้ ${m} − ${n} = ${m - n} แผ่น`, `All pairs cancel; ${m - n} tile(s) stay on top and the bottom is empty (= 1), so ${m} − ${n} = ${m - n}.`);
      } else if (prop === 4) {
        eq = `${fr0} = ${same} = ${P(base, 0)} = 1`;
        cap = T('ตัดกันหมดทั้งบนและล่าง — เหลือ 1 ไม่ใช่ 0! (หารตัวเองได้ 1) จึงได้ a⁰ = 1', 'Everything cancels — what is left is 1, not 0! (something divided by itself is 1), so a⁰ = 1.');
      } else {
        eq = `${fr0} = ${same} = ${P(base, mn(m - n))} = ${frac(1, P(base, n - m))}`;
        cap = T(`บนหมดก่อน เหลือแผ่นล่าง ${n - m} แผ่น อยู่ใต้ 1 → ได้ 1 ส่วน ${n - m} แผ่น ส่วนสูตรให้ ${m} − ${n} = −${n - m} จึงได้ a⁻ᵏ = 1/aᵏ`, `The top runs out first; ${n - m} tile(s) remain below 1 → 1 over ${n - m} tiles. The formula gives ${m} − ${n} = −${n - m}, so a⁻ᵏ = 1/aᵏ.`);
      }
      let num = '';
      if (isNum(base)) {
        const a = Math.pow(+base, m), b = Math.pow(+base, n), [r1, r2] = nf(a, b);
        num = ` &nbsp; <span style="color:var(--muted)">${frac(a, b)} = ${r2 === 1 ? r1 : frac(r1, r2)}</span>`;
      }
      res = `${pb(prop)} ${tx(PN[prop])}${num}`;
    }
    return { items: it, h: 130, eq, cap, res };
  }
};

// บันได: ลดเลขชี้กำลังทีละ 1 = หารด้วย 2 ทุกครั้ง → เห็น ④ และ ⑥
const LADDER = [
  { e: 3, v: '8' }, { e: 2, v: '4' }, { e: 1, v: '2' }, { e: 0, v: '1', p: 4 },
  { e: -1, v: frac(1, 2), p: 6 }, { e: -2, v: frac(1, 4), p: 6 }
];
const ladderRows = () => LADDER.map((r, i) => ({
  plain: true, html: `${i ? `<div class="lad-op">↓ ${EN() ? 'divide by' : 'หารด้วย'} 2</div>` : ''}<div style="text-align:center;font-size:1.5rem">${P(2, mn(r.e))} = ${r.v} ${r.p ? pb(r.p) : ''}</div>`
}));

// ═══════════════════════ แท็บ 3 · ยกกำลังซ้อน & กระจาย ═══════════════════════
// ③ (aᵐ)ⁿ = aᵐ×ⁿ : ก๊อปกล่อง m แผ่น ไป n กล่อง
const POW = {
  params: [
    { key: 'base', kind: 'chips', val: 'a', opts: BASES, label: BASE_LABEL },
    { key: 'm', kind: 'range', min: 1, max: 6, val: 3, label: 'm' },
    { key: 'n', kind: 'range', min: 1, max: 6, val: 3, label: 'n' }
  ],
  nSteps: () => 3,
  build(p, k) {
    const { base, m, n } = p, RH = 58, y0 = 22, ox = (W - m * PITCH) / 2 + 10, it = [];
    for (let r = 0; r < n; r++) {
      const y = y0 + (k === 0 ? 0 : r * RH), vis = !(k === 0 && r > 0);
      for (let i = 0; i < m; i++) it.push(tl(`p${r}_${i}`, ox + i * PITCH, y, base, 't-a', { op: vis ? 1 : 0, n: k === 2 ? r * m + i + 1 : null }));
      it.push(bx('bx' + r, ox - 6, y - 6, m * PITCH + 6, 50, 'x-p1', { op: vis && k < 2 ? 1 : 0 }));
      it.push(lb('rl' + r, ox + m * PITCH + 14, y + 8, P(base, m), 'l-mut', 90, { op: vis && k < 2 ? 1 : 0 }));
      if (r > 0) it.push(lb('mul' + r, ox - 36, y + 8, '×', '', 26, { op: k === 1 ? 1 : 0 }));
    }
    it.push(lb('tot', ox + m * PITCH + 14, y0 + (n - 1) * RH / 2 + 8, `${EN() ? 'Total' : 'รวม'}<br>${m} × ${n} = ${m * n} ${EN() ? 'tiles' : 'แผ่น'}`, '', 150, { op: k === 2 ? 1 : 0 }));
    const box = P(base, m);
    return {
      items: it, h: y0 + n * RH + 12,
      eq: [
        `(${box})<sup>${n}</sup>`,
        `(${box})<sup>${n}</sup> = ${rep(box, n, ' × ')}`,
        `(${box})<sup>${n}</sup> = ${P(base, rep(m, n, '+'))} = ${P(base, `${m}×${n}`)} = ${P(base, m * n)}`
      ][k],
      cap: [
        T(`กล่องเดียว: ${P(base, m)} คือแผ่น ${m} แผ่น — วงเล็บ (…)ⁿ หมายถึงเอากล่องนี้ไปคูณตัวเอง n รอบ`, 'One box: a block of m tiles. The (…)ⁿ means multiply this whole box by itself n times.'),
        T(`ก๊อปกล่องมา ${n} กล่อง คูณกัน — ยังเห็นเป็นกล่อง ${m} แผ่นเรียงซ้อน ${n} ชั้น`, `Copy the box ${n} times and multiply them — n stacked boxes of m tiles each.`),
        T(`เอากรอบออก แล้วนับ: ${m} แผ่น × ${n} แถว = ${m * n} แผ่น (ก็คือบวก ${m} ซ้ำ ${n} ครั้ง — ใช้ ① ซ้ำ)`, `Remove the frames and count: m tiles × n rows = ${m * n} tiles (adding m, n times — property ① repeated).`)
      ][k],
      res: k === 2 ? `${pb(3)} ${tx(PN[3])}` : ''
    };
  }
};

// ⑧ (ab)ⁿ = aⁿbⁿ  และ (a/b)ⁿ = aⁿ/bⁿ
const DIST = {
  params: [
    { key: 'form', kind: 'chips', val: 'mul', opts: [['mul', '(a × b)ⁿ'], ['div', '(a ÷ b)ⁿ']], label: T('รูป', 'Form') },
    { key: 'vals', kind: 'chips', val: 'ab', opts: [['ab', 'a , b'], ['32', '3 , 2']], label: T('ค่า', 'Values') },
    { key: 'n', kind: 'range', min: 1, max: 5, val: 3, label: 'n' }
  ],
  nSteps: () => 3,
  build(p, k) {
    const A = p.vals === 'ab' ? 'a' : '3', B = p.vals === 'ab' ? 'b' : '2', n = p.n, it = [];
    const isMul = p.form === 'mul';
    if (isMul) {
      const cw = 2 * PITCH - 6 + 12, gap = 34, tot = n * cw + (n - 1) * gap, ox = (W - tot) / 2;
      const tox = (W - (n * PITCH - 6)) / 2;
      for (let i = 0; i < n; i++) {
        const cx = ox + i * (cw + gap) + 6;
        it.push(tl('A' + i, k === 0 ? cx : tox + i * PITCH, k === 0 ? 30 : 16, A, 't-a', { n: k === 2 ? i + 1 : null }));
        it.push(tl('B' + i, k === 0 ? cx + PITCH : tox + i * PITCH, k === 0 ? 30 : 116, B, 't-b', { n: k === 2 ? i + 1 : null }));
        it.push(bx('bx' + i, ox + i * (cw + gap), 24, cw, 50, 'x-g', { op: k === 0 ? 1 : 0 }));
        if (i < n - 1) it.push(lb('op' + i, ox + i * (cw + gap) + cw + gap / 2 - 13, 36, '×', '', 26, { op: k === 0 ? 1 : 0 }));
      }
      it.push(lbc('mid', W / 2, 84, '×', '', 30, { op: k >= 1 ? 1 : 0 }));
      it.push(bx('rowA', tox - 8, 8, n * PITCH - 6 + 16, 72, 'x-p1', { op: k >= 1 ? 1 : 0 }));
      it.push(bx('rowB', tox - 8, 108, n * PITCH - 6 + 16, 72, 'x-g', { op: k >= 1 ? 1 : 0 }));
      it.push(lb('lA', tox + n * PITCH + 14, 26, P(A, n), 'l-mut', 80, { op: k >= 1 ? 1 : 0 }));
      it.push(lb('lB', tox + n * PITCH + 14, 126, P(B, n), 'l-mut', 80, { op: k >= 1 ? 1 : 0 }));
    } else {
      const gap = 44, S = PITCH + gap, tot = n * S - gap, ox = (W - tot) / 2 + 0, tox = (W - (n * PITCH - 6)) / 2;
      for (let i = 0; i < n; i++) {
        it.push(tl('A' + i, k === 0 ? ox + i * S : tox + i * PITCH, 16, A, 't-a', { n: null }));
        it.push(tl('B' + i, k === 0 ? ox + i * S : tox + i * PITCH, 76, B, 't-b', { n: null }));
        it.push(bx('fl' + i, k === 0 ? ox + i * S - 4 : tox - 4, 62, k === 0 ? 46 : n * PITCH - 6 + 8, 3, 'x-line', { op: k === 0 || i === 0 ? 1 : 0 }));
        if (i < n - 1) it.push(lb('op' + i, ox + i * S + PITCH + (gap - 26) / 2 - 2, 38, '×', '', 26, { op: k === 0 ? 1 : 0 }));
      }
      it.push(lb('lA', tox + n * PITCH + 14, 26, P(A, n), 'l-mut', 80, { op: k >= 1 ? 1 : 0 }));
      it.push(lb('lB', tox + n * PITCH + 14, 86, P(B, n), 'l-mut', 80, { op: k >= 1 ? 1 : 0 }));
    }
    const unit = isMul ? `(${A} × ${B})` : `(${frac(A, B)})`;
    const eq = [
      isMul ? `(${A} × ${B})<sup>${n}</sup>` : `(${frac(A, B)})<sup>${n}</sup>`,
      `${isMul ? `(${A} × ${B})` : `(${frac(A, B)})`}<sup>${n}</sup> = ${rep(unit, n, ' × ')}`,
      `${isMul ? `(${A} × ${B})` : `(${frac(A, B)})`}<sup>${n}</sup> = ${isMul ? `${P(A, n)} × ${P(B, n)}` : frac(P(A, n), P(B, n))}`
    ][k];
    let res = '';
    if (k === 2) {
      res = `${pb(8)} ${tx(PN[8])}`;
      if (p.vals === '32') {
        const a = Math.pow(3, n), b = Math.pow(2, n);
        res += isMul ? `<br><span style="color:var(--muted)">${P('(3×2)', n)} = ${P(6, n)} = ${Math.pow(6, n)} &nbsp;|&nbsp; ${P(3, n)} × ${P(2, n)} = ${a} × ${b} = ${a * b} ✓</span>`
                     : `<br><span style="color:var(--muted)">${P(`(${frac(3, 2)})`, n)} = ${frac(a, b)} ✓</span>`;
      }
    }
    return {
      items: it, h: isMul ? (k === 0 ? 120 : 190) : 130, eq, res,
      cap: [
        T(isMul ? `${n} กล่อง กล่องละ 1 คู่ (a กับ b) คูณกัน` : `${n} ก้อนเศษส่วน (a อยู่บน b อยู่ล่าง) คูณกัน`, isMul ? `${n} boxes of one (a, b) pair, multiplied together.` : `${n} fractions (a on top, b below), multiplied together.`),
        T(isMul ? 'คูณกันหมด สลับที่ได้ — แผ่น a ทุกตัวไปรวมแถวบน แผ่น b ทุกตัวไปรวมแถวล่าง' : 'คูณกัน: ตัวเศษทุกตัวไปรวมกันข้างบน ตัวส่วนทุกตัวไปรวมกันข้างล่าง', isMul ? 'It is all multiplication, so order does not matter — every a goes to the top row, every b to the bottom row.' : 'Multiplying fractions: all numerators gather on top, all denominators below.'),
        T(`นับ: a มี ${n} แผ่น b มี ${n} แผ่น → เลขชี้กำลังเท่ากันติดไปทั้งคู่ (ใช้ได้เพราะในวงเล็บเป็น × หรือ ÷ เท่านั้น ถ้าเป็น + ไม่ได้ ดูแท็บกับดัก)`, `Count: ${n} a-tiles and ${n} b-tiles → the exponent goes to both (this works because the bracket holds only × or ÷ — with + it fails, see the Traps tab).`)
      ][k]
    };
  }
};

// ═══════════════════════ แท็บ 4 · ฐานติดลบ ═══════════════════════
const NEG = {
  params: [
    { key: 'base', kind: 'chips', val: '−3', opts: [['−3', '(−3)'], ['−2', '(−2)'], ['−a', '(−a)']], label: BASE_LABEL },
    { key: 'n', kind: 'range', min: 1, max: 6, val: 5, label: 'n' }
  ],
  nSteps: () => 4,
  build(p, k) {
    const { base, n } = p, sym = base === '−a', mag = base.slice(1), pairs = Math.floor(n / 2), left = n % 2, cnt = pairs + left, S = 52, y = 38;
    const pairVal = sym ? P('a', 2) : String(mag * mag);
    const finPos = n % 2 === 0;
    const finTxt = sym ? (finPos ? '' : '−') + (n === 1 ? 'a' : P('a', n)) : mn((finPos ? 1 : -1) * Math.pow(+mag, n));
    const ox0 = (W - (n * S - 14)) / 2, ox2 = (W - (cnt * S - 14)) / 2, cxb = (W - 78) / 2, it = [];
    for (let i = 0; i < n; i++) {
      let x = ox0 + i * S, txt = base, cls = 't-neg', op = 1;
      if (k === 1 && i < 2 * pairs) cls += ' t-pair';
      if (k >= 2) {
        if (i < 2 * pairs) { x = ox2 + Math.floor(i / 2) * S; txt = pairVal; cls = 't-pos'; if (i % 2) op = 0; }
        else x = ox2 + pairs * S;
      }
      if (k === 3) { if (i === 0) { x = cxb; txt = finTxt; cls = (finPos ? 't-pos' : 't-neg') + ' t-big'; } else { x = cxb + 20; op = 0; } }
      it.push(tl('n' + i, x, y, txt, cls, { op }));
    }
    for (let i = 0; i < n - 1; i++) {
      const x = k < 2 ? ox0 + i * S + 38 : ox2 + i * S + 38;
      it.push(lb('x' + i, x, y + 9, '×', 'l-mut', 14, { op: (k < 2 || (k === 2 && i < cnt - 1)) ? 1 : 0 }));
    }
    const bs = `(${base})`;
    const eq = [
      `${bs}<sup>${n}</sup>`,
      `${bs}<sup>${n}</sup> = ${rep(bs, n, '')}`,
      `${bs}<sup>${n}</sup> = ${pairs ? rep(pairVal, pairs, ' × ') : ''}${pairs && left ? ' × ' : ''}${left ? bs : ''}`,
      `${bs}<sup>${n}</sup> = ${finTxt}`
    ][k];
    const cap = [
      T(`${bs}ⁿ คือเอา ${bs} มาคูณกัน n ตัว — ตอนนี้ n = ${n} แผ่นสีแดง (แดง = ติดลบ)`, `${bs}ⁿ means ${bs} multiplied n times — here n = ${n} red tiles (red = negative).`),
      T(pairs ? `จับคู่ติดกัน: (−) × (−) = (+) ได้ ${pairs} คู่` : 'n = 1 มีแผ่นเดียว ไม่มีคู่ให้จับ', pairs ? `Pair neighbours: (−) × (−) = (+) — ${pairs} pair(s).` : 'n = 1: only one tile, nothing to pair.'),
      T(`แต่ละคู่กลายเป็นค่าบวก (สีเขียว)${left ? ' แต่ยังเหลือแผ่นแดง 1 แผ่นที่ไม่มีคู่' : ' และไม่เหลือแผ่นแดงเลย'}`, `Every pair becomes positive (green)${left ? ', but one red tile is left without a partner.' : ' and no red tile is left.'}`),
      T(finPos ? `n = ${n} เป็นเลขคู่ → จับคู่ครบทุกแผ่น → ผลเป็น บวก` : `n = ${n} เป็นเลขคี่ → เหลือแผ่นลบ 1 แผ่นเสมอ → ผลเป็น ลบ`, finPos ? `n = ${n} is even → everything pairs up → the result is positive.` : `n = ${n} is odd → one negative tile is always left → the result is negative.`)
    ][k];
    return { items: it, h: 108, eq, cap, res: k === 3 ? `${pb(9)} ${tx(PN[9])}` : '' };
  }
};

// −5ⁿ  เทียบกับ  (−5)ⁿ : เลขชี้กำลังจับแค่ตัวที่ติดมัน
const CMP = {
  params: [{ key: 'n', kind: 'chips', val: 2, opts: [[2, '2'], [3, '3'], [4, '4']], label: T('เลขชี้กำลัง n', 'Exponent n') }],
  nSteps: () => 4,
  build(p, k) {
    const n = p.n, y = 46, tot = n * PITCH - 6, ox = (W - tot) / 2 + 22, val = Math.pow(5, n), posFin = n % 2 === 0, it = [];
    const cx1 = (W - 78) / 2 + 22, single = k === 1 || k === 3;
    for (let i = 0; i < n; i++) {
      let x = single ? cx1 : ox + i * PITCH, txt = k >= 2 ? '−5' : '5', cls = k >= 2 ? 't-neg' : 't-a', op = 1;
      if (single) { if (i === 0) { txt = k === 1 ? String(val) : mn(posFin ? val : -val); cls = (k === 1 ? 't-a' : posFin ? 't-pos' : 't-neg') + ' t-big'; } else op = 0; }
      it.push(tl('q' + i, x, y, txt, cls, { op }));
    }
    it.push(lbc('mnus', (single ? cx1 : ox) - 40, y - 4, '−', 'l-neg', 40, { op: k < 2 ? 1 : 0 }));
    it.push(bx('bx', single ? cx1 - 8 : ox - 8, y - 8, single ? 78 + 16 : tot + 16, 54, k >= 2 ? 'x-g' : 'x-p1'));
    it.push(lbc('lp', ox - 26, y - 14, '(', 'l-paren', 24, { op: k >= 2 && !single ? 1 : 0 }));
    it.push(lbc('rp', ox + tot + 26, y - 14, ')', 'l-paren', 24, { op: k >= 2 && !single ? 1 : 0 }));
    it.push(lbc('lbl', W / 2, 116, k < 2 ? tx(T('เลขชี้กำลังคลุมแค่ 5 (ลบอยู่นอกกรอบ)', 'The exponent covers only 5 (the minus is outside the frame)')) : tx(T('วงเล็บทำให้ −5 เป็นแผ่นเดียวกัน — ลบอยู่ในกรอบ', 'The bracket makes −5 one tile — the minus is inside')), 'l-mut', 460));
    const eq = [
      `−5<sup>${n}</sup>`,
      `−5<sup>${n}</sup> = −(${rep('5', n)}) = −${val}`,
      `(−5)<sup>${n}</sup> = ${rep('(−5)', n, '')}`,
      `(−5)<sup>${n}</sup> = ${mn(posFin ? val : -val)}`
    ][k];
    const cap = [
      T(`${'−5'}ⁿ: เลขชี้กำลังจับแค่ตัวที่ติดมัน คือ 5 เท่านั้น — เครื่องหมายลบอยู่นอก เหมือน −(5ⁿ)`, 'The exponent grabs only the number stuck to it — the 5. The minus is outside, like −(5ⁿ).'),
      T(`คำนวณ 5ⁿ ก่อน = ${val} แล้วค่อยใส่ลบข้างนอก → −${val}`, `Work out 5ⁿ first = ${val}, then put the minus outside → −${val}.`),
      T('ใส่วงเล็บ (−5)ⁿ: ตอนนี้ −5 เป็นแผ่นเดียว (สีแดง) เลขชี้กำลังจึงยกทั้ง −5', 'With brackets, (−5)ⁿ: −5 is now one red tile, so the exponent raises the whole −5.'),
      T(posFin ? `n = ${n} เป็นเลขคู่ → ผลบวก ${val} — ต่างจาก −5ⁿ = −${val} คนละคำตอบ` : `n = ${n} เป็นเลขคี่ → ผลลบ ${mn(-val)} ซึ่งบังเอิญเท่ากับ −5ⁿ แต่เหตุผลต่างกัน (ลบข้างนอก vs ลบสามตัวเหลือหนึ่ง)`, posFin ? `n = ${n} is even → +${val} — different from −5ⁿ = −${val}.` : `n = ${n} is odd → ${mn(-val)}, which happens to equal −5ⁿ, but for a different reason (minus outside vs three minuses leaving one).`)
    ][k];
    return { items: it, h: 140, eq, cap };
  }
};

  ['−a<sup>6</sup>', ['= −(a·a·a·a·a·a)', '= −a<sup>6</sup> ' + d('(ลบอยู่นอก ไม่ถูกยกกำลัง)', '(the minus stays outside)')]]
];
function initReveal(host) {
  host.innerHTML = REVEAL.map((r, i) => `<div class="rv" data-i="${i}"><span class="rv-q">${r[0]}</span><span class="rv-steps"></span><button class="btn ghost"></button></div>`).join('');
  const label = b => { b.textContent = EN() ? 'Show next ▶' : 'ดูขั้นถัดไป ▶'; };

}

// ═══════════════════════ แท็บ 5 · กับดัก ═══════════════════════
// ⑦ a + a + a³ ≠ a⁵ : เครื่องหมาย + ไม่ต่อแถวแผ่น ได้แค่ดึงตัวร่วม
const TRAP7 = {
  params: [],
  nSteps: () => 3,
  build(p, k) {
    const y = 34, gap = 44, tot = 38 + gap + 38 + gap + 3 * PITCH - 6, ox = (W - tot) / 2;

    it.push(tl('t3b', at(x3 + PITCH, x0 + 186), y, 'a', 't-a'));
    it.push(tl('t3c', at(x3 + 2 * PITCH, x0 + 230), y, 'a', 't-a'));

      + `<button type="button" class="pen-btn" data-t="hl" data-l="hl">${ICON.hl}</button>`
      + `<button type="button" class="pen-btn" data-t="eraser" data-l="eraser">${ICON.eraser}</button>`
      + `<button type="button" class="pen-btn" data-a="undo" data-l="undo">${ICON.undo}</button>`
      + `<button type="button" class="pen-btn" data-a="clear" data-l="clear">${ICON.clear}</button>`
