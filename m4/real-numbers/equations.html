(function () {
  var orig = window.addEventListener, pending = [], fired = false;
  window.addEventListener = function (type, fn, opts) {
    if (type !== 'load') return orig.call(this, type, fn, opts);
    if (fired) setTimeout(fn, 0); else pending.push(fn);
  };
  function fire() {
    if (fired) return;
    fired = true;
    pending.forEach(function (fn) { try { fn.call(window, new Event('load')); } catch (e) { console.error(e); } });
    pending = [];
  }
  orig.call(window, 'load', fire);
  (function poll() { if (document.readyState === 'complete') setTimeout(fire, 0); else setTimeout(poll, 30); })();
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สื่อการสอน : การแก้สมการ ม.4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap');

  :root {
    --primary: #1C3B22; --secondary: #FF8A3D; --accent: #68EF3F; --accent-2: #3FA82E; --warning: #FFB347;
    --bg: #F3F7EC; --card: #FFFFFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(28,59,34,0.10); --radius: 16px;
    --pos: #047857; --pos-bg: #ECFDF5; --neg: #BE185D; --neg-bg: #FFF4EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Anuphan', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: linear-gradient(135deg, #1C3B22 0%, #2E5936 100%); color: white; padding: 28px 40px 20px; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: rgba(255,255,255,0.07); border-radius: 50%; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: .5px; }
  header p { font-size: 1rem; opacity: .85; margin-top: 4px; }
  .back-link { position: absolute; top: 14px; left: 20px; color: white; text-decoration: none; font-size: .85rem; font-weight: 600; opacity: .9; z-index: 2; }
  .back-link:hover { opacity: 1; text-decoration: underline; }
  .lang-toggle { position: absolute; top: 14px; right: 20px; background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.5); border-radius: 20px; padding: 5px 14px; font-family: 'Anuphan', sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; z-index: 2; }
  .lang-toggle:hover { background: rgba(255,255,255,.28); }

  nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 20px 24px 0; background: white; border-bottom: 3px solid var(--border); }
  .tab-btn { padding: 10px 18px; border: none; background: transparent; border-radius: 10px 10px 0 0; font-family: 'Anuphan', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .25s; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab-btn:hover { color: var(--primary); background: #E3F3D8; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #E3F3D8; }

  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
  .tab-panel { display: none; animation: fadeIn .35s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; margin-bottom: 24px; }
  .card-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .card-title .icon { font-size: 1.5rem; }
  .intro { font-size: 1.02rem; line-height: 1.8; margin-bottom: 14px; }
  .box-info { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-warn { background: #FFF7ED; border-left: 4px solid var(--warning); border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .box-ok   { background: #ECFDF5; border-left: 4px solid var(--accent);  border-radius: 10px; padding: 14px 18px; margin: 14px 0; line-height: 1.8; }
  .formula { background: linear-gradient(135deg,#1C3B22,#2E5936); color: white; border-radius: 12px; padding: 14px 24px; text-align: center; font-size: 1.3rem; font-weight: 700; margin: 14px 0; letter-spacing: .5px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px; }

  .btn { padding: 10px 24px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s; }
  .btn:hover:not(:disabled) { background: #2E5936; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost:hover:not(:disabled) { background: #E3F3D8; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { padding: 8px 16px; border: 2px solid var(--border); border-radius: 30px; background: #fff; font-family: 'Anuphan', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--text); display: inline-flex; align-items: center; gap: 4px; }
  .chip:hover { border-color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .frac { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; line-height: 1; vertical-align: middle; margin: 0 4px; }
  .frac .num { font-size: 1em; border-bottom: 2.5px solid currentColor; padding-bottom: 2px; min-width: 18px; text-align: center; white-space: nowrap; }
  .frac .den { font-size: 1em; padding-top: 3px; min-width: 18px; text-align: center; white-space: nowrap; }

  .align { display: grid; grid-template-columns: auto auto auto; justify-content: start; column-gap: .55em; row-gap: 3px; align-items: center; margin: 4px 0; }
  .align .l { justify-self: end; text-align: right; }
  .align .m { justify-self: center; font-weight: 700; }
  .align .r { justify-self: start; }
  .align .full { grid-column: 1 / -1; }

  /* สองกรณีคู่กันในบรรทัดเดียว คั่นด้วย "และ" (ครูสั่ง 2026-11-11) */
  .align2 { display: grid; grid-template-columns: repeat(7, auto); justify-content: start; column-gap: .55em; row-gap: 3px; align-items: center; margin: 4px 0; }
  .align2 .l { justify-self: end; text-align: right; }
  .align2 .m { justify-self: center; font-weight: 700; }
  .align2 .r { justify-self: start; }
  .align2 .and { padding: 0 1.1em; font-weight: 700; color: var(--muted); }
  .align2 .and::before { content: "และ"; }
  html[lang="en"] .align2 .and::before { content: "and"; }


  /* พจน์ที่ "ถูกย้าย" — วิ่งข้ามเครื่องหมาย = จริงๆ ตามลูกศรโค้ง เครื่องหมายกลับกลางทาง (ครูสั่ง 2026-11-11) */
  .mv { display: inline-block; background: #FFE8CC; color: #C2570C; border-radius: 6px; padding: 0 6px; font-weight: 800; }
  .mv > template { display: none; }
  .mv.flying { visibility: hidden; }
  .mv-fly { position: absolute; z-index: 5; pointer-events: none; background: #FFE8CC; color: #C2570C; border: 2px solid #C2570C; border-radius: 8px; padding: 0 7px; font-weight: 800; white-space: nowrap; transform: translate(-50%, -50%); }
  /* ตัวอย่างย้ายข้าง: สมการตัวใหญ่ ให้เห็นพจน์วิ่งข้าม = ชัดจากหลังห้อง */
  #tab-mv .wk-cell .align { font-size: 1.55rem; margin: 30px 0 6px; column-gap: .45em; }
  #genOut .align { font-size: 1.3rem; margin-top: 26px; }
  .mv-arc { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 4; }
  .mv-arc path { fill: none; stroke: #C2570C; stroke-width: 2.4; stroke-dasharray: 6 4; }
  .mv-arc polygon { fill: #C2570C; }

  /* เครื่องหมายราก มีขีดคลุม (vinculum) ต่อจากตัวราก ครอบนิพจน์พอดี — ของกลาง class .rad (ใช้ชื่อเดียวกับสื่อเรขาคณิตวิเคราะห์) */
  .rad { display: inline-flex; align-items: stretch; vertical-align: middle; white-space: nowrap; line-height: 1.15; margin: 0 .06em; }
  .rad > .rad-sym { flex: none; width: .62em; height: auto; overflow: visible; }
  .rad > .rad-sym path { fill: none; stroke: currentColor; stroke-width: max(2px, .1em); stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .rad > .rad-in { border-top: max(2px, .1em) solid currentColor; padding: .12em .14em 0 .1em; display: inline-block; }
  .frac .den .rad, .frac .num .rad { margin-top: .28em; }

  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0; }
  .tool { border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px; text-align: center; background: #fff; line-height: 1.7; }
  .tool .big { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
  .tool .swap { display: inline-block; animation: swap 2.2s ease-in-out infinite; }
  @keyframes swap { 0%,100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }

  .ck-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 12px 0; }
  .ck { border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; background: #fff; transition: all .4s; }
  .ck .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; color: transparent; font-weight: 800; flex-shrink: 0; transition: all .4s; }
  .ck.done { border-color: var(--accent-2); background: #F6FFF3; }
  .ck.done .box { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

  svg.nl { display: block; width: 100%; max-width: 700px; height: auto; margin: 0 auto; }
  .readout { background: #EEF7E6; border-left: 4px solid var(--primary); border-radius: 10px; padding: 14px 18px; margin-top: 12px; line-height: 1.9; font-size: 1.05rem; }
  .tag { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 28px; border-radius: 8px; font-weight: 800; padding: 0 8px; }
  .tag.pos { background: var(--pos-bg); color: var(--pos); }
  .tag.neg { background: var(--neg-bg); color: var(--neg); }
  .slider-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
  .slider-row b { min-width: 34px; }
  input[type=range] { accent-color: var(--primary); width: min(320px, 100%); }
  .slider-val { font-weight: 800; color: var(--primary); font-size: 1.1rem; min-width: 44px; }

  .case-tbl { width: 100%; border-collapse: collapse; margin: 12px 0; text-align: center; }
  .case-tbl th, .case-tbl td { border: 2px solid var(--border); padding: 10px 8px; }
  .case-tbl th { background: #EEF7E6; color: var(--primary); }
  .case-tbl tr.live td { background: #FFF9F2; border-color: var(--secondary); font-weight: 800; box-shadow: inset 0 0 0 2px rgba(255,138,61,.25); }

  .wk-cell { position: relative; background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px 12px 52px; margin-bottom: 12px; line-height: 1.8; }
  .wk-cell.fresh { animation: rowIn .5s ease; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .wk-cell .stepno { position: absolute; left: 14px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .wk-cell small, .note { color: var(--muted); }
  .badge { display: inline-block; background: var(--accent-2); color: #fff; border-radius: 20px; padding: 1px 10px; font-size: .8rem; font-weight: 800; margin-left: 6px; }

  .quiz-q { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
  .quiz-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .quiz-opt { padding: 10px 20px; border: 2px solid var(--border); border-radius: 30px; cursor: pointer; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 600; transition: all .2s; background: white; display: inline-flex; align-items: center; min-height: 48px; }
  .quiz-opt:hover { border-color: var(--primary); color: var(--primary); }
  .quiz-opt.correct { border-color: var(--accent); background: #ECFDF5; color: #047857; }
  .quiz-opt.wrong { border-color: var(--secondary); background: #FFF4EC; color: #BE185D; }
  .quiz-feedback { font-weight: 700; font-size: 1rem; min-height: 24px; }
  .quiz-feedback.ok { color: #047857; }
  .quiz-feedback.err { color: #BE185D; }
  .btn-next { margin-top: 10px; padding: 10px 28px; background: var(--primary); color: white; border: none; border-radius: 30px; font-family: 'Anuphan', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn-next:hover { background: #142B1A; }
  .score-badge { display: inline-block; background: linear-gradient(135deg,#68EF3F,#1C3B22); color: white; border-radius: 30px; padding: 6px 20px; font-weight: 700; font-size: 1rem; }


  /* ── แท็บการแก้สมการ/ย้ายข้าง (2026-11-12) — สีใช้ var(--g-*) ให้ได้ทั้งโหมดสว่างและมืด ── */
  svg.scale, svg.conv { display: block; width: 100%; max-width: 820px; height: auto; margin: 0 auto; }
  .sc-wrap { margin: 6px 0 4px; }
  .sc-beam, .sc-pan { transition: transform 1s cubic-bezier(.35, 1.35, .5, 1); }
  .sc-item { animation: scPop .4s ease; }
  @keyframes scPop { from { opacity: 0; } to { opacity: 1; } }
  .sc-balloon { animation: scPop .4s ease, scBob 3s ease-in-out infinite .4s; }
  @keyframes scBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .sc-item.blink rect { animation: scBlink .9s ease-in-out infinite; }
  @keyframes scBlink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .sc-burst { animation: scBurst .7s ease-out forwards; }
  @keyframes scBurst { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sc-beam, .sc-pan { transition: none; } .sc-item, .sc-balloon, .sc-item.blink rect, .sc-burst { animation: none; } }
  .sc-eq { font-size: 1.6rem; font-weight: 800; text-align: center; margin: 6px 0 2px; min-height: 2.2rem; }

  .pl-status.bad { border-color: var(--g-orange); color: var(--g-orange); }

/* ── theme:start — สร้างโดย tools/build_lessons.py ห้ามแก้มือ (แก้ที่สคริปต์แล้วรันใหม่) ── */
/* ธีมชุดเดียวกับหน้าสารบัญ (tools/build_index.py · DESIGN.md หมวด Meta-inspired) — สีของเรื่องอยู่ที่ปกและในตัวบทเรียน กรอบหน้าเป็นสีกลาง */
:root{ --page:#2F6FD0; }
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#ffffff; --card:#ffffff; --panel:#f1f4f7; --raise:#e4e9ee;
  --text:#1c1e21; --muted:#5d6c7b; --dim:#8595a4; --line:#ced0d4; --line-soft:#dee3e9; --border:#ced0d4;
  --ink:#000000; --on-ink:#ffffff; --ink-hover:#2b3138; --link:#0064e0; --strong:#1c1e21; --shadow:none;
  --primary:color-mix(in srgb, var(--page) 86%, #000); --primary-2:color-mix(in srgb, var(--page) 62%, #000);
  --secondary:#C2540A; --secondary-light:#F2A15F; --accent:#68EF3F; --accent-2:#2E9E3F;
  --g-x:#E53935; --g-y:#2E9E4F; --g-z:#3949AB; --g-curve:#F07400; --g-curve-fill:rgba(240,116,0,.12);
  --g-pink:#D81B60; --g-plane:rgba(60,190,200,.28); --g-cone:rgba(153,51,0,.20); --g-cone-line:rgba(153,51,0,.35);
  --g-blue:#1E66D0; --g-red:#D32F2F; --g-green:#2E9E4F; --g-purple:#7B3FC4; --g-orange:#E8710A; --g-teal:#0F8A80;
  --g-ring:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#0a1317; --surface:#0a1317; --card:#0a1317; --panel:#1c1e21; --raise:#2b3138;
  --text:#ffffff; --muted:#9aa8b5; --dim:#6b7884; --line:#444950; --line-soft:#32383e; --border:#444950;
  --ink:#ffffff; --on-ink:#000000; --ink-hover:#d5dbe1; --link:#4da3ff; --strong:#2b3138; --shadow:none;
  --primary:#82a9e3; --primary-2:#a3c0ea;
  --secondary:#FFB37A; --secondary-light:#FFD0A8; --accent:#8AF25E; --accent-2:#5BD27E;
  --g-x:#FF6B6B; --g-y:#5BD27E; --g-z:#8C9BFF; --g-curve:#FFA040; --g-curve-fill:rgba(255,160,64,.16);
  --g-pink:#FF5C9A; --g-plane:rgba(90,220,230,.26); --g-cone:rgba(255,170,110,.18); --g-cone-line:rgba(255,170,110,.45);
  --g-blue:#6AA8FF; --g-red:#FF6B6B; --g-green:#5BD27E; --g-purple:#B48CFF; --g-orange:#FFA040; --g-teal:#4FD1C5;
  --g-ring:#0a1317;
}
html{ background:var(--bg); color-scheme:light; }
html[data-theme="dark"]{ color-scheme:dark; }
body{ font-family:'Anuphan',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; }
:focus-visible{ outline:2px solid var(--link); outline-offset:2px; }

/* หัวหน้า: แผ่นสีอ่อนมุมโค้ง ตัวหนังสือเข้ม + ปกข้างชื่อ (สีของเรื่องอยู่ที่ปก) */
header{
  background:var(--panel); color:var(--text); text-align:left; overflow:hidden;
  display:grid; grid-template-columns:auto 1fr; column-gap:24px; align-items:end;
  margin:8px 8px 0; padding:74px 32px 28px; border-radius:32px; box-shadow:none;
}
header::before, header::after{ display:none !important; }
header > *:not(.lesson-cover):not(.back-link):not(.lang-toggle):not(.theme-toggle){ grid-column:2; }
.lesson-cover{ grid-column:1; grid-row:1 / span 6; align-self:end; width:clamp(96px, 11vw, 136px); aspect-ratio:1; border-radius:16px; overflow:hidden; box-shadow:none; }
.lesson-cover svg{ display:block; width:100%; height:100%; }
header h1{ font-size:clamp(1.9rem, 4.4vw, 3.2rem); font-weight:500; letter-spacing:0; line-height:1.25; margin:0; color:var(--text); }
header p{ font-size:1.02rem; opacity:1; margin:8px 0 0; color:var(--muted); line-height:1.55; }
.back-link{
  position:absolute; top:16px; left:16px; z-index:2; display:inline-flex; align-items:center; gap:6px;
  height:38px; padding:0 16px; border-radius:100px; background:var(--surface); color:var(--text);
  box-shadow:inset 0 0 0 1px var(--line); font-size:.92rem; font-weight:700; opacity:1; text-decoration:none;
}
.back-link:hover{ background:var(--raise); opacity:1; text-decoration:none; }
.lang-toggle, .theme-toggle{
  position:absolute; top:16px; height:38px; border-radius:100px; font-family:inherit; font-weight:700; font-size:.88rem;
  cursor:pointer; z-index:2; transition:transform .12s, background .12s;
}
.lang-toggle{ right:16px; min-width:64px; padding:0 16px; background:var(--ink); color:var(--on-ink); border:1px solid var(--ink); }
.lang-toggle:hover{ background:var(--ink); border-color:var(--ink); transform:scale(1.04); }
.theme-toggle{ right:88px; width:38px; padding:0; display:grid; place-items:center; background:var(--surface); color:var(--text); border:1px solid var(--line); }
.theme-toggle svg{ width:18px; height:18px; }
.theme-toggle:hover{ background:var(--raise); border-color:var(--line); }
body > .lang-toggle, body > .theme-toggle{ position:fixed; top:14px; z-index:50; }
body > .lang-toggle{ right:14px; } body > .theme-toggle{ right:86px; }
header:not(:has(.back-link)):not(:has(.lang-toggle)){ padding-top:28px; }

/* แถบแท็บ: ชิปขอบบาง ตัวที่เลือก = สีหมึก (ดำ / โหมดมืดขาว) */
nav{ background:var(--bg); border-bottom:0; padding:16px 16px 8px; gap:8px; box-shadow:none; }
.tab-btn{
  font-family:inherit; border:0; margin:0; border-radius:100px; padding:8px 18px;
  background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 1px var(--line); font-weight:600; font-size:.95rem;
}
.tab-btn:hover{ background:var(--raise); color:var(--text); }
.tab-btn.active{ background:var(--ink); color:var(--on-ink); box-shadow:none; border-bottom-color:transparent; }

/* การ์ดและกล่อง: พื้นเรียบ ขอบ 1px ไม่มีเงา */
.card{ background:var(--card); border:1px solid var(--line); border-radius:24px; box-shadow:none; }
.card-title{ color:var(--text); font-size:1.2rem; }
.card-title .icon{ display:none; }
.desc-text{ color:var(--text); font-size:1rem; }
.formula, .step.result, .stats{ background:var(--strong) !important; color:#fff; border-radius:16px; letter-spacing:0; }
.stat .k, .step-tag{ text-transform:none; letter-spacing:0; }

/* ปุ่ม: หลัก = แคปซูลหมึก, รอง = แคปซูลขอบบาง */
.btn-action{ font-family:inherit; background:var(--ink); color:var(--on-ink); border:1px solid var(--ink); border-radius:100px; }
.btn-action:hover:not(:disabled){ background:var(--ink-hover); border-color:var(--ink-hover); }
.btn-action.secondary{ background:transparent; color:var(--text); border:1px solid var(--line); }
.btn-action.secondary:hover:not(:disabled){ background:var(--raise); }
.mode-btn{ font-family:inherit; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:100px; }
.mode-btn:hover{ border-color:var(--text); color:var(--text); }
.mode-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
input[type=range]{ accent-color:var(--primary); }

@media (max-width:600px){
  header{ margin:0; border-radius:0 0 24px 24px; padding:64px 16px 20px; column-gap:14px; }
  .lesson-cover{ width:72px; border-radius:12px; }
  header h1{ font-size:clamp(1.5rem, 7vw, 2rem); }
  header p{ font-size:.95rem; }
  .back-link{ top:14px; left:12px; height:36px; padding:0 14px; max-width:calc(100% - 150px); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; display:block; line-height:36px; }
  .lang-toggle, .theme-toggle{ top:14px; height:36px; }
  .lang-toggle{ right:12px; min-width:58px; padding:0 12px; }
  .theme-toggle{ right:78px; width:36px; }
  nav{ flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; scrollbar-width:none; padding:12px 12px 6px; }
  nav .tab-btn{ flex:0 0 auto; white-space:nowrap; }   /* ชื่อแท็บบรรทัดเดียว ปัดแถบซ้าย-ขวาแทน (ไม่บีบจนตัดคำ) */
  nav::-webkit-scrollbar{ display:none; }
}
/* สีกรอบธีมเก่าที่หน้านี้ฝังไว้เอง → โทเคนธีมใหม่ ทั้ง 2 โหมด (สร้างอัตโนมัติ) */
:root[data-theme] .box-info{background:var(--panel)}
:root[data-theme] .btn{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* โหมดมืด: สีที่หน้านี้ฝังไว้เอง (สร้างอัตโนมัติ) */

  /* ═══ ปากกาสี (คู่กับ tools/pen_ink.js · build_lessons.py ใส่ให้ทุกหน้า) — สีปุ่มใช้โทเคน --g-* เปลี่ยนตามโหมดสว่าง/มืดเอง ═══ */
  #penCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9000; }

  .pen-sep { width: 1px; height: 26px; background: var(--line, #ced0d4); margin: 0 4px; }
  html.pen-on body, html.pen-on body * { cursor: crosshair; }

  html.pen-finger { touch-action: none; }
  html.pen-on body { -webkit-user-select: none; user-select: none; }
  @media (max-width: 560px) {

    .pen-sw span { width: 19px; height: 19px; }
    .pen-sep { margin: 0 1px; }
  }
  @media print { #penCanvas, .pen-bar { display: none !important; } }

// ═══════════════════════ ตาชั่ง SVG (แท็บ "การแก้สมการ") ═══════════════════════

  }
  if (st.groups) for (let g = 1; g < st.groups; g++) {                // เส้นประแบ่ง 4 กลุ่มเท่ากัน
    const dx = (g - st.groups / 2) * BSP;
    p.push(`<line x1="${dx}" y1="${D - 150}" x2="${dx}" y2="${D}" stroke="var(--g-orange)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>`);
  }
  if (s.pop) p.push(`<g class="sc-burst">${[0, 1, 2, 3, 4, 5, 6, 7].map(i => { const a = i * Math.PI / 4; return `<line x1="${(Math.cos(a) * 18).toFixed(1)}" y1="${(D - 60 + Math.sin(a) * 18).toFixed(1)}" x2="${(Math.cos(a) * 46).toFixed(1)}" y2="${(D - 60 + Math.sin(a) * 46).toFixed(1)}" stroke="var(--g-purple)" stroke-width="4" stroke-linecap="round"/>`; }).join('')}</g>`);
  return p.join('');
}
function scPans(id, st) {
  const a = scAngle(st) * Math.PI / 180, B = SC.BL, D = SC.D;
  return ['L', 'R'].map(sd => {
    const sg = sd === 'L' ? -1 : 1;
    return `<g class="sc-pan" id="${id}-p${sd}" style="transform:translate(${(sg * B * Math.cos(a)).toFixed(1)}px,${(sg * B * Math.sin(a)).toFixed(1)}px)">
      <path d="M0 0 L${-SC.PAN + 8} ${D} M0 0 L${SC.PAN - 8} ${D}" stroke="var(--dim)" stroke-width="3" fill="none"/>
      <rect x="${-SC.PAN}" y="${D}" width="${2 * SC.PAN}" height="11" rx="5.5" fill="var(--text)" opacity=".75"/>
      <g id="${id}-i${sd}">${scPanItems(st[sd], st)}</g></g>`;
  }).join('');
}
function scaleHtml(id, st) {
  const B = SC.BL;
  return `<svg class="scale" id="${id}" viewBox="0 0 ${SC.W} ${SC.H}" role="img" aria-label="${EN() ? 'balance scale' : 'ตาชั่งสองแขน'}">
    <path d="M${SC.PX} ${SC.PY} L${SC.PX} 398" stroke="var(--dim)" stroke-width="8" stroke-linecap="round"/>
    <rect x="${SC.PX - 70}" y="396" width="140" height="12" rx="6" fill="var(--text)" opacity=".75"/>
    <g transform="translate(${SC.PX} ${SC.PY})">
      <g class="sc-beam" id="${id}-beam" style="transform:rotate(${scAngle(st)}deg)"><rect x="${-B - 8}" y="-6" width="${2 * B + 16}" height="12" rx="6" fill="var(--text)"/></g>
      <g id="${id}-pans">${scPans(id, st)}</g>
      <circle cx="0" cy="0" r="11" fill="var(--g-orange)" stroke="var(--g-ring)" stroke-width="2"/>

function scaleUpdate(id, st) {
  const beam = document.getElementById(id + '-beam'), pans = document.getElementById(id + '-pans');
  if (!beam || !pans) return;
  const a = scAngle(st) * Math.PI / 180, B = SC.BL;
  beam.style.transform = `rotate(${scAngle(st)}deg)`;
  ['L', 'R'].forEach(sd => {
    const sg = sd === 'L' ? -1 : 1, pan = document.getElementById(id + '-p' + sd);
    pan.style.transform = `translate(${(sg * B * Math.cos(a)).toFixed(1)}px,${(sg * B * Math.sin(a)).toFixed(1)}px)`;
    document.getElementById(id + '-i' + sd).innerHTML = scPanItems(st[sd], st);
  });
}
// ข้อความสมการของข้างหนึ่งของตาชั่ง (ไม่ใช้กับลูกโป่ง)
function sideTxt(s) {
  const parts = [];
  if (s.x) parts.push(s.x === 1 ? 'x' : s.x + 'x');
  if (s.w) parts.push(String(s.w));
  return parts.length ? parts.join(' + ') : '0';
}

// ═══════════════════════ สายพาน (ถอดรองเท้าก่อนถุงเท้า) ═══════════════════════
// cv = { nodes:[{t,st?}], ops:[{t,st?}], dir:'fwd'|'rev', tags?:[T] } · st: 'hot' ส้ม · 'on' น้ำเงิน · 'ans' เขียว
function convHtml(cv) {
  const m = cv.nodes.length, W = 700, H = 190, nw = m <= 3 ? 104 : 86, ow = m <= 3 ? 92 : 74, y = 110;
  const gap = (W - 40 - (m * nw + (m - 1) * ow)) / (2 * (m - 1)), rev = cv.dir === 'rev';
  const col = rev ? 'var(--g-orange)' : 'var(--g-blue)';
  const nodeX = [], opX = []; let x = 20;
  for (let i = 0; i < m; i++) { nodeX.push(x); x += nw; if (i < m - 1) { x += gap; opX.push(x); x += ow + gap; } }
  const arrow = (a, b) => {                       // เส้นลูกศรจาก a ไป b ตามทิศของสายพาน
    const hx = rev ? a : b, dir = rev ? -1 : 1;
    return `<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="${col}" stroke-width="3.5"/><polygon points="${hx},${y} ${hx - 9 * dir},${y - 7} ${hx - 9 * dir},${y + 7}" fill="${col}"/>`;
  };
  let s = `<svg class="conv" viewBox="0 0 ${W} ${H}" role="img" aria-label="${EN() ? 'operation chain' : 'สายพานการดำเนินการ'}">`;
  for (let i = 0; i < m - 1; i++) s += arrow(nodeX[i] + nw, opX[i]) + arrow(opX[i] + ow, nodeX[i + 1]);
  cv.nodes.forEach((n, i) => {
    const t = String(n.t).length > 5 ? 19 : 25, ans = n.st === 'ans';
    s += `<rect x="${nodeX[i]}" y="${y - 28}" width="${nw}" height="56" rx="14" fill="${ans ? 'var(--g-green)' : 'var(--panel)'}" stroke="${ans ? 'var(--g-green)' : 'var(--line)'}" stroke-width="2"/><text x="${nodeX[i] + nw / 2}" y="${y + 9}" text-anchor="middle" font-size="${t}" font-weight="800" fill="${ans ? 'var(--g-ring)' : 'var(--text)'}">${n.t}</text>`;
  });
  cv.ops.forEach((o, i) => {
    const hot = o.st === 'hot', on = o.st === 'on', fill = hot ? 'var(--g-orange)' : on ? 'var(--g-blue)' : 'var(--panel)';
    s += `<rect x="${opX[i]}" y="${y - 25}" width="${ow}" height="50" rx="10" fill="${fill}" stroke="${hot ? 'var(--g-orange)' : on ? 'var(--g-blue)' : 'var(--line)'}" stroke-width="2"/><text x="${opX[i] + ow / 2}" y="${y + 9}" text-anchor="middle" font-size="24" font-weight="800" fill="${hot || on ? 'var(--g-ring)' : 'var(--text)'}">${o.t}</text>`;
    if (cv.tags && cv.tags[i]) s += `<text x="${opX[i] + ow / 2}" y="${y - 42}" text-anchor="middle" font-size="17" font-weight="700" fill="${hot ? 'var(--g-orange)' : 'var(--muted)'}">${tx(cv.tags[i])}</text>`;
  });
  return s + '</svg>';
}

// ═══════════════════════ ตัวเล่นฉาก ▶ (ใช้ร่วมกัน) ═══════════════════════
// scenes[i] = { st | cv, eq:T, cap:T, then?:{delay, st|cv, eq?, cap?} } — ฉากเล่าด้วยภาพ ◀ ▶ ย้อน/เล่นซ้ำได้
const SCI = {}, SCD = {}, SCT = {};
function sceneCard(key, title, scenes, o) {
  o = o || {}; SCD[key] = { scenes, o };
  const i = SCI[key] || 0, s = scenes[i], n = scenes.length, en = EN();
  return `<div class="card" id="scn-${key}">
    <div class="card-title"><span>${tx(title)}</span></div>
    ${o.intro ? `<p class="intro">${tx(o.intro)}</p>` : ''}
    <div class="sc-wrap" id="sw-${key}">${o.kind === 'conv' ? convHtml(s.cv) : scaleHtml('sv-' + key, s.st)}</div>
    <div class="sc-eq" id="se-${key}">${tx(s.eq)}</div>
    <div class="sc-cap" id="sp-${key}">${tx(s.cap)}</div>
    <div class="btn-row">
      <button class="btn ghost" id="sbp-${key}" onclick="sceneGo('${key}',-1)">${en ? '◀ Back' : '◀ ย้อน'}</button>
      <button class="btn" id="sbn-${key}" onclick="sceneGo('${key}',1)">${en ? 'Next scene ▶' : 'ฉากถัดไป ▶'} (<span id="sn-${key}">${i + 1}/${n}</span>)</button>
      <button class="btn ghost" id="sbr-${key}" onclick="sceneGo('${key}',0)">${en ? '↺ Restart' : '↺ เริ่มใหม่'}</button>
    </div>
    ${o.after ? `<div class="box-info">${tx(o.after)}</div>` : ''}
  </div>`;
}
function sceneApply(key, x) {
  const o = SCD[key].o;
  if (x.eq) document.getElementById('se-' + key).innerHTML = tx(x.eq);
  if (x.cap) document.getElementById('sp-' + key).innerHTML = tx(x.cap);
  if (o.kind === 'conv') { if (x.cv) document.getElementById('sw-' + key).innerHTML = convHtml(x.cv); }
  else if (x.st) scaleUpdate('sv-' + key, x.st);
}
function sceneShow(key) {
  const d = SCD[key]; if (!d) return;
  const i = SCI[key] || 0, s = d.scenes[i], n = d.scenes.length;
  clearTimeout(SCT[key]);
  sceneApply(key, s);
  if (s.then) SCT[key] = setTimeout(() => { if ((SCI[key] || 0) === i) sceneApply(key, s.then); }, s.then.delay || 1800);
  const q = id => document.getElementById(id + '-' + key);
  if (q('sn')) q('sn').textContent = (i + 1) + '/' + n;
  if (q('sbp')) q('sbp').disabled = i === 0;
  if (q('sbn')) q('sbn').disabled = i === n - 1;
}
function sceneGo(key, d) {
  const n = SCD[key].scenes.length;
  SCI[key] = d === 0 ? 0 : Math.max(0, Math.min(n - 1, (SCI[key] || 0) + d));
  sceneShow(key);
}

// ═══════════════════════ ทายก่อนเฉลย (ใช้ร่วมกัน · ไม่นับคะแนน) ═══════════════════════
// PRD[key] = { title, intro?, items:[{ q:T, opts:[T|string], ans, why:T, scale?:{before,after}, eq0?:T, eq1?:T, reveal?:()=>html }] }
const PRS = {}, PRD = {};
function prdHtml(key, animate) {
  const d = PRD[key], st = PRS[key] || (PRS[key] = { i: 0, pick: null }), it = d.items[st.i], en = EN();
  const done = st.pick !== null, ok = st.pick === it.ans;
  let h = `<div class="card" id="prd-${key}"><div class="card-title"><span>${tx(d.title)}</span></div>`;
  if (d.intro) h += `<p class="intro">${tx(d.intro)}</p>`;
  h += `<div class="chips">${d.items.map((_, i) => `<button class="chip ${st.i === i ? 'active' : ''}" onclick="prdSel('${key}',${i})">${en ? 'Question' : 'ข้อ'} ${i + 1}</button>`).join('')}</div>`;
  h += `<div class="quiz-q">${tx(it.q)}</div>`;
  if (it.scale) h += `<div class="sc-wrap">${scaleHtml('pv-' + key, done && !animate ? it.scale.after : it.scale.before)}</div>`;
  if (it.eq0) h += `<div class="sc-eq" id="pe-${key}">${tx(done ? it.eq1 : it.eq0)}</div>`;
  h += `<div class="quiz-opts">${it.opts.map((o, i) => `<button class="quiz-opt ${done ? (i === it.ans ? 'correct' : i === st.pick ? 'wrong' : '') : ''}" ${done ? 'disabled style="pointer-events:none"' : ''} onclick="prdPick('${key}',${i})">${tx(o)}</button>`).join('')}</div>`;
  if (done) {
    h += `<div class="pr-fb ${ok ? 'ok' : 'bad'}"><b>${ok ? (en ? '✅ Right!' : '✅ ทายถูก!') : (en ? '❌ Not quite —' : '❌ ยังไม่ใช่ —')}</b> ${tx(it.why)}</div>`;
    if (it.reveal) h += `<div class="sc-wrap">${it.reveal()}</div>`;
    h += `<div class="btn-row"><button class="btn ghost" onclick="prdSel('${key}',${st.i})">${en ? '↺ Guess again' : '↺ ทายใหม่'}</button></div>`;
  }
  return h + '</div>';
}
function prdRender(key, animate) {
  const el = document.getElementById('prd-' + key); if (!el) return;
  el.outerHTML = prdHtml(key, animate);
  const it = PRD[key].items[PRS[key].i];
  if (animate && it.scale) requestAnimationFrame(() => requestAnimationFrame(() => scaleUpdate('pv-' + key, it.scale.after)));
}
function prdPick(key, n) { PRS[key].pick = n; prdRender(key, true); }
function prdSel(key, i) { PRS[key] = { i, pick: null }; prdRender(key, false); }

// ═══════════════════════ เล่นเอง: หยิบ-ใส่ตุ้ม ═══════════════════════
const PL = { L: { x: 1, w: 3, b: 0 }, R: { x: 0, w: 5, b: 0 }, xv: 2 };
const PLMAX = 12;
function plReset() { PL.L = { x: 1, w: 3, b: 0 }; PL.R = { x: 0, w: 5, b: 0 }; }
function plAct(side, d) {
  const sides = side === 'B' ? ['L', 'R'] : [side];
  if (sides.some(s => PL[s].w + d < 0 || PL[s].w + d > PLMAX)) return;
  sides.forEach(s => PL[s].w += d);
  plSync();
}
function plSync() {
  scaleUpdate('sv-play', plState());
  const eq = document.getElementById('pe-play'), stt = document.getElementById('ps-play'), en = EN();
  const bal = scNet(PL.L, PL.xv) === scNet(PL.R, PL.xv);
  if (eq) eq.innerHTML = `${sideTxt(PL.L)} ${bal ? '=' : '≠'} ${sideTxt(PL.R)}`;
  if (stt) { stt.className = 'pl-status ' + (bal ? 'ok' : 'bad'); stt.textContent = bal ? (en ? 'Balanced ✓' : 'สมดุล ✓') : (en ? 'Not balanced ✗' : 'ไม่สมดุล ✗'); }
  document.querySelectorAll('#plCtl button[data-s]').forEach(b => {
    const sides = b.dataset.s === 'B' ? ['L', 'R'] : [b.dataset.s], d = +b.dataset.d;
    b.disabled = sides.some(s => PL[s].w + d < 0 || PL[s].w + d > PLMAX);
  });
  document.querySelectorAll('#plCtl .pl-why').forEach(w => {
    const sides = w.dataset.s === 'B' ? ['L', 'R'] : [w.dataset.s];
    w.textContent = sides.some(s => PL[s].w === 0) ? (en ? '(no weight to remove)' : '(ไม่มีตุ้มให้หยิบออก)') : sides.some(s => PL[s].w === PLMAX) ? (en ? '(pan is full)' : '(ถาดเต็มแล้ว)') : '';
  });
}
const plState = () => ({ L: PL.L, R: PL.R, xv: PL.xv });
function plHtml() {
  const en = EN();
  const row = (s, th, e) => `<div class="pl-row"><span class="pl-lab">${en ? e : th}</span>
    <button class="btn ghost" data-s="${s}" data-d="1" onclick="plAct('${s}',1)">+1</button>
    <button class="btn ghost" data-s="${s}" data-d="-1" onclick="plAct('${s}',-1)">−1</button>
    <span class="pl-why note" data-s="${s}"></span></div>`;
  return `<div class="card" id="pl-card">
    <div class="card-title"><span>${en ? 'Play: add and remove weights' : 'เล่นเอง: ลองหยิบ-ใส่ตุ้มดู'}</span></div>
    <p class="intro">${en ? 'Box x is still a mystery, but the scale knows its real weight. Find a way to change the weights so the scale stays balanced.' : 'กล่อง x ยังเป็นปริศนา แต่ตาชั่งรู้น้ำหนักจริงของมัน ลองเพิ่ม-เอาตุ้มออก แล้วหาวิธีที่ตาชั่งยังสมดุล'}</p>
    <div class="sc-wrap">${scaleHtml('sv-play', plState())}</div>
    <div class="sc-eq" id="pe-play"></div>
    <div style="text-align:center"><span class="pl-status" id="ps-play"></span></div>
    <div id="plCtl" class="pl-ctl">${row('L', 'ซ้าย', 'Left')}${row('R', 'ขวา', 'Right')}${row('B', 'ทั้งสองข้าง', 'Both sides')}</div>
    <div class="btn-row"><button class="btn ghost" onclick="plReset();plSync()">${en ? '↺ Restart' : '↺ เริ่มใหม่'}</button></div>
    <div class="box-info">${en ? '<b>Do the same to both sides → still equal</b><br>This is the <b>property of equality</b> for real numbers: if a = b then a + c = b + c and ac = bc (and a ÷ c = b ÷ c when c ≠ 0).' : '<b>ทำสองข้างเหมือนกัน → ยังเท่ากัน</b><br>นี่คือ <b>สมบัติการเท่ากัน</b> ของจำนวนจริง: ถ้า a = b แล้ว a + c = b + c และ ac = bc (และ a ÷ c = b ÷ c เมื่อ c ≠ 0)'}</div>
  </div>`;
}

// ═══════════════════════ TAB 2: ย้ายข้าง (ทางลัดของการทำสองข้าง) ═══════════════════════
// การ์ด 1: เทียบวิธีเต็ม (ซ้าย) กับวิธีลัด (ขวา) — พจน์ +8 บินข้าม = เป็น −8 ด้วย mv()/mvAnimate()
const MC = { k: 0 };
function mcHtml(prev) {
  const en = EN(), k = MC.k;
  const cell = (cls, inner, born) => `<div class="wk-cell ${cls || ''}${born > prev ? ' fresh' : ''}">${inner}</div>`;
  const cancel = s => `<span class="cancel">${s}</span>`;
  // k = จำนวนขั้นที่กดแล้ว (0–4) · บรรทัดตั้งต้นขึ้นทั้งสองคอลัมน์ตั้งแต่ k = 0
  const Lc = [
    cell('', al([['4x + 8', '=', '0']]), 0),
    cell(k >= 2 ? 'dim' : '', al([[k >= 2 ? '4x ' + cancel('+ 8 − 8') : '4x + 8 ' + BOTH('− 8'), '=', '0 ' + BOTH('− 8')]]), 1),
    cell('', al([['4x', '=', '−8']]), 2),
    cell(k >= 4 ? 'dim' : '', al([[frac('4x', BOTH('4')), '=', frac('−8', BOTH('4'))]]), 3),
    cell('', al([['x', '=', '−2']]), 4)
  ].filter((_, i) => k >= i);
  const Rc = [cell('', al([['4x + 8', '=', '0']]), 0)];
  if (k >= 2) Rc.push(cell('', al([['4x', '=', mv('−8', '+8')]]), 2));
  if (k >= 4) Rc.push(cell('', al([['x', '=', frac('−8', mv('4', '×4', 'start', '÷4')) + ' = −2']]), 4));
  const msg = [];
  if (k >= 2) msg.push(en ? '+8 does not really jump across. We just <b>subtract 8 from both sides</b> and skip writing the middle line.' : '+8 ไม่ได้กระโดดข้ามจริงๆ เราแค่ <b>ลบ 8 ทั้งสองข้าง</b> แล้วไม่เขียนบรรทัดกลาง');
  if (k >= 4) msg.push(en ? 'Same for ×4 → ÷4: we just <b>divide both sides by 4</b> and skip the middle line.' : '×4 → ÷4 ก็เหมือนกัน: เราแค่ <b>หาร 4 ทั้งสองข้าง</b> แล้วข้ามบรรทัดกลาง');
  return `<div class="card" id="mc-card">
    <div class="card-title"><span>${en ? 'Moving terms is a shortcut for working on both sides' : 'ย้ายข้างคือทางลัดของการทำสองข้าง'}</span></div>
    <p class="intro">${en ? 'Left: the full method. Right: the shortcut. Press ▶ and watch the middle lines disappear.' : 'ซ้าย: วิธีเต็ม · ขวา: วิธีลัด กด ▶ แล้วดูบรรทัดกลางที่หายไป'}</p>
    <div class="cmp"><div><div class="cmp-h">${en ? 'Full method (both sides)' : 'วิธีเต็ม (ทำสองข้าง)'}</div>${Lc.join('')}</div>
    <div><div class="cmp-h">${en ? 'Shortcut (move terms)' : 'วิธีลัด (ย้ายข้าง)'}</div>${Rc.join('')}</div></div>
    ${msg.map(m => `<div class="box-info">${m}</div>`).join('')}
    <div class="btn-row">
      <button class="btn" onclick="mcNext()" ${k >= 4 ? 'disabled' : ''}>${en ? 'Next ▶' : 'ถัดไป ▶'} (${k}/4)</button>
      <button class="btn ghost" onclick="mcReset()" ${k === 0 ? 'disabled' : ''}>${en ? '↺ Restart' : '↺ เริ่มใหม่'}</button>
    </div></div>`;
}
function mcRender(prev, play) {
  const el = document.getElementById('mc-card'); if (!el) return;
  el.outerHTML = mcHtml(prev);
  if (MC.k > 0 && document.getElementById('tab-mv').classList.contains('active')) mvAnimate(document.getElementById('mc-card'), play);
}
function mcNext() { const p = MC.k; if (MC.k < 4) MC.k++; mcRender(p, true); }
function mcReset() { MC.k = 0; mcRender(0, false); }

function updateGen() {
  const out = document.getElementById('genOut');

  const en = EN(), { a, b, c } = GN;
  document.getElementById('gAv').textContent = sgn(a); document.getElementById('gBv').textContent = sgn(b); document.getElementById('gCv').textContent = sgn(c);
  if (a === 0) { out.innerHTML = `<div class="box-warn">${en ? 'a must not be 0 — move the a slider.' : 'a ห้ามเป็น 0 — ลองเลื่อน a ให้ไม่เป็น 0'}</div>`; return; }
  const left = term(a, 'x') + (b === 0 ? '' : (b > 0 ? ' + ' + b : ' − ' + (-b)));
  let h = `<div class="formula">${left} = ${sgn(c)}</div>`;
  // เขียนโจทย์ตั้งต้นซ้ำอีกครั้งก่อนเริ่มย้ายข้างขั้นแรก (ถ้ามีขั้นให้ย้ายจริง)
  if (b !== 0 || a !== 1) h += al([[left, '=', sgn(c)]]);
  const ab = Math.abs(b), pa = a < 0 ? `(${sgn(a)})` : sgn(a);
  if (GN.mode === 'full') {                                         // แบบเต็ม: เห็นบรรทัดกลางครบ (ทำสองข้าง)
    if (b !== 0) {
      const op = b > 0 ? '− ' + ab : '+ ' + ab;
      h += P('<small>' + (b > 0 ? (en ? `Subtract ${ab} from both sides` : `ลบ ${ab} ทั้งสองข้าง`) : (en ? `Add ${ab} to both sides` : `บวก ${ab} ทั้งสองข้าง`)) + '</small>');
      h += al([[left + ' ' + BOTH(op), '=', sgn(c) + ' ' + BOTH(op)], [term(a, 'x'), '=', sgn(c - b)]]);
    }
    if (a !== 1) h += P('<small>' + (en ? `Divide both sides by ${pa}` : `หารทั้งสองข้างด้วย ${pa}`) + '</small>') + al([[frac(term(a, 'x'), BOTH(sgn(a))), '=', frac(sgn(c - b), BOTH(sgn(a)))]]);
  } else {
    if (b !== 0) {
      h += P('<small>' + (b > 0 ? (en ? `Move +${b} across → it becomes −${b}` : `ย้าย +${b} ไปอีกข้าง → กลายเป็น −${b}`) : (en ? `Move −${ab} across → it becomes +${ab}` : `ย้าย −${ab} ไปอีกข้าง → กลายเป็น +${ab}`)) + '</small>');
      if (c === 0) h += al([[term(a, 'x'), '=', mv(b > 0 ? '−' + ab : '+' + ab, b > 0 ? '+' + ab : '−' + ab)]]);
      else h += al([[term(a, 'x'), '=', sgn(c) + ' ' + mv(b > 0 ? '− ' + ab : '+ ' + ab, b > 0 ? '+ ' + ab : '− ' + ab)], [term(a, 'x'), '=', sgn(c - b)]]);
    }
    if (a !== 1) h += P('<small>' + (en ? `Move ×${pa} across → it becomes ÷${pa}` : `ย้าย ×${pa} ไปอีกข้าง → กลายเป็น ÷${pa}`) + '</small>') + al([['x', '=', frac(sgn(c - b), mv(sgn(a), '×' + pa, 'start', '÷' + pa))]]);
  }

  out.innerHTML = h;

const AVALS = [-3, -2, -1, 1, 2, 3];
const Q = { ai: 3, b: -3, c: 2 };
function qA() { return AVALS[Q.ai]; }
function renderQuad() {

      <div class="slider-row"><b>a =</b><input type="range" id="qA" min="0" max="5" step="1" value="${Q.ai}" oninput="Q.ai=parseFloat(this.value);updateQuad()"><span class="slider-val" id="qAv"></span></div>
      <div class="slider-row"><b>b =</b><input type="range" id="qB" min="-8" max="8" step="1" value="${Q.b}" oninput="Q.b=parseFloat(this.value);updateQuad()"><span class="slider-val" id="qBv"></span></div>

function setQ(a, b, c) { Q.ai = AVALS.indexOf(a); Q.b = b; Q.c = c; renderQuad(); }
function quadSvg(a, b, c, D) {
  const W = 640, H = 340, X0 = -8, X1 = 8, Y0 = -14, Y1 = 14;
  const sx = x => (x - X0) / (X1 - X0) * W, sy = y => H - (y - Y0) / (Y1 - Y0) * H;
  let s = `<svg class="nl" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="qclip"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>`;
  for (let x = X0; x <= X1; x += 2) s += `<line x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}" stroke="#EDF2F7"/>` + (x !== 0 ? `<text x="${sx(x)}" y="${sy(0) + 16}" text-anchor="middle" font-size="12" fill="#4A5568">${sgn(x)}</text>` : '');
  for (let y = -12; y <= 12; y += 4) s += `<line x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}" stroke="#EDF2F7"/>` + (y !== 0 ? `<text x="${sx(0) + 6}" y="${sy(y) - 3}" font-size="11" fill="#4A5568">${sgn(y)}</text>` : '');
  s += `<line x1="0" y1="${sy(0)}" x2="${W}" y2="${sy(0)}" stroke="#94A3B8" stroke-width="2.2"/><line x1="${sx(0)}" y1="0" x2="${sx(0)}" y2="${H}" stroke="#94A3B8" stroke-width="2.2"/>`;
  let d = ''; for (let i = 0; i <= 320; i++) { const x = X0 + (X1 - X0) * i / 320, y = a * x * x + b * x + c; d += (i ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(y).toFixed(1); }
  s += `<path d="${d}" fill="none" stroke="#3FA82E" stroke-width="4" clip-path="url(#qclip)"/>`;
  const vx = -b / (2 * a), vy = a * vx * vx + b * vx + c;
  if (Math.abs(vy) < 16 && Math.abs(vx) < 9) s += `<circle cx="${sx(vx)}" cy="${sy(vy)}" r="5" fill="#fff" stroke="#1C3B22" stroke-width="2.5"/>`;
  if (D >= 0) [(-b - Math.sqrt(D)) / (2 * a), (-b + Math.sqrt(D)) / (2 * a)].filter((r, i, arr) => i === 0 || Math.abs(r - arr[0]) > 1e-9).forEach(r => { if (Math.abs(r) < 9) s += `<circle cx="${sx(r)}" cy="${sy(0)}" r="8" fill="#FF8A3D" stroke="#7C2D12" stroke-width="2.5"/>`; });
  return s + '</svg>';
}
function updateQuad() {
  const out = document.getElementById('quadOut');

  const en = EN(), a = qA(), b = Q.b, c = Q.c, D = b * b - 4 * a * c;
  document.getElementById('qAv').textContent = sgn(a); document.getElementById('qBv').textContent = sgn(b); document.getElementById('qCv').textContent = sgn(c);
  const sq = Math.sqrt(D), perfect = D >= 0 && Number.isInteger(sq);
  const bt = b === 0 ? '' : (b > 0 ? ' + ' : ' − ') + (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'x', ct = c === 0 ? '' : (c > 0 ? ' + ' : ' − ') + Math.abs(c);
  let ans;
  if (D < 0) ans = en ? 'No real solution — the parabola never touches the x-axis' : 'ไม่มีคำตอบ (ในจำนวนจริง) — พาราโบลาไม่แตะแกน x';
  else if (D === 0) ans = `x = ${rf(-b, 2 * a)} <span class="note">(${en ? 'one solution' : 'คำตอบเดียว'})</span>`;

  out.innerHTML = `
    <div class="formula">${term(a, 'x²')}${bt}${ct} = 0</div>

      b² − 4ac = (${sgn(b)})² − 4(${sgn(a)})(${sgn(c)}) = <b>${sgn(D)}</b><br>
      ${D >= 0 ? `x = ${frac('−(' + sgn(b) + ') ± ' + rad(D), '2(' + sgn(a) + ')')}` : ''}

      <tr class="${D > 0 ? 'live' : ''}"><td>&gt; 0</td><td>${en ? '2 solutions' : 'มี 2 คำตอบ'}</td><td>${en ? 'cuts the x-axis at 2 points' : 'ตัดแกน x 2 จุด'}</td></tr>

      <tr class="${D < 0 ? 'live' : ''}"><td>&lt; 0</td><td>${en ? 'no real solution (∅)' : 'ไม่มีคำตอบ (ในจำนวนจริง)'}</td><td>${en ? 'misses the x-axis' : 'ไม่ตัดแกน x'}</td></tr>
    </table>`;
}

  const labels = en ? ['Nested radicals', 'Sum & product of roots'] : ['รากซ้อนราก', 'ผลบวก / ผลคูณของคำตอบ'];
  let body = '';
  if (SEL.tr === 1) {
    body = wkHtml('rt1', 0) + `
      <div class="card">
        <div class="card-title"><span class="icon">🎛️</span><span>${en ? 'Try your own' : 'ลองเอง'}</span></div>
        <p class="intro">${en ? 'Pick two numbers p and q. The machine builds ' + rad('(p + q) + 2' + rad('pq')) + ' and unwraps it.' : 'เลือกสองจำนวน p และ q ระบบจะสร้าง ' + rad('(p + q) + 2' + rad('pq')) + ' แล้วแกะให้ดู'}</p>
        <div class="slider-row"><b>p =</b><input type="range" id="rP" min="1" max="9" step="1" value="${RT.p}" oninput="RT.p=parseFloat(this.value);updateRt()"><span class="slider-val" id="rPv"></span></div>
        <div class="slider-row"><b>q =</b><input type="range" id="rQ" min="1" max="9" step="1" value="${RT.q}" oninput="RT.q=parseFloat(this.value);updateRt()"><span class="slider-val" id="rQv"></span></div>
        <div id="rtOut"></div>
      </div>`;
  } else {
    const chips = [2, 3].map(n => `<button class="chip ${RS.n === n ? 'active' : ''}" onclick="RS.n=${n};renderTrick()">${en ? (n === 2 ? 'Quadratic (2 roots)' : 'Cubic (3 roots)') : (n === 2 ? 'กำลังสอง (2 คำตอบ)' : 'กำลังสาม (3 คำตอบ)')}</button>`).join('');
    const sl = [0, 1, 2].slice(0, RS.n).map(i => `<div class="slider-row"><b>x${['₁', '₂', '₃'][i]} =</b><input type="range" id="sR${i}" min="-5" max="5" step="1" value="${RS.r[i]}" oninput="RS.r[${i}]=parseFloat(this.value);updateRs()"><span class="slider-val" id="sR${i}v"></span></div>`).join('');
    body = `<div class="card">
        <div class="card-title"><span class="icon">➕✖️</span><span>${en ? 'Sum and product of the roots' : 'ผลบวก และ ผลคูณ ของคำตอบ'}</span></div>
        <div class="intro">
          <div>${en ? '<b>Sum</b> = −(second coefficient) ÷ (leading coefficient)' : '<b>ผลบวก</b> = − (สปส. ตัวรอง) ÷ (สปส. ตัวใหญ่)'}</div>
          <div>${en ? '<b>Product</b> = (−1)ⁿ × (constant) ÷ (leading coefficient)' : '<b>ผลคูณ</b> = (−1)ⁿ × (ตัวเล็กสุด) ÷ (สปส. ตัวใหญ่)'}</div>
        </div>
        <p class="intro">${en ? 'Choose the roots yourself and see the polynomial they build.' : 'เลือกคำตอบเองแล้วดูว่าสมการที่ได้หน้าตาเป็นอย่างไร'}</p>
        <div class="chips">${chips}</div>${sl}
        <div class="slider-row"><b>a =</b><input type="range" id="sK" min="1" max="3" step="1" value="${RS.k}" oninput="RS.k=parseFloat(this.value);updateRs()"><span class="slider-val" id="sKv"></span></div>
        <div id="rsOut"></div>
      </div>`;
  }

    <div class="card">
      <div class="card-title"><span class="icon">✨</span><span>${en ? 'Handy tricks' : 'ทริกที่ใช้บ่อย'}</span></div>
      ${chipRow('tr', labels)}

  if (SEL.tr === 1) updateRt(); else updateRs();
}
function updateRt() {
  const out = document.getElementById('rtOut'); if (!out) return;
  const en = EN(), { p, q } = RT, s = p + q, n = p * q;
  document.getElementById('rPv').textContent = p; document.getElementById('rQv').textContent = q;
  const plus = Math.sqrt(s + 2 * Math.sqrt(n)), plusAns = Math.sqrt(p) + Math.sqrt(q);
  const minus = Math.sqrt(s - 2 * Math.sqrt(n)), minusAns = Math.abs(Math.sqrt(q) - Math.sqrt(p));
  out.innerHTML = `
    <div class="formula">${rad(s + ' + 2' + rad(n))} &nbsp;=&nbsp; ?</div>
    ${al([[`${p} + ${q}`, '=', s], [`${p} × ${q}`, '=', n]])}
    <div class="readout">
      ${rad(s + ' + 2' + rad(n))} = ${rad(p + ' + ' + q + ' + 2' + rad(p + ' · ' + q))} = <b>${rad(p)} + ${rad(q)}</b><br>
      <small>${en ? 'check' : 'ตรวจ'}: ${fmt(plus)} = ${fmt(plusAns)} ✓</small><br><br>
      ${en ? 'With a minus sign:' : 'ถ้าเป็นเครื่องหมายลบ:'} ${rad(s + ' − 2' + rad(n))} = <b>|${rad(p)} − ${rad(q)}|</b> ${en ? '(always the bigger root minus the smaller)' : '(เอาตัวใหญ่ลบตัวเล็ก ให้ได้ค่าบวก)'}<br>
      <small>${en ? 'check' : 'ตรวจ'}: ${fmt(minus)} = ${fmt(minusAns)} ✓</small>
    </div>`;
}
function updateRs() {
  const out = document.getElementById('rsOut'); if (!out) return;
  const en = EN(), n = RS.n, r = RS.r.slice(0, n), k = RS.k;
  r.forEach((v, i) => { document.getElementById('sR' + i + 'v').textContent = sgn(v); });
  document.getElementById('sKv').textContent = k;
  let co, S, Pd;
  if (n === 2) { co = [k, -k * (r[0] + r[1]), k * r[0] * r[1]]; S = r[0] + r[1]; Pd = r[0] * r[1]; }
  else { co = [k, -k * (r[0] + r[1] + r[2]), k * (r[0] * r[1] + r[0] * r[2] + r[1] * r[2]), -k * r[0] * r[1] * r[2]]; S = r[0] + r[1] + r[2]; Pd = r[0] * r[1] * r[2]; }
  const br = r.map(v => v === 0 ? 'x' : v > 0 ? `(x − ${v})` : `(x + ${-v})`).join('');
  const sumCo = -co[1] / co[0], prodCo = (n % 2 === 0 ? 1 : -1) * co[n] / co[0];
  out.innerHTML = `
    <div class="formula">${k === 1 ? '' : k}${br} = 0</div>
    ${al([[k === 1 ? br : k + br, '=', '0'], [polyStr(co), '=', '0']])}
    <div class="readout">
      ${en ? 'Sum of the roots' : 'ผลบวกของคำตอบ'}: ${r.map(sgn).join(' + ')} = <b>${sgn(S)}</b><br>
      ${en ? 'Formula' : 'จากสูตร'}: − ${frac('(' + sgn(co[1]) + ')', sgn(co[0]))} = <b>${rf(-co[1], co[0])}</b> ${Math.abs(sumCo - S) < 1e-9 ? '✅' : '❌'}<br>
      ${en ? 'Product of the roots' : 'ผลคูณของคำตอบ'}: ${r.map(sgn).join(' × ')} = <b>${sgn(Pd)}</b><br>
      ${en ? 'Formula' : 'จากสูตร'}: (−1)<sup>${n}</sup> · ${frac(sgn(co[n]), sgn(co[0]))} = <b>${rf((n % 2 === 0 ? 1 : -1) * co[n], co[0])}</b> ${Math.abs(prodCo - Pd) < 1e-9 ? '✅' : '❌'}
    </div>`;
}

let qIdx = 0, score = 0, answered = false;
function qt(key) {
  const en = EN();
  return { prog: en ? `Question ${qIdx + 1} / ${quizData.length}` : `ข้อที่ ${qIdx + 1} / ${quizData.length}`,
    ok: en ? '✅ Correct! ' : '✅ ถูกต้อง! ', bad: en ? '❌ Not quite — ' : '❌ ไม่ถูกต้อง — ', title: en ? 'Your Score' : 'ผลคะแนนของคุณ' }[key];
}
function grade(s) {
  const r = s / quizData.length;
  if (EN()) return r >= .9 ? '🌟 Excellent!' : r >= .7 ? '👍 Great job!' : r >= .5 ? '💪 Not bad, review a bit' : '📚 Go back and review';
  return r >= .9 ? '🌟 ยอดเยี่ยมมาก!' : r >= .7 ? '👍 ดีมาก!' : r >= .5 ? '💪 พอใช้ได้ ลองทบทวนดูนะ' : '📚 ลองกลับไปทบทวนอีกรอบ';
}
function initQuiz() {
  qIdx = 0; score = 0; answered = false;
  document.getElementById('quizScore').textContent = 0;
  document.getElementById('quizTotal').textContent = quizData.length;
  document.getElementById('btnRetry').style.display = 'none';
  renderQuestion();
}
function renderQuestion() {
  const q = quizData[qIdx], en = EN();
  answered = false;
  document.getElementById('quizProgress').textContent = qt('prog');
  document.getElementById('btnNext').style.display = 'none';
  const opts = (en && q.opts_en) ? q.opts_en : q.opts;
  document.getElementById('quizBox').innerHTML = `
    <div class="quiz-q">${qIdx + 1}. ${en ? q.q_en : q.q_th}</div>
    <div class="quiz-opts">${opts.map((o, i) => `<button class="quiz-opt" onclick="answer(${i})">${o}</button>`).join('')}</div>
    <div class="quiz-feedback" id="qfb"></div>`;
}
function refreshQuizLang() {
  const box = document.getElementById('quizBox');
  if (!box || !box.querySelector('.quiz-q')) return;
  const q = quizData[qIdx], en = EN();
  document.getElementById('quizProgress').textContent = qt('prog');
  box.querySelector('.quiz-q').innerHTML = `${qIdx + 1}. ${en ? q.q_en : q.q_th}`;
  const opts = (en && q.opts_en) ? q.opts_en : q.opts;
  box.querySelectorAll('.quiz-opt').forEach((b, i) => b.innerHTML = opts[i]);
  if (answered) {
    const fb = document.getElementById('qfb');
    if (fb) fb.innerHTML = (fb.classList.contains('ok') ? qt('ok') : qt('bad')) + (en ? q.exp_en : q.exp_th);
  }
  const card = document.getElementById('scoreCard');
  if (card) card.outerHTML = scoreCardHtml();
}
function scoreCardHtml() {
  return `<div id="scoreCard" style="margin-top:20px; background:linear-gradient(135deg,#1C3B22,#2E5936); color:white; border-radius:16px; padding:24px; text-align:center;">
    <div style="font-size:2.5rem;">🎉</div><div style="font-size:1.5rem; font-weight:800; margin:8px 0;">${qt('title')}</div>
    <div style="font-size:3rem; font-weight:800;">${score} / ${quizData.length}</div>
    <div style="font-size:1.1rem; opacity:.9; margin-top:8px;">${grade(score)}</div></div>`;
}
function answer(i) {
  if (answered) return;
  answered = true;
  const q = quizData[qIdx], exp = EN() ? q.exp_en : q.exp_th, fb = document.getElementById('qfb');
  document.querySelectorAll('.quiz-opt').forEach((b, idx) => {
    if (idx === q.ans) b.classList.add('correct'); else if (idx === i) b.classList.add('wrong');
    b.style.pointerEvents = 'none';
  });
  if (i === q.ans) { score++; document.getElementById('quizScore').textContent = score; fb.className = 'quiz-feedback ok'; fb.innerHTML = qt('ok') + exp; }
  else { fb.className = 'quiz-feedback err'; fb.innerHTML = qt('bad') + exp; }
  if (qIdx < quizData.length - 1) document.getElementById('btnNext').style.display = 'inline-block';
  else {
    document.getElementById('btnRetry').style.display = 'inline-block';
    setTimeout(() => { document.getElementById('quizBox').insertAdjacentHTML('beforeend', scoreCardHtml()); }, 300);
  }
}
function nextQuestion() { qIdx++; renderQuestion(); }

window.addEventListener('load', () => { initQuiz(); applyLang(getLang()); });
</script>

new MutationObserver(syncThemeButton).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
